name: Probe process-group kill syntax

on:
  pull_request:
    paths:
      - ".github/workflows/probe-process-group-kill.yml"
      - "investigations/process-group-kill-syntax/**"
      - "tests/test_process_group_kill_probe.py"
      - "tests/test_process_group_kill_zero_status_selection.py"
      - "tools/probe_process_group_kill.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debian-sid:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out proposed repository state
        uses: actions/checkout@v4

      - name: Run patched disposable sid topology matrix twice
        shell: bash
        run: |
          set -euo pipefail
          results="$RUNNER_TEMP/process-group-kill"
          mkdir -p "$results"
          docker run --rm \
            --volume "$PWD:/work:ro" \
            --volume "$results:/results" \
            --workdir /work \
            debian:sid-slim \
            bash -lc '
              set -euo pipefail
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install --yes --no-install-recommends \
                dash patch procps python3
              dpkg-query -W \
                -f="\${binary:Package}\t\${Version}\t\${Architecture}\n" \
                dash patch procps python3 \
                | tee /results/package-versions.tsv
              /bin/kill --version \
                | tee /results/kill-version.txt
              /bin/dash -c "echo dash=\$0" \
                | tee /results/dash-version.txt

              candidate=/tmp/process-group-kill-candidate
              mkdir -p "$candidate/tools"
              cp tools/probe_process_group_kill.py \
                "$candidate/tools/probe_process_group_kill.py"
              patch_log=/results/patch-application.txt
              patch \
                --batch \
                --forward \
                --fuzz=0 \
                --directory "$candidate" \
                -p1 \
                --input \
                /work/investigations/process-group-kill-syntax/0001-require-zero-command-status.patch \
                2>&1 | tee "$patch_log"
              if grep -Eiq "fuzz|offset" "$patch_log"; then
                echo "candidate patch used fuzz or offset" >&2
                exit 1
              fi
              python3 -m py_compile \
                "$candidate/tools/probe_process_group_kill.py"
              sha256sum \
                /work/tools/probe_process_group_kill.py \
                /work/investigations/process-group-kill-syntax/0001-require-zero-command-status.patch \
                "$candidate/tools/probe_process_group_kill.py" \
                > /results/source-identities.sha256

              python3 -W error::ResourceWarning \
                "$candidate/tools/probe_process_group_kill.py" \
                --output /results/run-1.json \
                > /results/run-1.stdout \
                2> /results/run-1.stderr
              python3 -W error::ResourceWarning \
                "$candidate/tools/probe_process_group_kill.py" \
                --output /results/run-2.json \
                > /results/run-2.stdout \
                2> /results/run-2.stderr
            '

      - name: Classify exact topology, status, and rerun evidence
        shell: bash
        run: |
          set -euo pipefail
          results="$RUNNER_TEMP/process-group-kill"
          python3 - "$results" <<'PY'
          import json
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1])
          expected_names = {
              "owner-only-external",
              "external-long",
              "external-short",
              "external-compact",
              "dash-builtin-short",
              "python-killpg-control",
          }
          candidate_names = {
              "dash-builtin-short",
              "external-short",
              "external-compact",
              "external-long",
          }

          def require(condition, message):
              if not condition:
                  raise SystemExit(message)

          records = []
          for iteration in (1, 2):
              path = root / f"run-{iteration}.json"
              record = json.loads(path.read_text(encoding="utf-8"))
              require(
                  type(record.get("schema_version")) is int
                  and record["schema_version"] == 1,
                  f"run {iteration}: invalid schema: {record}",
              )
              require(
                  type(record.get("kill_version")) is str
                  and bool(record["kill_version"]),
                  f"run {iteration}: missing kill version",
              )
              require(
                  type(record.get("dash_version")) is str
                  and bool(record["dash_version"]),
                  f"run {iteration}: missing dash version",
              )
              results = record.get("results")
              require(type(results) is list, f"run {iteration}: results is not a list")
              require(
                  len(results) == len(expected_names),
                  f"run {iteration}: unexpected result count: {results}",
              )
              by_name = {}
              for result in results:
                  require(type(result) is dict, f"run {iteration}: non-object result")
                  name = result.get("name")
                  require(
                      type(name) is str and name not in by_name,
                      f"run {iteration}: invalid or duplicate case name: {name!r}",
                  )
                  require(
                      type(result.get("returncode")) is int,
                      f"run {iteration}: invalid returncode for {name}: {result}",
                  )
                  by_name[name] = result
              require(
                  set(by_name) == expected_names,
                  f"run {iteration}: case inventory mismatch: {sorted(by_name)}",
              )

              owner = by_name["owner-only-external"]
              require(
                  owner.get("classification") == "owner-only-delivery"
                  and owner.get("returncode") == 0
                  and owner.get("parent_signal") == 2
                  and owner.get("child_signal") is None
                  and owner.get("parent_running") is False
                  and owner.get("child_running") is True
                  and owner.get("unrelated_running") is True,
                  f"run {iteration}: owner-only negative control failed: {owner}",
              )

              positive = by_name["python-killpg-control"]
              require(
                  positive.get("classification") == "whole-group-delivery"
                  and positive.get("returncode") == 0
                  and positive.get("parent_signal") == 2
                  and positive.get("child_signal") == 2
                  and positive.get("parent_running") is False
                  and positive.get("child_running") is False
                  and positive.get("unrelated_running") is True,
                  f"run {iteration}: Python killpg control failed: {positive}",
              )

              selected = record.get("selected_candidate")
              require(
                  selected in candidate_names,
                  f"run {iteration}: invalid selected candidate: {selected!r}",
              )
              candidate = by_name[selected]
              require(
                  candidate.get("classification") == "whole-group-delivery"
                  and candidate.get("returncode") == 0
                  and candidate.get("parent_signal") == 2
                  and candidate.get("child_signal") == 2
                  and candidate.get("parent_running") is False
                  and candidate.get("child_running") is False
                  and candidate.get("unrelated_running") is True,
                  f"run {iteration}: selected candidate failed topology/status: {candidate}",
              )
              records.append((record, by_name))

          require(
              records[0][0]["kill_version"] == records[1][0]["kill_version"],
              "kill version changed between immediate reruns",
          )
          require(
              records[0][0]["dash_version"] == records[1][0]["dash_version"],
              "dash version changed between immediate reruns",
          )
          require(
              records[0][0]["selected_candidate"]
              == records[1][0]["selected_candidate"],
              "selected candidate changed between immediate reruns",
          )
          print("selected_candidate=" + records[0][0]["selected_candidate"])
          for name in sorted(expected_names):
              result = records[0][1][name]
              print(
                  f"{name}={result['classification']}, "
                  f"status={result['returncode']}"
              )
          PY

      - name: Upload process-group evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: process-group-kill-sid
          path: ${{ runner.temp }}/process-group-kill/
          if-no-files-found: error
          retention-days: 14
