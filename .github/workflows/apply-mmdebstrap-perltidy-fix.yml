name: Apply mmdebstrap perltidy fix

on:
  push:
    branches:
      - fix/mmdebstrap-perltidy-current
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mmdebstrap-perltidy-current
          fetch-depth: 0

      - name: Apply current perltidy-compatible formatting
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path('upstream/mmdebstrap/mmdebstrap')
          source = source_path.read_text()
          old_source = """        $options->{root}\n          = tempdir('mmdebstrap.XXXXXXXXXX', @tempdir_options);\n"""
          new_source = """        $options->{root} = tempdir('mmdebstrap.XXXXXXXXXX', @tempdir_options);\n"""
          if source.count(old_source) != 1:
              raise SystemExit('unexpected source assignment count')
          source_path.write_text(source.replace(old_source, new_source))

          patch_path = Path('investigations/mmdebstrap-unwritable-tmpdir/submission/0001-honor-explicit-tmpdir.patch')
          patch = patch_path.read_text()
          replacements = {
              '@@ -6868,7 +6868,12 @@': '@@ -6868,7 +6868,11 @@',
              "+        $options->{root}\n+          = tempdir('mmdebstrap.XXXXXXXXXX', @tempdir_options);\n": "+        $options->{root} = tempdir('mmdebstrap.XXXXXXXXXX', @tempdir_options);\n",
              '@@ -8970,11 +8975,16 @@': '@@ -8970,11 +8974,16 @@',
          }
          for old, new in replacements.items():
              if patch.count(old) != 1:
                  raise SystemExit(f'unexpected patch occurrence for {old!r}')
              patch = patch.replace(old, new)
          patch_path.write_text(patch)
          PY

      - name: Validate patch and formatting
        shell: bash
        run: |
          set -eux
          test "$(awk 'length > 79 { print NR }' upstream/mmdebstrap/mmdebstrap | wc -l)" -eq 0
          perl -c upstream/mmdebstrap/mmdebstrap
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          cp -a investigations/mmdebstrap-unwritable-tmpdir/pristine/. "$work"/
          patch -d "$work" -p1 --dry-run < investigations/mmdebstrap-unwritable-tmpdir/submission/0001-honor-explicit-tmpdir.patch
          patch -d "$work" -p1 < investigations/mmdebstrap-unwritable-tmpdir/submission/0001-honor-explicit-tmpdir.patch
          cmp "$work/mmdebstrap" upstream/mmdebstrap/mmdebstrap
          cmp "$work/coverage.txt" upstream/mmdebstrap/coverage.txt
          cmp "$work/tests/fail-with-unwritable-tmpdir" upstream/mmdebstrap/tests/fail-with-unwritable-tmpdir

      - name: Commit corrected source and patch
        shell: bash
        run: |
          rm .github/workflows/apply-mmdebstrap-perltidy-fix.yml
          rm -f .github/mmdebstrap-perltidy-trigger
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Format mmdebstrap TMPDIR assignment for current perltidy'
          git push origin HEAD:fix/mmdebstrap-perltidy-current
