name: Apply mmdebstrap TMPDIR fix

on:
  push:
    branches:
      - investigate/mmdebstrap-unwritable-tmpdir
    paths:
      - "patches/mmdebstrap-explicit-tmpdir.patch"
      - ".github/workflows/apply-mmdebstrap-tmpdir-fix.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out investigation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply candidate patch
        run: |
          set -euxo pipefail
          git apply --check patches/mmdebstrap-explicit-tmpdir.patch
          git apply patches/mmdebstrap-explicit-tmpdir.patch
          chmod +x upstream/mmdebstrap/tests/fail-with-unwritable-tmpdir

      - name: Commit patched source and regression test
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add upstream/mmdebstrap/mmdebstrap \
            upstream/mmdebstrap/coverage.txt \
            upstream/mmdebstrap/tests/fail-with-unwritable-tmpdir
          git commit -m "Fail when an explicit TMPDIR is unusable"
          git push origin HEAD:${GITHUB_REF_NAME}
