name: Verify coreutils sort FIFO 13172

on:
  push:
    branches:
      - investigate/coreutils-sort-fifo-single-open-13172
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out controlled coreutils candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: teamleaderleo/coreutils
          ref: fieldwork/sort-fifo-single-open-13172
          path: coreutils
          fetch-depth: 1
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable
          components: clippy,rustfmt

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: coreutils

      - name: Record exact staged identity
        working-directory: coreutils
        run: |
          git rev-parse HEAD
          git rev-parse HEAD:.fieldwork/apply-sort-fifo-single-open.py
          git rev-parse HEAD:.github/workflows/fieldwork-sort-fifo-single-open.yml

      - name: Apply and format candidate
        working-directory: coreutils
        run: |
          set -euo pipefail
          python3 .fieldwork/apply-sort-fifo-single-open.py
          cargo fmt --all
          test "$(git diff --name-only | sort)" = $'src/uu/sort/src/sort.rs\ntests/by-util/test_sort.rs'
          cargo fmt --all -- --check
          git diff --check

      - name: Run focused FIFO tests
        working-directory: coreutils
        run: |
          cargo test --features sort --no-default-features test_named_fifo_unterminated_line_is_consumed_once
          cargo test --features sort --no-default-features test_missing_file_is_reported_before_waiting_on_fifo

      - name: Run sort integration module
        working-directory: coreutils
        run: cargo test --features sort --no-default-features --test tests test_sort

      - name: Run focused clippy
        working-directory: coreutils
        run: cargo clippy --features sort --no-default-features --all-targets -- -D warnings

      - name: Record candidate diff
        if: always()
        working-directory: coreutils
        run: |
          git diff --stat
          git diff -- src/uu/sort/src/sort.rs tests/by-util/test_sort.rs
