name: Cloud Hypervisor QCOW fresh L2 reopen

on:
  push:
    branches:
      - research/ch-migration-rollback-probes
    paths:
      - .github/workflows/ch-qcow-fresh-l2-reopen.yml
      - investigations/cloud-hypervisor-qcow-fresh-l2-reopen/apply_probe.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qcow-fresh-l2-reopen:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CH_SHA: 1af93ac7035cda77cd87b0c18b1134ebb0928052
      TEST_NAME: formats::qcow::metadata::unit_tests::failed_fresh_l2_becomes_reusable_after_clean_reopen
    steps:
      - name: Check out Fieldwork carrier
        uses: actions/checkout@v4
        with:
          path: fieldwork
          persist-credentials: false

      - name: Check out exact Cloud Hypervisor source
        uses: actions/checkout@v4
        with:
          repository: cloud-hypervisor/cloud-hypervisor
          ref: ${{ env.CH_SHA }}
          path: cloud-hypervisor
          persist-credentials: false

      - name: Pin Rust 1.89.0
        working-directory: cloud-hypervisor
        run: |
          rustup toolchain install 1.89.0 --profile minimal
          rustup component add --toolchain 1.89.0 rustfmt clippy
          rustup override set 1.89.0
          rustc --version | tee ../qcow-rust-version.txt
          git rev-parse HEAD | tee ../qcow-source-sha.txt
          test "$(git rev-parse HEAD)" = "$CH_SHA"

      - name: Apply exact-current QCOW reopen probe
        working-directory: cloud-hypervisor
        run: |
          python3 ../fieldwork/investigations/cloud-hypervisor-qcow-fresh-l2-reopen/apply_probe.py
          git diff --check
          cargo fmt --all -- --check
          git diff -- block/src/formats/qcow/metadata.rs > ../qcow-probe.diff

      - name: Build and discover exact focused test
        working-directory: cloud-hypervisor
        run: |
          cargo test -p block --lib --no-run
          cargo test -p block --lib -- --list | tee ../qcow-test-list.txt
          grep -F "$TEST_NAME: test" ../qcow-test-list.txt

      - name: Prove live L2 re-enters allocator after clean reopen
        working-directory: cloud-hypervisor
        shell: bash
        run: |
          set -o pipefail
          cargo test -p block --lib "$TEST_NAME" -- --exact --nocapture \
            | tee ../qcow-baseline.log

      - name: Quality control on probe-only source
        working-directory: cloud-hypervisor
        shell: bash
        run: |
          set -o pipefail
          cargo clippy -p block --lib --tests -- -D warnings \
            | tee ../qcow-clippy.log

      - name: Write receipt
        shell: bash
        run: |
          {
            echo "source=$CH_SHA"
            cat qcow-rust-version.txt
            echo "test=$TEST_NAME"
            echo "baseline_reuse_proof=pass"
            echo "probe_clippy=pass"
          } | tee qcow-receipt.txt

      - name: Upload receipt
        uses: actions/upload-artifact@v4
        with:
          name: ch-qcow-fresh-l2-reopen-receipt
          path: |
            qcow-receipt.txt
            qcow-source-sha.txt
            qcow-rust-version.txt
            qcow-test-list.txt
            qcow-baseline.log
            qcow-clippy.log
            qcow-probe.diff
