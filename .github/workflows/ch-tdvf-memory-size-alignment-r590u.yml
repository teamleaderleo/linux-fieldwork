name: Cloud Hypervisor TDVF memory-size alignment R590U

on:
  push:
    branches: [research/ch-tdvf-memory-size-alignment-r590u]
    paths:
      - .github/workflows/ch-tdvf-memory-size-alignment-r590u.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tdvf-memory-size-alignment:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CH_SHA: 1af93ac7035cda77cd87b0c18b1134ebb0928052
      FEATURES: arch/tdx,arch/kvm,hypervisor/tdx,hypervisor/kvm
      WITNESS: x86_64::tdx::memory_size_alignment_probe_tests::tdvf_unaligned_memory_size_is_accepted_baseline
      INVARIANT: x86_64::tdx::memory_size_alignment_probe_tests::tdvf_memory_size_must_be_page_aligned
      CONTROL: x86_64::tdx::memory_size_alignment_probe_tests::tdvf_page_aligned_memory_size_is_valid
      CANDIDATE_BAD: x86_64::tdx::memory_size_alignment_candidate_tests::tdvf_unaligned_memory_size_is_typed_error
      CANDIDATE_CONTROL: x86_64::tdx::memory_size_alignment_candidate_tests::tdvf_page_aligned_memory_size_remains_valid

    steps:
      - name: Check out Fieldwork carrier
        uses: actions/checkout@v4
        with:
          path: fieldwork
          persist-credentials: false

      - name: Check out exact Cloud Hypervisor source
        uses: actions/checkout@v4
        with:
          repository: cloud-hypervisor/cloud-hypervisor
          ref: ${{ env.CH_SHA }}
          path: cloud-hypervisor
          persist-credentials: false

      - name: Pin source, toolchains, and backend truncation seam
        id: source
        working-directory: cloud-hypervisor
        shell: bash
        run: |
          set -euxo pipefail
          rustup toolchain install 1.89.0 --profile minimal
          rustup component add --toolchain 1.89.0 clippy
          rustup toolchain install nightly --profile minimal --component rustfmt
          rustup override set 1.89.0
          rustc --version | tee ../tdvf-memory-align-rust-version.txt
          rustc +nightly --version | tee ../tdvf-memory-align-nightly-version.txt
          git rev-parse HEAD | tee ../tdvf-memory-align-source-sha.txt
          test "$(git rev-parse HEAD)" = "$CH_SHA"
          test -z "$(git status --short)"
          python3 - <<'PY'
          from pathlib import Path
          text = Path('hypervisor/src/kvm/mod.rs').read_text()
          assert 'pages: (size / 4096).try_into().unwrap(),' in text
          print('TDVF_MEMORY_ALIGN_BACKEND pages_expression=size/4096')
          PY

      - name: Apply and format baseline probe
        id: probe
        working-directory: cloud-hypervisor
        shell: bash
        run: |
          set -euxo pipefail
          python3 ../fieldwork/investigations/cloud-hypervisor-tdvf-memory-size-alignment/apply_probe.py
          cargo +nightly fmt --all
          cargo +nightly fmt --all -- --check
          git diff --check
          git diff -- arch/src/x86_64/tdx/mod.rs > ../tdvf-memory-align-probe.diff

      - name: Build and discover baseline probes
        id: discover
        working-directory: cloud-hypervisor
        shell: bash
        run: |
          set -euxo pipefail
          cargo test --locked -p arch -p hypervisor --features "$FEATURES" --lib --no-run
          cargo test --locked -p arch -p hypervisor --features "$FEATURES" --lib -- --list | tee ../tdvf-memory-align-test-list.txt
          grep -F "$WITNESS: test" ../tdvf-memory-align-test-list.txt
          grep -F "$INVARIANT: test" ../tdvf-memory-align-test-list.txt
          grep -F "$CONTROL: test" ../tdvf-memory-align-test-list.txt

      - name: Baseline aligned control
        id: baseline_control
        working-directory: cloud-hypervisor
        shell: bash
        run: |
          set -euxo pipefail
          cargo test --locked -p arch -p hypervisor --features "$FEATURES" --lib "$CONTROL" -- --exact --nocapture \
            2>&1 | tee ../tdvf-memory-align-baseline-control.log
          grep -F "TDVF_MEMORY_ALIGN_CONTROL memory_size=0x2000" ../tdvf-memory-align-baseline-control.log

      - name: Prove baseline accepts size that backend truncates
        id: baseline_witness
        working-directory: cloud-hypervisor
        shell: bash
        run: |
          set -euxo pipefail
          cargo test --locked -p arch -p hypervisor --features "$FEATURES" --lib "$WITNESS" -- --ignored --exact --nocapture \
            2>&1 | tee ../tdvf-memory-align-baseline-witness.log
          grep -F "TDVF_MEMORY_ALIGN_BASELINE memory_size=0x1800 backend_pages=1 backend_bytes=0x1000 dropped=0x800" ../tdvf-memory-align-baseline-witness.log

      - name: Prove alignment invariant loses on baseline
        id: baseline_invariant
        working-directory: cloud-hypervisor
        shell: bash
        run: |
          set +e
          cargo test --locked -p arch -p hypervisor --features "$FEATURES" --lib "$INVARIANT" -- --exact --nocapture \
            > ../tdvf-memory-align-baseline-invariant.log 2>&1
          rc=$?
          set -e
          echo "TDVF_MEMORY_ALIGN_BASELINE_INVARIANT_RC=$rc" | tee ../tdvf-memory-align-baseline-invariant-status.txt
          cat ../tdvf-memory-align-baseline-invariant.log
          test "$rc" -ne 0
          grep -F "TDVF MemoryDataSize must be 4 KiB aligned" ../tdvf-memory-align-baseline-invariant.log

      - name: Restore exact source after baseline probe
        id: restore
        working-directory: cloud-hypervisor
        shell: bash
        run: |
          set -euxo pipefail
          git checkout -- arch/src/x86_64/tdx/mod.rs
          test -z "$(git status --short)"
          test "$(git rev-parse HEAD)" = "$CH_SHA"

      - name: Apply memory-size alignment candidate
        id: candidate_apply
        working-directory: cloud-hypervisor
        shell: bash
        run: |
          set -euxo pipefail
          python3 ../fieldwork/investigations/cloud-hypervisor-tdvf-memory-size-alignment/apply_candidate.py
          cargo +nightly fmt --all
          cargo +nightly fmt --all -- --check
          git diff --check
          git diff -- arch/src/x86_64/tdx/mod.rs > ../tdvf-memory-align-candidate-only.diff
          sha256sum ../tdvf-memory-align-candidate-only.diff | tee ../tdvf-memory-align-candidate-diff-sha256.txt
          grep -F "InvalidSectionMemorySizeAlignment" arch/src/x86_64/tdx/mod.rs

      - name: Candidate focused typed matrix
        id: candidate_focused
        working-directory: cloud-hypervisor
        shell: bash
        run: |
          set -euxo pipefail
          cargo test --locked -p arch -p hypervisor --features "$FEATURES" --lib "$CANDIDATE_BAD" -- --exact --nocapture \
            2>&1 | tee ../tdvf-memory-align-candidate-bad.log
          cargo test --locked -p arch -p hypervisor --features "$FEATURES" --lib "$CANDIDATE_CONTROL" -- --exact --nocapture \
            2>&1 | tee ../tdvf-memory-align-candidate-control.log
          grep -F "TDVF_MEMORY_ALIGN_CANDIDATE malformed_result=Err(InvalidSectionMemorySizeAlignment { memory_size: 6144 })" ../tdvf-memory-align-candidate-bad.log
          grep -F "TDVF_MEMORY_ALIGN_CANDIDATE control memory_size=0x2000" ../tdvf-memory-align-candidate-control.log

      - name: Full arch and hypervisor TDX KVM tests
        id: broad
        working-directory: cloud-hypervisor
        shell: bash
        run: |
          set -euxo pipefail
          if [ -e /dev/kvm ]; then sudo chmod a+rw /dev/kvm; fi
          cargo test --locked -p arch -p hypervisor --features "$FEATURES" --lib \
            2>&1 | tee ../tdvf-memory-align-broad-tests.log

      - name: Clippy and hygiene
        id: quality
        working-directory: cloud-hypervisor
        shell: bash
        run: |
          set -euxo pipefail
          cargo clippy --locked -p arch -p hypervisor --features "$FEATURES" --all-targets -- \
            -D warnings -A unreachable-code -A unused-mut -A unused-variables \
            2>&1 | tee ../tdvf-memory-align-clippy.log
          cargo +nightly fmt --all -- --check
          git diff --check
          git status --short | tee ../tdvf-memory-align-final-status.txt
          git diff --stat | tee ../tdvf-memory-align-final-diff-stat.txt
          git diff -- arch/src/x86_64/tdx/mod.rs | tee ../tdvf-memory-align-final-diff.txt

      - name: Write receipt
        if: always()
        shell: bash
        run: |
          {
            echo "fieldwork_head=${GITHUB_SHA}"
            echo "source=$CH_SHA"
            echo "features=$FEATURES"
            echo "source_gate=${{ steps.source.outcome }}"
            echo "probe_gate=${{ steps.probe.outcome }}"
            echo "discover_gate=${{ steps.discover.outcome }}"
            echo "baseline_control=${{ steps.baseline_control.outcome }}"
            echo "baseline_witness=${{ steps.baseline_witness.outcome }}"
            echo "baseline_invariant_expected_red=${{ steps.baseline_invariant.outcome }}"
            echo "restore_exact_source=${{ steps.restore.outcome }}"
            echo "candidate_apply=${{ steps.candidate_apply.outcome }}"
            echo "candidate_focused=${{ steps.candidate_focused.outcome }}"
            echo "broad=${{ steps.broad.outcome }}"
            echo "quality=${{ steps.quality.outcome }}"
            if [ -f tdvf-memory-align-baseline-invariant-status.txt ]; then cat tdvf-memory-align-baseline-invariant-status.txt; fi
            if [ -f tdvf-memory-align-candidate-diff-sha256.txt ]; then cat tdvf-memory-align-candidate-diff-sha256.txt; fi
          } | tee tdvf-memory-align-execution-receipt.txt

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ch-tdvf-memory-size-alignment-r590u
          if-no-files-found: warn
          path: |
            tdvf-memory-align-*.txt
            tdvf-memory-align-*.log
            tdvf-memory-align-*.diff
