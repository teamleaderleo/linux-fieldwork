name: PR72 artifact diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/pr72-unit-diagnostic.yml'

permissions:
  actions: read
  contents: read

jobs:
  artifact-tail:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download retained reproduction artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/8758712312/zip" \
            > /tmp/pr72-artifact.zip

      - name: Print bounded result and failure tails
        shell: bash
        run: |
          python3 - <<'PY'
          import zipfile

          path = "/tmp/pr72-artifact.zip"
          wanted = (
              "exit-status",
              "container-exit-status",
              "result.md",
              "preflight-error.txt",
              "autopkgtest-console.log",
              "autopkgtest-output/log",
          )
          with zipfile.ZipFile(path) as archive:
              names = archive.namelist()
              print("artifact files:")
              for name in names:
                  print(name)
              for suffix in wanted:
                  matches = [name for name in names if name.endswith(suffix)]
                  for name in matches:
                      text = archive.read(name).decode("utf-8", errors="replace")
                      lines = text.splitlines()
                      limit = 260 if suffix.endswith((".log", "/log")) else len(lines)
                      print(f"\n===== {name} (last {min(limit, len(lines))} lines) =====")
                      print("\n".join(lines[-limit:]))
          PY
