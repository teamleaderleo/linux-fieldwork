name: PR72 artifact diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/pr72-unit-diagnostic.yml'

permissions:
  actions: read
  contents: read

jobs:
  artifact-tail:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download retained reproduction artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/8758712312/zip" > /tmp/a.zip
      - name: Print terminal testsuite stderr
        shell: bash
        run: |
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('/tmp/a.zip') as archive:
              lines = archive.read('autopkgtest-output/testsuite-stderr').decode('utf-8', 'replace').splitlines()
          print('\n'.join(lines[-70:]))
          PY
