name: PR72 artifact diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/pr72-unit-diagnostic.yml'

permissions:
  actions: read
  contents: read

jobs:
  artifact-tail:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download retained reproduction artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/8758712312/zip" > /tmp/a.zip
      - name: Print terminal test output
        shell: bash
        run: |
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('/tmp/a.zip') as archive:
              for name in ('autopkgtest-output/testsuite-stdout', 'autopkgtest-output/testsuite-stderr'):
                  lines = archive.read(name).decode('utf-8', 'replace').splitlines()
                  print(f'===== {name}: final 20 =====')
                  print('\n'.join(lines[-20:]))
          PY
