name: PR72 artifact diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/pr72-unit-diagnostic.yml'

permissions:
  actions: read
  contents: read

jobs:
  artifact-tail:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download retained reproduction artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/8758712312/zip" \
            > /tmp/pr72-artifact.zip

      - name: Print concise result and failure streams
        shell: bash
        run: |
          python3 - <<'PY'
          import zipfile

          wanted = {
              "exit-status": None,
              "result.md": None,
              "autopkgtest-output/summary": None,
              "autopkgtest-output/testsuite-stderr": 120,
              "autopkgtest-output/testsuite-stdout": 120,
              "autopkgtest-console.log": 100,
          }
          with zipfile.ZipFile("/tmp/pr72-artifact.zip") as archive:
              for name, limit in wanted.items():
                  text = archive.read(name).decode("utf-8", errors="replace")
                  lines = text.splitlines()
                  if limit is not None:
                      lines = lines[-limit:]
                  print(f"\n===== {name} =====")
                  print("\n".join(lines))
          PY
