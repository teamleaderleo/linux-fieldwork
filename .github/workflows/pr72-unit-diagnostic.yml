name: PR72 artifact diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/pr72-unit-diagnostic.yml'

permissions:
  actions: read
  contents: read

jobs:
  artifact-tail:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download retained reproduction artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/8758712312/zip" \
            > /tmp/pr72-artifact.zip

      - name: Extract failure signatures with context
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          import zipfile

          pattern = re.compile(
              r"fail|error|timeout|timed out|no such file|not ok|traceback|exception|"
              r"perltidy|result:|time left: 0:00:0[0-5]",
              re.IGNORECASE,
          )
          names = (
              "autopkgtest-output/summary",
              "autopkgtest-output/testsuite-stderr",
              "autopkgtest-output/testsuite-stdout",
              "autopkgtest-console.log",
          )
          with zipfile.ZipFile("/tmp/pr72-artifact.zip") as archive:
              for name in names:
                  lines = archive.read(name).decode("utf-8", errors="replace").splitlines()
                  selected = set()
                  for index, line in enumerate(lines):
                      if pattern.search(line):
                          selected.update(range(max(0, index - 3), min(len(lines), index + 4)))
                  ordered = sorted(selected)
                  if len(ordered) > 180:
                      ordered = ordered[-180:]
                  print(f"\n===== {name}: failure contexts =====")
                  previous = None
                  for index in ordered:
                      if previous is not None and index != previous + 1:
                          print("...")
                      print(f"{index + 1}: {lines[index]}")
                      previous = index
                  print(f"\n===== {name}: final 24 lines =====")
                  for index, line in enumerate(lines[-24:], start=max(1, len(lines) - 23)):
                      print(f"{index}: {line}")
          PY
