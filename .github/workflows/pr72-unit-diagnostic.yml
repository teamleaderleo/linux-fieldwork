name: PR72 artifact diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/pr72-unit-diagnostic.yml'

permissions:
  actions: read
  contents: read

jobs:
  artifact-tail:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download retained reproduction artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/8758712312/zip" > /tmp/a.zip
      - name: Print create-directory stdout block
        shell: bash
        run: |
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('/tmp/a.zip') as archive:
              lines = archive.read('autopkgtest-output/testsuite-stdout').decode('utf-8', 'replace').splitlines()
          markers = [i for i, line in enumerate(lines) if 'create-directory' in line]
          print(f'markers={markers}')
          if markers:
              pos = markers[-1]
              start = max(0, pos - 20)
              end = min(len(lines), pos + 100)
              for i in range(start, end):
                  print(f'{i + 1}: {lines[i]}')
          else:
              for i, line in enumerate(lines[-100:], start=max(1, len(lines) - 99)):
                  print(f'{i}: {line}')
          PY
