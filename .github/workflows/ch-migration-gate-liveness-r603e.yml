name: Cloud Hypervisor migration Gate liveness R603E

on:
  push:
    branches:
      - research/ch-migration-gate-liveness-r603e
    paths:
      - .github/workflows/ch-migration-gate-liveness-r603e.yml
      - investigations/cloud-hypervisor-migration-gate-liveness/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate-liveness:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CH_SHA: 1af93ac7035cda77cd87b0c18b1134ebb0928052
      BUG_TEST: migration::transport::sender_gate_liveness_tests::wait_for_pending_data_worker_error_does_not_block_gate_enqueue
      CONTROL_TEST: migration::transport::sender_gate_liveness_tests::wait_for_pending_data_full_queue_healthy_worker_completes
      SURVIVOR_TEST: migration::transport::sender_gate_liveness_tests::worker_error_with_survivor_converges_through_cleanup
    steps:
      - name: Check out Fieldwork carrier
        uses: actions/checkout@v4
        with:
          path: fieldwork
          persist-credentials: false

      - name: Check out exact Cloud Hypervisor source
        uses: actions/checkout@v4
        with:
          repository: cloud-hypervisor/cloud-hypervisor
          ref: ${{ env.CH_SHA }}
          path: cloud-hypervisor
          persist-credentials: false

      - name: Pin source and Rust
        id: source
        working-directory: cloud-hypervisor
        shell: bash
        run: |
          set -euxo pipefail
          rustup toolchain install 1.89.0 --profile minimal
          rustup component add --toolchain 1.89.0 rustfmt clippy
          rustup override set 1.89.0
          rustc --version | tee ../gate-rust-version.txt
          cargo --version | tee ../gate-cargo-version.txt
          git rev-parse HEAD | tee ../gate-source-sha.txt
          test "$(git rev-parse HEAD)" = "$CH_SHA"
          test -z "$(git status --short)"

      - name: Apply exact-current probes
        id: probe
        working-directory: cloud-hypervisor
        shell: bash
        run: |
          set -euxo pipefail
          python3 ../fieldwork/investigations/cloud-hypervisor-migration-gate-liveness/apply_probe.py
          cargo fmt --all
          cargo fmt --all -- --check
          git diff --check
          git diff -- vmm/src/migration/transport.rs > ../gate-probe.diff
          cp vmm/src/migration/transport.rs ../gate-baseline-transport.rs

      - name: Build and discover tests
        id: discover
        working-directory: cloud-hypervisor
        shell: bash
        run: |
          set -euxo pipefail
          cargo test --locked -p vmm --features kvm --lib --no-run
          cargo test --locked -p vmm --features kvm --lib -- --list | tee ../gate-test-list.txt
          grep -F "$BUG_TEST: test" ../gate-test-list.txt
          grep -F "$CONTROL_TEST: test" ../gate-test-list.txt
          grep -F "$SURVIVOR_TEST: test" ../gate-test-list.txt

      - name: Baseline full-queue healthy-worker control
        id: baseline_control
        working-directory: cloud-hypervisor
        shell: bash
        run: |
          set -euxo pipefail
          timeout --signal=TERM --kill-after=2s 10s \
            cargo test --locked -p vmm --features kvm --lib "$CONTROL_TEST" -- --exact --nocapture \
            2>&1 | tee ../gate-baseline-control.log

      - name: Prove baseline Gate enqueue blocks after worker error
        id: baseline_bug
        working-directory: cloud-hypervisor
        shell: bash
        run: |
          set +e
          timeout --signal=TERM --kill-after=2s 4s \
            cargo test --locked -p vmm --features kvm --lib "$BUG_TEST" -- --exact --nocapture \
            > ../gate-baseline-bug.log 2>&1
          rc=$?
          set -e
          echo "GATE_BASELINE_RC=$rc" | tee ../gate-baseline-status.txt
          cat ../gate-baseline-bug.log
          test "$rc" -eq 124

      - name: Apply bounded nonblocking Gate candidate
        id: gate_apply
        working-directory: cloud-hypervisor
        shell: bash
        run: |
          set -euxo pipefail
          python3 ../fieldwork/investigations/cloud-hypervisor-migration-gate-liveness/apply_candidate.py
          cargo fmt --all
          cargo fmt --all -- --check
          git diff --check
          diff -u ../gate-baseline-transport.rs vmm/src/migration/transport.rs \
            > ../gate-candidate-only.diff || test "$?" = 1
          cp vmm/src/migration/transport.rs ../gate-only-transport.rs

      - name: Gate candidate fixes Gate boundary
        id: gate_focused
        working-directory: cloud-hypervisor
        shell: bash
        run: |
          set -euxo pipefail
          timeout --signal=TERM --kill-after=2s 10s \
            cargo test --locked -p vmm --features kvm --lib "$BUG_TEST" -- --exact --nocapture \
            2>&1 | tee ../gate-only-bug.log
          timeout --signal=TERM --kill-after=2s 10s \
            cargo test --locked -p vmm --features kvm --lib "$CONTROL_TEST" -- --exact --nocapture \
            2>&1 | tee ../gate-only-control.log

      - name: Prove Gate-only repair can still strand survivor in cleanup
        id: gate_only_survivor
        working-directory: cloud-hypervisor
        shell: bash
        run: |
          set +e
          timeout --signal=TERM --kill-after=2s 4s \
            cargo test --locked -p vmm --features kvm --lib "$SURVIVOR_TEST" -- --exact --nocapture \
            > ../gate-only-survivor.log 2>&1
          rc=$?
          set -e
          echo "GATE_ONLY_SURVIVOR_RC=$rc" | tee ../gate-only-survivor-status.txt
          cat ../gate-only-survivor.log
          test "$rc" -eq 124

      - name: Apply reliable cleanup terminal-message candidate
        id: cleanup_apply
        working-directory: cloud-hypervisor
        shell: bash
        run: |
          set -euxo pipefail
          python3 ../fieldwork/investigations/cloud-hypervisor-migration-gate-liveness/apply_cleanup_candidate.py
          cargo fmt --all
          cargo fmt --all -- --check
          git diff --check
          diff -u ../gate-only-transport.rs vmm/src/migration/transport.rs \
            > ../cleanup-candidate-only.diff || test "$?" = 1
          diff -u ../gate-baseline-transport.rs vmm/src/migration/transport.rs \
            > ../gate-cleanup-combined.diff || test "$?" = 1
          git diff -- vmm/src/migration/transport.rs > ../gate-probe-plus-combined.diff

      - name: Combined focused convergence matrix
        id: combined_focused
        working-directory: cloud-hypervisor
        shell: bash
        run: |
          set -euxo pipefail
          for test_name in "$BUG_TEST" "$CONTROL_TEST" "$SURVIVOR_TEST"; do
            safe_name=$(echo "$test_name" | tr ':/' '__')
            timeout --signal=TERM --kill-after=2s 10s \
              cargo test --locked -p vmm --features kvm --lib "$test_name" -- --exact --nocapture \
              2>&1 | tee "../combined-${safe_name}.log"
          done

      - name: Grant KVM access for broad VMM tests
        id: kvm_access
        shell: bash
        run: |
          set -euxo pipefail
          test -e /dev/kvm
          ls -l /dev/kvm | tee gate-kvm-before.txt
          sudo chmod a+rw /dev/kvm
          ls -l /dev/kvm | tee gate-kvm-after.txt

      - name: Combined full VMM library tests
        id: vmm_tests
        working-directory: cloud-hypervisor
        shell: bash
        run: |
          set -euxo pipefail
          cargo test --locked -p vmm --features kvm --lib 2>&1 | tee ../gate-vmm-tests.log

      - name: Combined Clippy and hygiene
        id: quality
        working-directory: cloud-hypervisor
        shell: bash
        run: |
          set -euxo pipefail
          cargo clippy --locked -p vmm --features kvm --lib --tests -- \
            -D warnings -A unfulfilled-lint-expectations \
            2>&1 | tee ../gate-clippy.log
          cargo fmt --all -- --check
          git diff --check
          git status --short | tee ../gate-final-status.txt
          git diff --stat | tee ../gate-final-diff-stat.txt
          sha256sum ../gate-candidate-only.diff | tee ../gate-candidate-diff-sha256.txt
          sha256sum ../cleanup-candidate-only.diff | tee ../cleanup-candidate-diff-sha256.txt
          sha256sum ../gate-cleanup-combined.diff | tee ../combined-candidate-diff-sha256.txt

      - name: Write execution receipt
        if: always()
        shell: bash
        run: |
          {
            echo "fieldwork_head=${GITHUB_SHA}"
            echo "source=$CH_SHA"
            echo "source_gate=${{ steps.source.outcome }}"
            echo "probe_gate=${{ steps.probe.outcome }}"
            echo "discover_gate=${{ steps.discover.outcome }}"
            echo "baseline_control=${{ steps.baseline_control.outcome }}"
            echo "baseline_bug_expected_timeout=${{ steps.baseline_bug.outcome }}"
            echo "gate_apply=${{ steps.gate_apply.outcome }}"
            echo "gate_focused=${{ steps.gate_focused.outcome }}"
            echo "gate_only_survivor_expected_timeout=${{ steps.gate_only_survivor.outcome }}"
            echo "cleanup_apply=${{ steps.cleanup_apply.outcome }}"
            echo "combined_focused=${{ steps.combined_focused.outcome }}"
            echo "kvm_access=${{ steps.kvm_access.outcome }}"
            echo "vmm_tests=${{ steps.vmm_tests.outcome }}"
            echo "quality=${{ steps.quality.outcome }}"
            test -f gate-baseline-status.txt && cat gate-baseline-status.txt
            test -f gate-only-survivor-status.txt && cat gate-only-survivor-status.txt
            test -f gate-candidate-diff-sha256.txt && cat gate-candidate-diff-sha256.txt
            test -f cleanup-candidate-diff-sha256.txt && cat cleanup-candidate-diff-sha256.txt
            test -f combined-candidate-diff-sha256.txt && cat combined-candidate-diff-sha256.txt
          } | tee gate-execution-receipt.txt

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ch-migration-gate-liveness-r603e
          if-no-files-found: warn
          path: |
            gate-execution-receipt.txt
            gate-source-sha.txt
            gate-rust-version.txt
            gate-cargo-version.txt
            gate-test-list.txt
            gate-probe.diff
            gate-baseline-transport.rs
            gate-baseline-control.log
            gate-baseline-bug.log
            gate-baseline-status.txt
            gate-candidate-only.diff
            gate-only-transport.rs
            gate-only-bug.log
            gate-only-control.log
            gate-only-survivor.log
            gate-only-survivor-status.txt
            cleanup-candidate-only.diff
            gate-cleanup-combined.diff
            gate-probe-plus-combined.diff
            combined-*.log
            gate-kvm-before.txt
            gate-kvm-after.txt
            gate-vmm-tests.log
            gate-clippy.log
            gate-final-status.txt
            gate-final-diff-stat.txt
            gate-candidate-diff-sha256.txt
            cleanup-candidate-diff-sha256.txt
            combined-candidate-diff-sha256.txt
