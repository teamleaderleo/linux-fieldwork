name: Apply mmdebstrap chrootless credential review

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/mmdebstrap-chrootless-env
          fetch-depth: 0

      - name: Fix Perl::Critic issue and strengthen credential detection
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path('upstream/mmdebstrap/mmdebstrap')
          source = source_path.read_text()
          old = r'''sub chrootless_unsafe_environment() {
              my %exact = map { $_ => 1 } qw(
                SSH_AUTH_SOCK
                SSH_AGENT_PID
                GPG_AGENT_INFO
                DBUS_SESSION_BUS_ADDRESS
                XDG_RUNTIME_DIR
                KRB5CCNAME
                KUBECONFIG
                DOCKER_CONFIG
                AWS_SHARED_CREDENTIALS_FILE
                AWS_CONFIG_FILE
                GOOGLE_APPLICATION_CREDENTIALS
                AZURE_CONFIG_DIR
                GNUPGHOME
                NETRC
              );
              my $sensitive_name = qr{
                  (?:^|_)
                  (?:
                      TOKEN
                    | SECRET
                    | PASSWORD
                    | PASSWD
                    | CREDENTIALS?
                    | PRIVATE_KEY
                    | API_KEY
                  )
                  (?:$|_)
              }ix;
              return sort grep { $exact{$_} || $_ =~ $sensitive_name } keys %ENV;
          }
          '''
          new = r'''sub chrootless_unsafe_environment() {
              my %exact = map { $_ => 1 } qw(
                SSH_AUTH_SOCK
                SSH_AGENT_PID
                SSH_ASKPASS
                GIT_ASKPASS
                GPG_AGENT_INFO
                DBUS_SESSION_BUS_ADDRESS
                XDG_RUNTIME_DIR
                KRB5CCNAME
                KRB5_KTNAME
                KRB5_CLIENT_KTNAME
                KUBECONFIG
                DOCKER_CONFIG
                DOCKER_AUTH_CONFIG
                REGISTRY_AUTH_FILE
                NPM_CONFIG_USERCONFIG
                AWS_ACCESS_KEY_ID
                AWS_SHARED_CREDENTIALS_FILE
                AWS_CONFIG_FILE
                GOOGLE_APPLICATION_CREDENTIALS
                AZURE_CONFIG_DIR
                GNUPGHOME
                NETRC
              );
              my $sensitive_name = qr{
                  (?:^|_)
                  (?:
                      TOKEN
                    | SECRET
                    | PASSWORD
                    | PASSWD
                    | CREDENTIALS?
                    | PRIVATE_KEY
                    | API_KEY
                    | ACCESS_KEY
                    | AUTH
                    | JWT
                    | KEYTAB
                  )
                  (?:$|_)
              }ix;
              my %unsafe;
              foreach my $name (keys %ENV) {
                  if ($exact{$name} || $name =~ $sensitive_name) {
                      $unsafe{$name} = 1;
                  }
              }
              foreach my $name (qw(
                  http_proxy https_proxy ftp_proxy all_proxy
                  HTTP_PROXY HTTPS_PROXY FTP_PROXY ALL_PROXY
                  PIP_INDEX_URL PIP_EXTRA_INDEX_URL
                  UV_INDEX_URL UV_EXTRA_INDEX_URL
                  )) {
                  next if !defined $ENV{$name};
                  if ($ENV{$name}
                      =~ m{\A[a-z][a-z0-9+.-]*://[^/\s@]+@}i) {
                      $unsafe{$name} = 1;
                  }
              }
              my @unsafe = sort keys %unsafe;
              return @unsafe;
          }
          '''
          if source.count(old) != 1:
              raise SystemExit('unexpected unsafe environment function count')
          source_path.write_text(source.replace(old, new))

          run_path = Path('investigations/mmdebstrap-chrootless-env/run.sh')
          run = run_path.read_text()
          run = run.replace(
              '''    AWS_SECRET_ACCESS_KEY \\
              GITHUB_TOKEN \\
          ''',
              '''    AWS_SECRET_ACCESS_KEY \\
              AWS_ACCESS_KEY_ID \\
              GITHUB_TOKEN \\
              DOCKER_AUTH_CONFIG \\
          ''',
          )
          run = run.replace(
              '''  LF_SECRET_CANARY=unsafe-secret-value \\
            GITHUB_TOKEN=unsafe-token-value \\
            SSH_AUTH_SOCK="$runtime/not-an-agent.sock" \\
          ''',
              '''  LF_SECRET_CANARY=unsafe-secret-value \\
            AWS_ACCESS_KEY_ID=unsafe-access-key-value \\
            GITHUB_TOKEN=unsafe-token-value \\
            CI_JOB_JWT=unsafe-jwt-value \\
            DOCKER_AUTH_CONFIG=unsafe-docker-auth-value \\
            https_proxy=http://proxy-user:unsafe-proxy-password@proxy.invalid \\
            SSH_AUTH_SOCK="$runtime/not-an-agent.sock" \\
          ''',
          )
          run = run.replace(
              '''grep -F 'LF_SECRET_CANARY' "$result_dir/unsafe.stderr"
          grep -F 'GITHUB_TOKEN' "$result_dir/unsafe.stderr"
          grep -F 'SSH_AUTH_SOCK' "$result_dir/unsafe.stderr"
          if grep -F -e 'unsafe-secret-value' -e 'unsafe-token-value' \\
            "$result_dir/unsafe.stderr"; then
          ''',
              '''grep -F 'LF_SECRET_CANARY' "$result_dir/unsafe.stderr"
          grep -F 'AWS_ACCESS_KEY_ID' "$result_dir/unsafe.stderr"
          grep -F 'GITHUB_TOKEN' "$result_dir/unsafe.stderr"
          grep -F 'CI_JOB_JWT' "$result_dir/unsafe.stderr"
          grep -F 'DOCKER_AUTH_CONFIG' "$result_dir/unsafe.stderr"
          grep -F 'https_proxy' "$result_dir/unsafe.stderr"
          grep -F 'SSH_AUTH_SOCK' "$result_dir/unsafe.stderr"
          if grep -F \\
            -e 'unsafe-secret-value' \\
            -e 'unsafe-access-key-value' \\
            -e 'unsafe-token-value' \\
            -e 'unsafe-jwt-value' \\
            -e 'unsafe-docker-auth-value' \\
            -e 'unsafe-proxy-password' \\
            "$result_dir/unsafe.stderr"; then
          ''',
          )
          run = run.replace(
              '''  AWS_SECRET_ACCESS_KEY=fake-aws-secret \\
            GITHUB_TOKEN=fake-github-token \\
          ''',
              '''  AWS_SECRET_ACCESS_KEY=fake-aws-secret \\
            AWS_ACCESS_KEY_ID=fake-access-key \\
            GITHUB_TOKEN=fake-github-token \\
            DOCKER_AUTH_CONFIG=fake-docker-auth \\
          ''',
          )
          run = run.replace(
              '''  AWS_SECRET_ACCESS_KEY \\
            GITHUB_TOKEN \\
            SSH_AUTH_SOCK \\
          ''',
              '''  AWS_SECRET_ACCESS_KEY \\
            AWS_ACCESS_KEY_ID \\
            GITHUB_TOKEN \\
            DOCKER_AUTH_CONFIG \\
            SSH_AUTH_SOCK \\
          ''',
          )
          run = run.replace(
              '''unsafe_error_values_redacted=yes
          apt_proxy_preserved=yes
          ''',
              '''unsafe_error_values_redacted=yes
          credentialed_proxy_rejected=yes
          apt_proxy_preserved=yes
          ''',
          )
          run_path.write_text(run)

          plan_path = Path('investigations/mmdebstrap-chrootless-env/PLAN.md')
          plan = plan_path.read_text()
          plan = plan.replace(
              '''Candidate name patterns cover token, secret, password, credential, and private-key variables. The matrix must measure false positives before retaining a pattern.
          ''',
              '''Candidate name patterns cover token, secret, password, credential, private-key, access-key, authentication, JWT, and keytab variables. Exact checks also cover common agent, registry-auth, cloud-credential, package-manager configuration, and Kerberos keytab variables. Proxy and package-index URLs are rejected only when their URL authority embeds user information. The matrix must measure false positives before retaining a pattern.
          ''',
          )
          plan_path.write_text(plan)
          PY

      - name: Format and run static review
        run: |
          docker run --rm \
            --volume "$PWD:/work" \
            --workdir /work/upstream/mmdebstrap \
            debian:sid-slim \
            sh -euxc '
              apt-get update
              apt-get install --yes --no-install-recommends \
                libperl-critic-perl perltidy
              perltidy < mmdebstrap > mmdebstrap.tdy
              mv mmdebstrap.tdy mmdebstrap
              perlcritic --severity 4 --verbose 8 mmdebstrap
            '
          perl -c upstream/mmdebstrap/mmdebstrap
          pod2man upstream/mmdebstrap/mmdebstrap >/dev/null
          bash -n investigations/mmdebstrap-chrootless-env/run.sh
          bash -n investigations/mmdebstrap-unwritable-tmpdir/run.sh
          bash -n investigations/mmdebstrap-unwritable-tmpdir/deep_review.sh
          git diff --check
          test "$(sed -e '/^__END__$/,$d' upstream/mmdebstrap/mmdebstrap | wc --max-line-length)" -le 79

      - name: Commit review corrections
        run: |
          rm .github/workflows/apply-mmdebstrap-chrootless-credential-review.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Strengthen chrootless credential detection'
          git push origin HEAD:security/mmdebstrap-chrootless-env
