name: Cloud Hypervisor candidate validation

on:
  pull_request:
    paths:
      - "investigations/cloud-hypervisor-inactive-virtio-restore/candidate.patch"
      - "investigations/cloud-hypervisor-sparse-page-granularity/candidate.patch"
      - ".github/workflows/cloud-hypervisor-candidate-validation.yml"

permissions:
  contents: read

concurrency:
  group: cloud-hypervisor-candidates-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CLH_SHA: a658c9f9fd0c4e0363004361d73ac8733fa24fd0

jobs:
  inactive-virtio-restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out Fieldwork carrier
        uses: actions/checkout@v4
        with:
          path: fieldwork

      - name: Check out exact Cloud Hypervisor source
        uses: actions/checkout@v4
        with:
          repository: cloud-hypervisor/cloud-hypervisor
          ref: ${{ env.CLH_SHA }}
          path: cloud-hypervisor

      - name: Verify source and apply exact retained patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C cloud-hypervisor rev-parse HEAD)" = "$CLH_SHA"
          patch="$PWD/fieldwork/investigations/cloud-hypervisor-inactive-virtio-restore/candidate.patch"
          git -C cloud-hypervisor apply --check "$patch"
          git -C cloud-hypervisor apply "$patch"
          test "$(git -C cloud-hypervisor diff --name-only)" = "virtio-devices/src/transport/pci_device.rs"

      - name: Record Rust toolchain
        shell: bash
        run: |
          rustc --version
          cargo --version
          rustfmt --version

      - name: Check formatting
        working-directory: cloud-hypervisor
        run: cargo fmt --all -- --check

      - name: Run inactive queue regression
        working-directory: cloud-hypervisor
        shell: bash
        run: |
          set -euo pipefail
          test_name="transport::pci_device::unit_tests::restore_inactive_queue_skips_used_index_read"
          cargo test -p virtio-devices --lib -- --list | grep -F "$test_name: test"
          cargo test -p virtio-devices --lib "$test_name" -- --exact

      - name: Run partial multi-queue discriminator
        working-directory: cloud-hypervisor
        shell: bash
        run: |
          set -euo pipefail
          test_name="transport::pci_device::unit_tests::restore_partially_enabled_device_skips_unready_queue"
          cargo test -p virtio-devices --lib -- --list | grep -F "$test_name: test"
          cargo test -p virtio-devices --lib "$test_name" -- --exact

      - name: KVM Clippy for touched crate
        working-directory: cloud-hypervisor
        env:
          RUSTFLAGS: -D warnings
        run: cargo clippy -p virtio-devices --all-targets --no-default-features --features kvm -- -D warnings

  sparse-page-granularity:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out Fieldwork carrier
        uses: actions/checkout@v4
        with:
          path: fieldwork

      - name: Check out exact Cloud Hypervisor source
        uses: actions/checkout@v4
        with:
          repository: cloud-hypervisor/cloud-hypervisor
          ref: ${{ env.CLH_SHA }}
          path: cloud-hypervisor

      - name: Verify source and apply exact retained patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C cloud-hypervisor rev-parse HEAD)" = "$CLH_SHA"
          patch="$PWD/fieldwork/investigations/cloud-hypervisor-sparse-page-granularity/candidate.patch"
          git -C cloud-hypervisor apply --check "$patch"
          git -C cloud-hypervisor apply "$patch"
          test "$(git -C cloud-hypervisor diff --name-only)" = "vmm/src/sparse.rs"
          test "$(getconf PAGESIZE)" = "4096"

      - name: Record Rust toolchain
        shell: bash
        run: |
          rustc --version
          cargo --version
          rustfmt --version

      - name: Check formatting
        working-directory: cloud-hypervisor
        run: cargo fmt --all -- --check

      - name: Run sparse unit tests with KVM feature context
        working-directory: cloud-hypervisor
        run: cargo test -p vmm --lib --no-default-features --features kvm sparse::unit_tests

      - name: KVM Clippy for touched crate
        working-directory: cloud-hypervisor
        env:
          RUSTFLAGS: -D warnings
        run: cargo clippy -p vmm --lib --no-default-features --features kvm -- -D warnings
