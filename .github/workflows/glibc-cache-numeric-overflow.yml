name: glibc cache numeric overflow

on:
  pull_request:
    paths:
      - "investigations/glibc-ld-cache-numeric-overflow/**"
      - ".github/workflows/glibc-cache-numeric-overflow.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  noble-x86-64:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out proposed repository state
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Execute comparator-domain fixture
        shell: bash
        run: |
          set -euo pipefail
          output="investigations/glibc-ld-cache-numeric-overflow/runs/$RUN_ID"
          bash investigations/glibc-ld-cache-numeric-overflow/probe.sh "$output"

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: glibc-cache-numeric-overflow-${{ env.RUN_ID }}
          path: investigations/glibc-ld-cache-numeric-overflow/runs/${{ env.RUN_ID }}/
          if-no-files-found: error
          retention-days: 14
