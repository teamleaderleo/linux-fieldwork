name: Bubblewrap PID namespace zombie probe

on:
  pull_request:
    paths:
      - '.github/workflows/bubblewrap-unshare-pid-zombie.yml'
      - 'investigations/bubblewrap-unshare-pid-zombie/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-current-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Bubblewrap build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential meson ninja-build libcap-dev libselinux1-dev

      - name: Fetch exact Bubblewrap source
        run: |
          git clone https://github.com/containers/bubblewrap.git /tmp/bubblewrap
          git -C /tmp/bubblewrap checkout 2f55bae38468d0c50cf5df87b1e481e882b63acb
          test "$(git -C /tmp/bubblewrap rev-parse HEAD)" = 2f55bae38468d0c50cf5df87b1e481e882b63acb
          git -C /tmp/bubblewrap worktree add /tmp/bubblewrap-candidate HEAD

      - name: Build exact Bubblewrap source
        run: |
          meson setup /tmp/bubblewrap/_build /tmp/bubblewrap -Dman=disabled -Dtests=false
          meson compile -C /tmp/bubblewrap/_build
          /tmp/bubblewrap/_build/bwrap --version

      - name: Build narrow reap candidate
        run: |
          git -C /tmp/bubblewrap-candidate apply --check "$GITHUB_WORKSPACE/investigations/bubblewrap-unshare-pid-zombie/0001-delay-exit-event-while-no-descendants-remain.patch"
          git -C /tmp/bubblewrap-candidate apply "$GITHUB_WORKSPACE/investigations/bubblewrap-unshare-pid-zombie/0001-delay-exit-event-while-no-descendants-remain.patch"
          git -C /tmp/bubblewrap-candidate diff --check
          git -C /tmp/bubblewrap-candidate diff -- bubblewrap.c | tee investigations/bubblewrap-unshare-pid-zombie/candidate-applied.diff
          meson setup /tmp/bubblewrap-candidate/_build /tmp/bubblewrap-candidate -Dman=disabled -Dtests=false
          meson compile -C /tmp/bubblewrap-candidate/_build
          /tmp/bubblewrap-candidate/_build/bwrap --version

      - name: Record execution environment
        run: |
          {
            uname -a
            id
            cat /etc/os-release
            sysctl kernel.unprivileged_userns_clone 2>/dev/null || true
            sysctl user.max_user_namespaces 2>/dev/null || true
            docker version --format 'docker-client={{.Client.Version}} docker-server={{.Server.Version}}'
          } | tee investigations/bubblewrap-unshare-pid-zombie/runtime-environment.txt

      - name: Run synthetic model
        run: |
          python3 investigations/bubblewrap-unshare-pid-zombie/repro_subreaper_zombie.py --model \
            | tee investigations/bubblewrap-unshare-pid-zombie/model-runtime.txt

      - name: Classify unprivileged host runner
        run: |
          set +e
          python3 investigations/bubblewrap-unshare-pid-zombie/repro_subreaper_zombie.py \
            --bwrap /tmp/bubblewrap/_build/bwrap \
            > investigations/bubblewrap-unshare-pid-zombie/host-runtime.txt 2>&1
          rc=$?
          set -e
          cat investigations/bubblewrap-unshare-pid-zombie/host-runtime.txt
          echo "host_probe_rc=$rc" | tee -a investigations/bubblewrap-unshare-pid-zombie/host-runtime.txt

      - name: Run exact-current probe in privileged disposable container
        run: |
          set -o pipefail
          docker run --privileged --rm \
            -v /tmp/bubblewrap:/tmp/bubblewrap:ro \
            -v "$GITHUB_WORKSPACE":/fieldwork:ro \
            ubuntu:24.04 \
            bash -lc 'apt-get update >/dev/null && apt-get install -y python3 libcap2 libselinux1 >/dev/null && cd /fieldwork && python3 investigations/bubblewrap-unshare-pid-zombie/repro_subreaper_zombie.py --bwrap /tmp/bubblewrap/_build/bwrap' \
            | tee investigations/bubblewrap-unshare-pid-zombie/exact-current-runtime.txt

      - name: Run candidate probe in privileged disposable container
        run: |
          set -o pipefail
          docker run --privileged --rm \
            -v /tmp/bubblewrap-candidate:/tmp/bubblewrap-candidate:ro \
            -v "$GITHUB_WORKSPACE":/fieldwork:ro \
            ubuntu:24.04 \
            bash -lc 'apt-get update >/dev/null && apt-get install -y python3 libcap2 libselinux1 >/dev/null && cd /fieldwork && python3 investigations/bubblewrap-unshare-pid-zombie/repro_subreaper_zombie.py --bwrap /tmp/bubblewrap-candidate/_build/bwrap --expect-short-clean' \
            | tee investigations/bubblewrap-unshare-pid-zombie/candidate-runtime.txt

      - name: Run upstream baseline and candidate test suites
        run: |
          docker run --privileged --rm \
            -v /tmp/bubblewrap:/baseline \
            -v /tmp/bubblewrap-candidate:/candidate \
            -v "$GITHUB_WORKSPACE":/fieldwork \
            ubuntu:24.04 \
            bash -lc '
              set -euo pipefail
              export DEBIAN_FRONTEND=noninteractive
              apt-get update >/dev/null
              apt-get install -y --no-install-recommends \
                build-essential meson ninja-build libcap-dev libselinux1-dev \
                libcap2-bin python3 strace procps util-linux >/dev/null
              overall=0
              for label in baseline candidate; do
                tree="/$label"
                log="/fieldwork/investigations/bubblewrap-unshare-pid-zombie/${label}-upstream-tests.txt"
                rm -rf "$tree/_suite"
                meson setup "$tree/_suite" "$tree" -Dman=disabled -Dtests=true
                meson compile -C "$tree/_suite"
                set +e
                meson test -C "$tree/_suite" --print-errorlogs >"$log" 2>&1
                rc=$?
                set -e
                cat "$log"
                echo "${label}_upstream_test_rc=$rc" | tee -a "$log"
                if [ "$rc" -ne 0 ]; then
                  overall=1
                fi
              done
              exit "$overall"
            '

      - name: Retain runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bubblewrap-unshare-pid-zombie-runtime
          path: |
            investigations/bubblewrap-unshare-pid-zombie/runtime-environment.txt
            investigations/bubblewrap-unshare-pid-zombie/model-runtime.txt
            investigations/bubblewrap-unshare-pid-zombie/host-runtime.txt
            investigations/bubblewrap-unshare-pid-zombie/exact-current-runtime.txt
            investigations/bubblewrap-unshare-pid-zombie/candidate-runtime.txt
            investigations/bubblewrap-unshare-pid-zombie/candidate-applied.diff
            investigations/bubblewrap-unshare-pid-zombie/baseline-upstream-tests.txt
            investigations/bubblewrap-unshare-pid-zombie/candidate-upstream-tests.txt
          if-no-files-found: warn
