name: Cloud Hypervisor TDX Payload setup-size validation v2

on:
  push:
    branches: [research/ch-tdx-payload-setup-size]
    paths:
      - .github/workflows/ch-tdx-payload-setup-size-v2.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tdx-payload-setup-size:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CH_SHA: 1af93ac7035cda77cd87b0c18b1134ebb0928052
      FEATURES: tdx,kvm
      CONFIG_SHA: 921b7ecd5ee25889000d1fcaabbcc578a4cbbc69
      CONFIG_DIFF_SHA: 0af9d875fd2b82099fe15f7f6a910d9500293990846bda6d677da1ea16b0da5e
      CONFIG_TEST: config::tdx_payload_validation_probe_tests::tdx_firmware_kernel_should_validate
      WITNESS: vm::unit_tests::tdx_payload_truncated_setup_is_accepted_baseline
      LOADER_CONTROL: vm::unit_tests::pinned_linux_loader_rejects_truncated_setup_control
      VALID_CONTROL: vm::unit_tests::tdx_payload_valid_setup_size_control
      INVARIANT: vm::unit_tests::tdx_payload_setup_area_must_fit_file
      CANDIDATE_TEST: vm::unit_tests::tdx_payload_setup_size_validation

    steps:
      - uses: actions/checkout@v4
        with:
          path: fieldwork
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: cloud-hypervisor/cloud-hypervisor
          ref: ${{ env.CH_SHA }}
          path: cloud-hypervisor
          persist-credentials: false

      - name: Pin exact source and immutable reachability materializers
        id: source
        shell: bash
        run: |
          set -euxo pipefail
          rustup toolchain install 1.89.0 --profile minimal
          rustup component add --toolchain 1.89.0 clippy
          rustup toolchain install nightly --profile minimal --component rustfmt
          rustup override set 1.89.0 --path cloud-hypervisor
          git -C cloud-hypervisor rev-parse HEAD | tee tdx-payload-setup-v2-source-sha.txt
          test "$(git -C cloud-hypervisor rev-parse HEAD)" = "$CH_SHA"
          test -z "$(git -C cloud-hypervisor status --short)"
          git -C fieldwork fetch --no-tags origin "$CONFIG_SHA"
          git -C fieldwork show "$CONFIG_SHA:investigations/cloud-hypervisor-tdx-payload-validation/apply_candidate.py" > /tmp/config_candidate.py
          git -C fieldwork show "$CONFIG_SHA:investigations/cloud-hypervisor-tdx-payload-validation/apply_probe.py" > /tmp/config_probe.py

      - name: Execute baseline discriminator
        id: baseline
        working-directory: cloud-hypervisor
        shell: bash
        run: |
          set -euxo pipefail
          python3 /tmp/config_candidate.py
          cargo +nightly fmt --all
          git diff -- vmm/src/config.rs vmm/src/vm_config.rs > ../tdx-payload-setup-v2-config.diff
          actual=$(sha256sum ../tdx-payload-setup-v2-config.diff | awk '{print $1}')
          echo "$actual  tdx-payload-setup-v2-config.diff" | tee ../tdx-payload-setup-v2-config-sha256.txt
          test "$actual" = "$CONFIG_DIFF_SHA"

          python3 /tmp/config_probe.py
          python3 ../fieldwork/investigations/cloud-hypervisor-tdx-payload-setup-size/apply_probe.py
          cargo +nightly fmt --all
          cargo +nightly fmt --all -- --check
          git diff --check
          cargo test --locked -p vmm --features "$FEATURES" --lib --no-run

          cargo test --locked -p vmm --features "$FEATURES" --lib "$CONFIG_TEST" -- --exact --nocapture 2>&1 | tee ../tdx-payload-setup-v2-config-control.log
          grep -F 'kernel_result=Ok' ../tdx-payload-setup-v2-config-control.log

          cargo test --locked -p vmm --features "$FEATURES" --lib "$VALID_CONTROL" -- --exact --nocapture 2>&1 | tee ../tdx-payload-setup-v2-valid-control.log
          grep -F 'TDX_PAYLOAD_SETUP_CONTROL payload_size=0xa00 setup_size=0xa00 accepted=true' ../tdx-payload-setup-v2-valid-control.log

          cargo test --locked -p vmm --features "$FEATURES" --lib "$LOADER_CONTROL" -- --exact --nocapture 2>&1 | tee ../tdx-payload-setup-v2-linux-loader-control.log
          grep -F 'TDX_PAYLOAD_SETUP_CONTROL linux_loader_result=Bzimage(Underflow)' ../tdx-payload-setup-v2-linux-loader-control.log

          cargo test --locked -p vmm --features "$FEATURES" --lib "$WITNESS" -- --ignored --exact --nocapture 2>&1 | tee ../tdx-payload-setup-v2-baseline-witness.log
          grep -F 'TDX_PAYLOAD_SETUP_BASELINE payload_size=0x212 setup_size=0xa00 accepted=true' ../tdx-payload-setup-v2-baseline-witness.log

          set +e
          cargo test --locked -p vmm --features "$FEATURES" --lib "$INVARIANT" -- --exact --nocapture > ../tdx-payload-setup-v2-baseline-invariant.log 2>&1
          rc=$?
          set -e
          echo "TDX_PAYLOAD_SETUP_BASELINE_INVARIANT_RC=$rc" | tee ../tdx-payload-setup-v2-baseline-invariant-status.txt
          cat ../tdx-payload-setup-v2-baseline-invariant.log
          test "$rc" -ne 0
          grep -F 'TDX bzImage payload must not pass header checks when its setup area is truncated' ../tdx-payload-setup-v2-baseline-invariant.log

      - name: Execute candidate and broad gates
        id: candidate
        working-directory: cloud-hypervisor
        shell: bash
        run: |
          set -euxo pipefail
          git checkout -- vmm/src/config.rs vmm/src/vm_config.rs vmm/src/vm.rs
          test -z "$(git status --short)"
          python3 /tmp/config_candidate.py
          cargo +nightly fmt --all
          git diff -- vmm/src/config.rs vmm/src/vm_config.rs > ../tdx-payload-setup-v2-config-candidate.diff
          actual=$(sha256sum ../tdx-payload-setup-v2-config-candidate.diff | awk '{print $1}')
          test "$actual" = "$CONFIG_DIFF_SHA"

          python3 ../fieldwork/investigations/cloud-hypervisor-tdx-payload-setup-size/apply_candidate.py
          cargo +nightly fmt --all
          cargo +nightly fmt --all -- --check
          git diff --check
          git diff -- vmm/src/vm.rs > ../tdx-payload-setup-v2-candidate-only.diff
          sha256sum ../tdx-payload-setup-v2-candidate-only.diff | tee ../tdx-payload-setup-v2-candidate-diff-sha256.txt
          git diff -- vmm/src/config.rs vmm/src/vm_config.rs vmm/src/vm.rs > ../tdx-payload-setup-v2-stacked-product.diff
          sha256sum ../tdx-payload-setup-v2-stacked-product.diff | tee ../tdx-payload-setup-v2-stacked-product-sha256.txt
          git diff --stat | tee ../tdx-payload-setup-v2-stacked-product-stat.txt

          python3 /tmp/config_probe.py
          cargo +nightly fmt --all
          cargo +nightly fmt --all -- --check
          git diff --check
          cargo test --locked -p vmm --features "$FEATURES" --lib "$CONFIG_TEST" -- --exact --nocapture 2>&1 | tee ../tdx-payload-setup-v2-candidate-config.log
          cargo test --locked -p vmm --features "$FEATURES" --lib "$CANDIDATE_TEST" -- --exact --nocapture 2>&1 | tee ../tdx-payload-setup-v2-candidate-focused.log
          grep -F 'kernel_result=Ok' ../tdx-payload-setup-v2-candidate-config.log
          grep -F 'TDX_PAYLOAD_SETUP_CANDIDATE truncated_result=InvalidPayloadSetupSize { payload_size: 530, setup_size: 2560 }' ../tdx-payload-setup-v2-candidate-focused.log
          grep -F 'TDX_PAYLOAD_SETUP_CANDIDATE default_setup_control=ok' ../tdx-payload-setup-v2-candidate-focused.log
          grep -F 'TDX_PAYLOAD_SETUP_CANDIDATE explicit_setup_control=ok' ../tdx-payload-setup-v2-candidate-focused.log

          if [ -e /dev/kvm ]; then sudo chmod a+rw /dev/kvm; fi
          cargo test --locked -p vmm --features "$FEATURES" --lib 2>&1 | tee ../tdx-payload-setup-v2-vmm-tests.log
          cargo clippy --locked -p vmm --features "$FEATURES" --all-targets -- \
            -D warnings -A unreachable-code -A unused-mut -A unused-variables -A unfulfilled-lint-expectations \
            2>&1 | tee ../tdx-payload-setup-v2-clippy.log
          cargo +nightly fmt --all -- --check
          git diff --check
          git status --short | tee ../tdx-payload-setup-v2-final-status.txt

      - name: Write receipt
        if: always()
        shell: bash
        run: |
          {
            echo "fieldwork_head=${GITHUB_SHA}"
            echo "source=$CH_SHA"
            echo "source_gate=${{ steps.source.outcome }}"
            echo "baseline_gate=${{ steps.baseline.outcome }}"
            echo "candidate_and_broad_gate=${{ steps.candidate.outcome }}"
            test -f tdx-payload-setup-v2-config-sha256.txt && cat tdx-payload-setup-v2-config-sha256.txt
            test -f tdx-payload-setup-v2-baseline-invariant-status.txt && cat tdx-payload-setup-v2-baseline-invariant-status.txt
            test -f tdx-payload-setup-v2-candidate-diff-sha256.txt && cat tdx-payload-setup-v2-candidate-diff-sha256.txt
            test -f tdx-payload-setup-v2-stacked-product-sha256.txt && cat tdx-payload-setup-v2-stacked-product-sha256.txt
          } | tee tdx-payload-setup-v2-receipt.txt

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ch-tdx-payload-setup-size-v2
          if-no-files-found: warn
          path: |
            tdx-payload-setup-v2-*.txt
            tdx-payload-setup-v2-*.log
            tdx-payload-setup-v2-*.diff
