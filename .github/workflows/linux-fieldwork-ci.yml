name: Linux Fieldwork CI

on:
  pull_request:
    paths:
      - "tools/**"
      - "tests/**"
      - "scripts/**"
      - "investigations/**"
      - "notes/**"
      - "programmes/**"
      - "targets/**"
      - "upstream/**"
      - ".github/workflows/linux-fieldwork-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lab-tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out proposed repository state
        uses: actions/checkout@v4

      - name: Compile Python tools
        shell: bash
        run: |
          targets=()
          [[ -d tools ]] && targets+=(tools)
          [[ -d tests ]] && targets+=(tests)
          if ((${#targets[@]})); then
            python3 -m compileall -q "${targets[@]}"
          fi

      - name: Run unit tests
        shell: bash
        run: |
          if [[ -d tests ]] && find tests -type f -name 'test*.py' -print -quit | grep -q .; then
            python3 -m unittest discover -s tests -v
          fi

      - name: Check shell syntax and command help
        shell: bash
        run: |
          for script in \
            scripts/capture-linux-context.sh \
            scripts/preflight-mmdebstrap-investigation.sh \
            scripts/reproduce-mmdebstrap-autopkgtest.sh; do
            if [[ -f "$script" ]]; then
              bash -n "$script"
            fi
          done
          for tool in \
            tools/tar_manifest.py \
            tools/manifest_diff.py \
            tools/debian_bug_report.py; do
            if [[ -f "$tool" ]]; then
              python3 "$tool" --help >/dev/null
            fi
          done
          if [[ -f scripts/capture-linux-context.sh ]]; then
            bash scripts/capture-linux-context.sh --help >/dev/null
          fi

  capture-bug-report:
    if: startsWith(github.head_ref, 'investigation/mmdebstrap-autopkgtest') || startsWith(github.ref_name, 'investigation/mmdebstrap-autopkgtest')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out proposed repository state
        uses: actions/checkout@v4

      - name: Capture Debian bug 1141078
        run: |
          python3 tools/debian_bug_report.py 1141078 \
            --output-dir investigations/mmdebstrap-autopkgtest-1141078/runs/bts-1141078

      - name: Upload BTS capture
        uses: actions/upload-artifact@v4
        with:
          name: debian-bug-1141078
          path: investigations/mmdebstrap-autopkgtest-1141078/runs/bts-1141078/
          if-no-files-found: error
          retention-days: 14

  reproduce-mmdebstrap:
    if: startsWith(github.head_ref, 'investigation/mmdebstrap-autopkgtest') || startsWith(github.ref_name, 'investigation/mmdebstrap-autopkgtest')
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out proposed repository state
        uses: actions/checkout@v4

      - name: Run Debian sid autopkgtest in a disposable container
        shell: bash
        run: |
          set -uo pipefail
          run_dir="investigations/mmdebstrap-autopkgtest-1141078/runs/$RUN_ID"
          mkdir -p "$run_dir"
          set +e
          docker run --privileged --rm \
            --volume "$PWD:/work" \
            --workdir /work \
            --env RUN_ID="$RUN_ID" \
            --env AUTOPKGTEST_TIMEOUT=160m \
            debian:sid-slim \
            bash -lc '
              set -euo pipefail
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends \
                autopkgtest ca-certificates python3 procps util-linux
              apt-get clean
              scripts/reproduce-mmdebstrap-autopkgtest.sh
            '
          status=$?
          set -e
          printf '%s\n' "$status" >"$run_dir/container-exit-status"
          exit 0

      - name: Upload reproduction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mmdebstrap-reproduction-${{ env.RUN_ID }}
          path: investigations/mmdebstrap-autopkgtest-1141078/runs/${{ env.RUN_ID }}/
          if-no-files-found: warn
          retention-days: 14

      - name: Classify reproduction result
        if: always()
        shell: bash
        run: |
          status=$(cat "investigations/mmdebstrap-autopkgtest-1141078/runs/$RUN_ID/container-exit-status")
          case "$status" in
            0)
              echo "The contained autopkgtest passed."
              ;;
            77)
              echo "The contained autopkgtest returned a neutral result."
              ;;
            *)
              echo "The contained autopkgtest failed with status $status."
              exit "$status"
              ;;
          esac
