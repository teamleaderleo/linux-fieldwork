name: Summarize retained mmdebstrap autopkgtest artifact

on:
  pull_request:
    paths:
      - '.github/workflows/mmdebstrap-autopkgtest-artifact-receipt.yml'
      - 'tools/mmdebstrap_autopkgtest_log.py'
      - 'tests/test_mmdebstrap_autopkgtest_log.py'
      - 'tools/summarize_mmdebstrap_reproduction.py'
      - 'tests/test_summarize_mmdebstrap_reproduction.py'
      - 'tools/verify_github_artifact_metadata.py'
      - 'tests/test_verify_github_artifact_metadata.py'
      - 'investigations/mmdebstrap-autopkgtest-1141078/ARTIFACT-RECEIPT.md'
      - 'investigations/mmdebstrap-autopkgtest-1141078/ARTIFACT-METADATA-IDENTITY.md'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  summarize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SOURCE_RUN_ID: '30641621084'
      SOURCE_RUN_ATTEMPT: '1'
      SOURCE_ARTIFACT_ID: '8799126060'
      SOURCE_ARTIFACT_NAME: mmdebstrap-reproduction-gha-30641621084-1
      SOURCE_ARTIFACT_DIGEST: sha256:33f972dfd71c08263a0d766d9e1ded96c11407f001315a2a0c23ae9d2bf68474
      EXPECTED_HEAD: fe49686c333aea3c5b8e378e655c52fa57e9224c
      EXPECTED_BASE: c2b7c43a4b6ce883f6dcdbef8d489bcf48323266
      EXPECTED_CHECKOUT: 37648c5efd9cf80b5ae4ec063e8d6cb5b4f82d6e
    steps:
      - name: Check out receipt implementation
        uses: actions/checkout@v4

      - name: Verify exact source artifact metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          raw="$RUNNER_TEMP/source-artifact-metadata.json"
          verified="$RUNNER_TEMP/source-artifact-metadata-receipt.json"
          gh api \
            --method GET \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT_ID" \
            >"$raw"
          python3 tools/verify_github_artifact_metadata.py \
            "$raw" \
            --expected-id "$SOURCE_ARTIFACT_ID" \
            --expected-name "$SOURCE_ARTIFACT_NAME" \
            --expected-run-id "$SOURCE_RUN_ID" \
            --expected-digest "$SOURCE_ARTIFACT_DIGEST" \
            --output "$verified" \
            >"$RUNNER_TEMP/source-artifact-metadata-receipt.stdout"

      - name: Download exact retained source artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ env.SOURCE_ARTIFACT_ID }}
          path: ${{ runner.temp }}/mmdebstrap-reproduction
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}

      - name: Build typed artifact receipt
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/mmdebstrap-artifact-receipt.json"
          metadata="$RUNNER_TEMP/source-artifact-metadata-receipt.json"
          python3 tools/summarize_mmdebstrap_reproduction.py \
            "$RUNNER_TEMP/mmdebstrap-reproduction" \
            --expected-head "$EXPECTED_HEAD" \
            --expected-base "$EXPECTED_BASE" \
            --expected-checkout "$EXPECTED_CHECKOUT" \
            --expected-run-id "$SOURCE_RUN_ID" \
            --expected-run-attempt "$SOURCE_RUN_ATTEMPT" \
            --artifact-id "$SOURCE_ARTIFACT_ID" \
            --artifact-digest "$SOURCE_ARTIFACT_DIGEST" \
            --output "$receipt" \
            >"$RUNNER_TEMP/mmdebstrap-artifact-receipt.stdout"
          python3 - "$receipt" "$metadata" <<'PY'
          import json
          import os
          import pathlib
          import sys

          receipt_path = pathlib.Path(sys.argv[1])
          metadata_path = pathlib.Path(sys.argv[2])
          receipt = json.loads(receipt_path.read_text(encoding="utf-8"))
          metadata = json.loads(metadata_path.read_text(encoding="utf-8"))
          if metadata.get("schema_version") != 1 or metadata.get("verified") is not True:
              raise SystemExit("source artifact metadata receipt is not verified")
          artifact_identity = metadata.get("artifact")
          if type(artifact_identity) is not dict:
              raise SystemExit("source artifact metadata identity is missing")
          if receipt["artifact"]["id"] != str(artifact_identity["id"]):
              raise SystemExit("derived receipt artifact id contradicts verified metadata")
          if receipt["artifact"]["digest"] != artifact_identity["digest"]:
              raise SystemExit("derived receipt digest contradicts verified metadata")
          if artifact_identity["name"] != os.environ["SOURCE_ARTIFACT_NAME"]:
              raise SystemExit("verified artifact name contradicts workflow contract")
          if str(artifact_identity["workflow_run_id"]) != os.environ["SOURCE_RUN_ID"]:
              raise SystemExit("verified artifact run contradicts workflow contract")

          focus = receipt["focus_case"]
          console = receipt["console"]
          classifier = console["classifier"]
          artifact_root = pathlib.Path(receipt["artifact"]["root"])
          console_lines = (artifact_root / console["path"]).read_text(
              encoding="utf-8", errors="replace"
          ).splitlines()
          print(f"source_artifact_id={artifact_identity['id']}")
          print(f"source_artifact_name={artifact_identity['name']}")
          print(f"source_artifact_digest={artifact_identity['digest']}")
          print(f"source_artifact_run_id={artifact_identity['workflow_run_id']}")
          print(f"focus_state={focus['state']}")
          print(f"focus_before_first_failure={focus['before_first_failure']}")
          print(
              "focus_completed_before_first_failure="
              f"{focus['completed_before_first_failure']}"
          )
          print(
              "focus_occurrences="
              f"{json.dumps(focus['occurrences'], sort_keys=True)}"
          )
          for occurrence in focus["occurrences"]:
              line_number = occurrence["line"]
              start = max(0, line_number - 4)
              end = min(len(console_lines), line_number + 3)
              print(f"focus_context_line={line_number}")
              for index in range(start, end):
                  print(f"{index + 1}: {console_lines[index]}")
          print(f"first_failure_phase={classifier['phase']}")
          print(f"first_failure_signal={classifier['first_failure_signal']}")
          print(
              "first_failed_test="
              f"{json.dumps(classifier['first_failed_test'], sort_keys=True)}"
          )
          print(
              "last_named_test="
              f"{json.dumps(classifier['last_named_test'], sort_keys=True)}"
          )
          print(
              "first_wrapper_failure_line="
              f"{console['first_wrapper_failure_line']}"
          )
          print(f"ordering_failure_line={console['ordering_failure_line']}")
          print(f"phase_order_receipt={receipt['phase_order_receipt']}")
          print("failure_context:")
          for line in console["failure_context"]:
              print(line)
          print("console_tail:")
          for line in console["tail"]:
              print(line)
          PY

      - name: Upload derived receipt
        uses: actions/upload-artifact@v4
        with:
          name: mmdebstrap-artifact-receipt-${{ env.SOURCE_RUN_ID }}
          path: |
            ${{ runner.temp }}/source-artifact-metadata.json
            ${{ runner.temp }}/source-artifact-metadata-receipt.json
            ${{ runner.temp }}/source-artifact-metadata-receipt.stdout
            ${{ runner.temp }}/mmdebstrap-artifact-receipt.json
            ${{ runner.temp }}/mmdebstrap-artifact-receipt.stdout
          if-no-files-found: error
          retention-days: 14
