name: Bubblewrap PID 1 environment musl probe

on:
  pull_request:
    paths:
      - '.github/workflows/bubblewrap-pid1-environ-musl.yml'
      - 'investigations/bubblewrap-pid1-environ/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  alpine-musl:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build and execute exact source and candidate under musl
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/bubblewrap-musl"
          mkdir -p "$out"
          docker pull alpine:3.22
          docker run --privileged --rm \
            -v "$GITHUB_WORKSPACE:/fieldwork:ro" \
            -v "$out:/out" \
            alpine:3.22 sh -lc '
              set -eu
              apk add --no-cache build-base git meson ninja python3 libcap-dev >/dev/null

              git clone https://github.com/containers/bubblewrap.git /tmp/bubblewrap >/dev/null 2>&1
              git -C /tmp/bubblewrap checkout 2f55bae38468d0c50cf5df87b1e481e882b63acb >/dev/null 2>&1
              test "$(git -C /tmp/bubblewrap rev-parse HEAD)" = 2f55bae38468d0c50cf5df87b1e481e882b63acb
              cp -a /tmp/bubblewrap /tmp/bubblewrap-candidate

              git -C /tmp/bubblewrap-candidate apply --check /fieldwork/investigations/bubblewrap-pid1-environ/0001-scrub-superseded-original-environment.patch
              git -C /tmp/bubblewrap-candidate apply /fieldwork/investigations/bubblewrap-pid1-environ/0001-scrub-superseded-original-environment.patch
              git -C /tmp/bubblewrap-candidate diff --check
              git -C /tmp/bubblewrap-candidate diff -- bubblewrap.c > /out/candidate.diff

              meson setup /tmp/bubblewrap/_build /tmp/bubblewrap -Dman=disabled -Dtests=false -Dselinux=disabled >/out/baseline-configure.txt
              meson compile -C /tmp/bubblewrap/_build >/out/baseline-build.txt
              meson setup /tmp/bubblewrap-candidate/_build /tmp/bubblewrap-candidate -Dman=disabled -Dtests=false -Dselinux=disabled >/out/candidate-configure.txt
              meson compile -C /tmp/bubblewrap-candidate/_build >/out/candidate-build.txt

              {
                cat /etc/alpine-release
                ldd /tmp/bubblewrap/_build/bwrap || true
                /tmp/bubblewrap/_build/bwrap --version
                /tmp/bubblewrap-candidate/_build/bwrap --version
              } > /out/environment.txt 2>&1

              cd /fieldwork
              python3 investigations/bubblewrap-pid1-environ/repro_pid1_environ.py \
                --bwrap /tmp/bubblewrap/_build/bwrap \
                | tee /out/baseline-runtime.txt
              python3 investigations/bubblewrap-pid1-environ/repro_pid1_environ.py \
                --bwrap /tmp/bubblewrap-candidate/_build/bwrap --expect-scrubbed \
                | tee /out/candidate-runtime.txt
            '

      - name: Retain musl evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bubblewrap-pid1-environ-musl-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bubblewrap-musl/
          if-no-files-found: error
          retention-days: 14
