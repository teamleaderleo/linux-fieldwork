name: Cloud Hypervisor QCOW refblock clone-cost audit

on:
  push:
    branches:
      - research/ch-qcow-refblock-transaction-r634r
    paths:
      - .github/workflows/ch-qcow-refblock-clone-cost-r634r.yml
      - investigations/cloud-hypervisor-qcow-refblock-transaction/clone_cost.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clone-cost:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CH_SHA: 1af93ac7035cda77cd87b0c18b1134ebb0928052
    steps:
      - name: Check out Fieldwork carrier
        uses: actions/checkout@v4
        with:
          path: fieldwork
          persist-credentials: false

      - name: Check out exact Cloud Hypervisor source
        uses: actions/checkout@v4
        with:
          repository: cloud-hypervisor/cloud-hypervisor
          ref: ${{ env.CH_SHA }}
          path: cloud-hypervisor
          persist-credentials: false

      - name: Verify source constants and formula
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git -C cloud-hypervisor rev-parse HEAD)" = "$CH_SHA"
          grep -F 'MAX_QCOW_FILE_SIZE: u64 = 0x01 << 44' cloud-hypervisor/block/src/formats/qcow/header.rs
          grep -F 'MAX_RAM_POINTER_TABLE_SIZE: u64 = 35_000_000' cloud-hypervisor/block/src/formats/qcow/header.rs
          grep -F 'pub(super) fn max_refcount_clusters(' cloud-hypervisor/block/src/formats/qcow/header.rs

      - name: Quantify accepted snapshot cost
        shell: bash
        run: |
          set -euxo pipefail
          python3 fieldwork/investigations/cloud-hypervisor-qcow-refblock-transaction/clone_cost.py | tee clone-cost.txt
          grep -F 'refcount_table_entries=33884678' clone-cost.txt
          grep -F 'refcount_table_clone_bytes=271077424' clone-cost.txt
          grep -F 'parser_accepted=true' clone-cost.txt

      - name: Upload receipt
        uses: actions/upload-artifact@v4
        with:
          name: ch-qcow-refblock-clone-cost-r634r
          path: clone-cost.txt
