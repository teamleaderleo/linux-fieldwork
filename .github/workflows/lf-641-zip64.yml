name: lf-641 ZIP64 signed-range reproducer

on:
  push:
    branches: [lf-641-zip64-exec]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      UPSTREAM_HEAD: ab9d0f2c5c44dd72ce253e6e894e2f0edc9205b4
    steps:
      - uses: actions/checkout@v4
      - name: Build tiny ZIP64 fixtures and execute exact-current parser
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential clang zlib1g-dev liblzma-dev liblzo2-dev liblz4-dev libzstd-dev
          rm -rf /tmp/sq /tmp/evidence /tmp/out-*.sqfs
          mkdir -p /tmp/evidence
          uname -a | tee /tmp/evidence/environment.txt
          clang --version | tee -a /tmp/evidence/environment.txt
          git --version | tee -a /tmp/evidence/environment.txt

          git clone https://github.com/plougher/squashfs-tools.git /tmp/sq
          git -C /tmp/sq checkout --detach "$UPSTREAM_HEAD"
          test "$(git -C /tmp/sq rev-parse HEAD)" = "$UPSTREAM_HEAD"
          git -C /tmp/sq show -s --format='%H %cI %s' HEAD | tee /tmp/evidence/upstream-head.txt

          python3 <<'PY' | tee /tmp/evidence/fixture-layout.txt
          import hashlib, struct, zipfile
          from pathlib import Path

          p32 = lambda x: struct.pack('<I', x)
          p16 = lambda x: struct.pack('<H', x)
          p64 = lambda x: struct.pack('<Q', x)
          name = b'a'
          dos_time = 0
          dos_date = 0x0021

          local = b''.join([
              p32(0x04034b50), p16(45), p16(0), p16(0), p16(dos_time), p16(dos_date),
              p32(0), p32(0), p32(0), p16(len(name)), p16(0), name
          ])
          cd_off = len(local)
          central = b''.join([
              p32(0x02014b50), p16((3 << 8) | 45), p16(45), p16(0), p16(0),
              p16(dos_time), p16(dos_date), p32(0), p32(0), p32(0), p16(len(name)), p16(0),
              p16(0), p16(0), p16(0), p32((0o100644 << 16)), p32(0), name
          ])
          cd_size = len(central)
          z64_off = cd_off + cd_size
          z64 = b''.join([
              p32(0x06064b50), p64(44), p16((3 << 8) | 45), p16(45),
              p32(0), p32(0), p64(1), p64(1), p64(cd_size), p64(cd_off)
          ])
          locator_off = z64_off + len(z64)
          locator = b''.join([p32(0x07064b50), p32(0), p64(z64_off), p32(1)])
          eocd_off = locator_off + len(locator)
          eocd = b''.join([
              p32(0x06054b50), p16(0), p16(0), p16(0xffff), p16(0xffff),
              p32(0xffffffff), p32(0xffffffff), p16(0)
          ])
          base = bytearray(local + central + z64 + locator + eocd)

          def save(name, data):
              path = Path('/tmp') / name
              path.write_bytes(data)
              print(f'{name} size={len(data)} sha256={hashlib.sha256(data).hexdigest()}')

          save('valid.zip', base)
          with zipfile.ZipFile('/tmp/valid.zip') as z:
              assert z.namelist() == ['a']
              assert z.read('a') == b''

          def mutant(filename, changes):
              d = bytearray(base)
              for off, val in changes:
                  struct.pack_into('<Q', d, off, val)
              save(filename, d)

          mutant('locator-sign.zip', [(locator_off + 8, 1 << 63)])
          mutant('cd-off-sign.zip', [(z64_off + 48, 1 << 63)])
          mutant('cd-size-sign.zip', [(z64_off + 40, 1 << 63)])
          mutant('range-overflow.zip', [(z64_off + 48, (1 << 63) - 1),
                                        (z64_off + 40, 1)])

          print(f'local_size={len(local)} cd_off={cd_off} cd_size={cd_size} '
                f'z64_off={z64_off} locator_off={locator_off} eocd_off={eocd_off}')
          PY

          make -C /tmp/sq/squashfs-tools -j2 mksquashfs
          /tmp/sq/squashfs-tools/mksquashfs /tmp/valid.zip /tmp/out-control.sqfs -zip -noappend -no-progress -no-duplicates -no-xattrs > /tmp/evidence/control.log 2>&1
          test -s /tmp/out-control.sqfs

          cat > /tmp/ubsan.ignore <<'EOF'
          [implicit-integer-sign-change]
          src:*/xattr.c
          EOF
          SAN="-O1 -g -fsanitize=implicit-integer-sign-change,signed-integer-overflow -fsanitize-ignorelist=/tmp/ubsan.ignore -fno-sanitize-recover=all -fno-omit-frame-pointer"
          make -C /tmp/sq/squashfs-tools clean
          make -C /tmp/sq/squashfs-tools -j2 CC=clang EXTRA_CFLAGS="$SAN" EXTRA_LDFLAGS='-fsanitize=implicit-integer-sign-change,signed-integer-overflow' mksquashfs
          cp /tmp/sq/squashfs-tools/mksquashfs /tmp/mksquashfs-san
          export UBSAN_OPTIONS='halt_on_error=1:print_stacktrace=1'

          run_case() {
              local label="$1" image="$2"
              set +e
              /tmp/mksquashfs-san "$image" "/tmp/out-${label}.sqfs" -zip -noappend -no-progress -no-duplicates -no-xattrs > "/tmp/evidence/${label}.log" 2>&1
              local st=$?
              set -e
              echo "status=$st" >> "/tmp/evidence/${label}.log"
              cat "/tmp/evidence/${label}.log"
          }

          run_case valid /tmp/valid.zip
          test "$(tail -1 /tmp/evidence/valid.log)" = 'status=0'
          ! grep -q 'runtime error:' /tmp/evidence/valid.log

          run_case locator-sign /tmp/locator-sign.zip
          grep -Eq "implicit conversion from type 'unsigned long long'.*9223372036854775808.*type 'long long'.*-9223372036854775808" /tmp/evidence/locator-sign.log
          grep -q 'parse_one_zip' /tmp/evidence/locator-sign.log

          run_case cd-off-sign /tmp/cd-off-sign.zip
          grep -Eq "implicit conversion from type 'unsigned long long'.*9223372036854775808.*type 'long long'.*-9223372036854775808" /tmp/evidence/cd-off-sign.log
          grep -q 'parse_one_zip' /tmp/evidence/cd-off-sign.log

          run_case cd-size-sign /tmp/cd-size-sign.zip
          grep -Eq "implicit conversion from type 'unsigned long long'.*9223372036854775808.*type 'long long'.*-9223372036854775808" /tmp/evidence/cd-size-sign.log
          grep -q 'parse_one_zip' /tmp/evidence/cd-size-sign.log

          run_case range-overflow /tmp/range-overflow.zip
          grep -q 'signed integer overflow: 9223372036854775807 + 1 cannot be represented in type' /tmp/evidence/range-overflow.log
          grep -q 'parse_one_zip' /tmp/evidence/range-overflow.log

          sha256sum /tmp/*.zip | sort > /tmp/evidence/fixture-sha256.txt
          echo 'ALL LF-641 ZIP64 RUNTIME ASSERTIONS PASSED' | tee /tmp/evidence/result.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lf-641-zip64-evidence
          path: /tmp/evidence
