name: research-515-registry-404-cache

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/research-515-registry-404-cache.yml'

permissions:
  contents: read

jobs:
  sample:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Sample public registry negative responses
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/registry-404-515"
          rm -rf "$ROOT"
          mkdir -p "$ROOT/headers"
          NAME="fieldwork-negative-cache-515-this-project-should-not-exist"
          TSV="$ROOT/public.tsv"
          printf 'registry\tmethod\tattempt\tstatus\tcache_control\tage\tetag\tlast_modified\tvia\tx_cache\tserver\n' > "$TSV"

          sample() {
            registry="$1"; url="$2"; method="$3"; attempt="$4"
            hdr="$ROOT/headers/${registry}-${method}-${attempt}.txt"
            if [ "$method" = HEAD ]; then
              status=$(curl -sS -I --max-time 20 -D "$hdr" -o /dev/null -w '%{http_code}' "$url" || true)
            else
              status=$(curl -sS --max-time 20 -D "$hdr" -o /dev/null -w '%{http_code}' "$url" || true)
            fi
            one() { awk -F': *' -v k="$1" 'BEGIN{IGNORECASE=1} $1==k {sub(/\r$/,"",$2); print $2; exit}' "$hdr"; }
            printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n' \
              "$registry" "$method" "$attempt" "$status" \
              "$(one cache-control || true)" "$(one age || true)" "$(one etag || true)" \
              "$(one last-modified || true)" "$(one via || true)" "$(one x-cache || true)" \
              "$(one server || true)" >> "$TSV"
            echo "=== $registry $method $attempt $status ==="
            cat "$hdr"
          }

          declare -A URLS
          URLS[pypi]="https://pypi.org/simple/$NAME/"
          URLS[testpypi]="https://test.pypi.org/simple/$NAME/"
          URLS[piwheels]="https://www.piwheels.org/simple/$NAME/"
          URLS[pytorch]="https://download.pytorch.org/whl/$NAME/"

          for registry in pypi testpypi piwheels pytorch; do
            for method in GET HEAD; do
              for attempt in 1 2; do
                sample "$registry" "${URLS[$registry]}" "$method" "$attempt"
                sleep 1
              done
            done
          done

          echo '=== PUBLIC SUMMARY ==='
          column -t -s $'\t' "$TSV" || cat "$TSV"
          cp "$TSV" "$GITHUB_WORKSPACE/results-515-public.tsv"
          cp -r "$ROOT/headers" "$GITHUB_WORKSPACE/headers-515-public"

      - name: Run local pypiserver policy controls
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/pypiserver-515"
          rm -rf "$ROOT"
          mkdir -p "$ROOT/staging"
          python -m venv "$ROOT/venv"
          "$ROOT/venv/bin/pip" -q install pypiserver
          "$ROOT/venv/bin/pypi-server" run --help | grep -F -- '--disable-fallback'

          python - "$ROOT/staging" <<'PY'
          import base64,csv,hashlib,io,pathlib,sys,zipfile
          target=pathlib.Path(sys.argv[1])
          files={
            'probe_tool/__init__.py': b'',
            'probe_tool-1.0.0.dist-info/METADATA': b'Metadata-Version: 2.1\nName: probe-tool\nVersion: 1.0.0\n',
            'probe_tool-1.0.0.dist-info/WHEEL': b'Wheel-Version: 1.0\nGenerator: fieldwork-515\nRoot-Is-Purelib: true\nTag: py3-none-any\n',
          }
          rows=[]
          for name,data in files.items():
            digest=base64.urlsafe_b64encode(hashlib.sha256(data).digest()).rstrip(b'=').decode()
            rows.append([name,f'sha256={digest}',str(len(data))])
          rows.append(['probe_tool-1.0.0.dist-info/RECORD','',''])
          sio=io.StringIO(); csv.writer(sio,lineterminator='\n').writerows(rows)
          files['probe_tool-1.0.0.dist-info/RECORD']=sio.getvalue().encode()
          with zipfile.ZipFile(target/'probe_tool-1.0.0-py3-none-any.whl','w',zipfile.ZIP_DEFLATED) as zf:
            for name,data in files.items(): zf.writestr(name,data)
          PY

          printf 'policy\tphase\tstatus\tcache_control\tlocation\n' > "$ROOT/results.tsv"

          run_policy() {
            policy="$1"; port="$2"; expected_before="$3"; shift 3
            pkgdir="$ROOT/packages-$policy"
            hdrdir="$ROOT/headers-$policy"
            mkdir -p "$pkgdir" "$hdrdir"
            "$ROOT/venv/bin/pypi-server" run -p "$port" "$@" "$pkgdir" >"$ROOT/server-$policy.log" 2>&1 &
            pid=$!
            for _ in $(seq 1 30); do
              if curl -sS --max-time 2 "http://127.0.0.1:$port/" >/dev/null 2>&1; then break; fi
              sleep 1
            done

            probe() {
              phase="$1"
              hdr="$hdrdir/$phase.txt"
              status=$(curl -sS --max-time 5 -D "$hdr" -o /dev/null -w '%{http_code}' "http://127.0.0.1:$port/simple/probe-tool/" || true)
              cc=$(awk -F': *' 'BEGIN{IGNORECASE=1} $1=="cache-control" {sub(/\r$/,"",$2); print $2; exit}' "$hdr")
              loc=$(awk -F': *' 'BEGIN{IGNORECASE=1} $1=="location" {sub(/\r$/,"",$2); print $2; exit}' "$hdr")
              printf '%s\t%s\t%s\t%s\t%s\n' "$policy" "$phase" "$status" "$cc" "$loc" >> "$ROOT/results.tsv"
              echo "=== pypiserver $policy $phase $status ==="
              cat "$hdr"
            }

            probe before
            cp "$ROOT/staging/probe_tool-1.0.0-py3-none-any.whl" "$pkgdir/"
            sleep 1
            probe after
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true

            python - "$ROOT/results.tsv" "$policy" "$expected_before" <<'PY'
          import csv,sys
          rows=[r for r in csv.DictReader(open(sys.argv[1]),delimiter='\t') if r['policy']==sys.argv[2]]
          by={r['phase']:r for r in rows}
          assert by['before']['status']==sys.argv[3], (sys.argv[2],by)
          assert by['after']['status']=='200', (sys.argv[2],by)
          print(f"PYPI_SERVER_{sys.argv[2].upper()}_PUBLICATION_TRANSITION=PASS")
          PY
          }

          # Default pypiserver redirects a missing project to PyPI.
          run_policy fallback 8085 303
          # With fallback disabled, the same missing project is a real 404.
          run_policy no-fallback 8086 404 --disable-fallback

          echo '=== PYPI SERVER SUMMARY ==='
          cat "$ROOT/results.tsv"
          cat "$ROOT/server-fallback.log"
          cat "$ROOT/server-no-fallback.log"

          cp "$ROOT/results.tsv" "$GITHUB_WORKSPACE/results-515-pypiserver.tsv"
          cp -r "$ROOT/headers-fallback" "$GITHUB_WORKSPACE/headers-515-pypiserver-fallback"
          cp -r "$ROOT/headers-no-fallback" "$GITHUB_WORKSPACE/headers-515-pypiserver-no-fallback"

      - name: Upload registry cache research receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: registry-404-cache-515
          path: |
            results-515-public.tsv
            results-515-pypiserver.tsv
            headers-515-public/
            headers-515-pypiserver-fallback/
            headers-515-pypiserver-no-fallback/
          if-no-files-found: warn
