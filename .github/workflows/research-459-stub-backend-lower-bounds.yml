name: Research 459 stub backend lower bounds

on:
  push:
    branches: [research/459-stub-backend-runtime]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lower-bounds:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install UV build frontend
        run: |
          python -m pip install 'uv==0.11.29'
          uv --version
          python --version
      - name: Execute lower-bound stub probes
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/stub-lower-bounds"
          rm -rf "$ROOT"
          mkdir -p "$ROOT"

          mkbase() {
            mkdir -p "$ROOT/$1/src/foo-stubs"
            printf '%s\n' 'def answer() -> int: ...' > "$ROOT/$1/src/foo-stubs/__init__.pyi"
          }

          inspect_wheel() {
            label="$1"
            expected_stub="$2"
            wheel=$(find "$ROOT/$label/dist" -maxdepth 1 -name '*.whl' -print -quit)
            python - "$label" "$wheel" "$expected_stub" <<'PY'
          import configparser
          import io
          import sys
          import zipfile

          label, wheel, expected = sys.argv[1:]
          expected = expected.lower() == 'true'
          with zipfile.ZipFile(wheel) as zf:
              names = sorted(zf.namelist())
              console_scripts = []
              for name in names:
                  if not name.endswith('.dist-info/entry_points.txt'):
                      continue
                  text = zf.read(name).decode('utf-8')
                  print(f'ENTRY_POINTS {label} {name}')
                  print(text if text else '<empty>')
                  parser = configparser.ConfigParser()
                  parser.optionxform = str
                  parser.read_file(io.StringIO(text))
                  if parser.has_section('console_scripts'):
                      console_scripts.extend(parser.options('console_scripts'))
          has_stub = 'foo-stubs/__init__.pyi' in names
          print(f'WHEEL {label} {wheel}')
          for name in names:
              print(f'  {name}')
          print(f'HAS_STUB {label} {has_stub}')
          print(f'HAS_CONSOLE_SCRIPT {label} {bool(console_scripts)}')
          if has_stub != expected:
              raise SystemExit(f'{label}: expected HAS_STUB={expected}, got {has_stub}')
          if console_scripts:
              raise SystemExit(f'{label}: unexpected console scripts: {console_scripts}')
          PY
          }

          build_case() {
            label="$1"
            expected_stub="$2"
            echo "=== $label ==="
            (cd "$ROOT/$label" && uv build --wheel --out-dir dist -v)
            inspect_wheel "$label" "$expected_stub"
          }

          for label in pdm-214-default pdm-214-explicit setuptools-610-default setuptools-610-config; do
            mkbase "$label"
          done

          cat > "$ROOT/pdm-214-default/pyproject.toml" <<'TOML'
          [project]
          name = "foo-stubs"
          version = "0.1.0"
          requires-python = ">=3.7"

          [build-system]
          requires = ["pdm-backend==2.1.4"]
          build-backend = "pdm.backend"
          TOML

          cat > "$ROOT/pdm-214-explicit/pyproject.toml" <<'TOML'
          [project]
          name = "foo-stubs"
          version = "0.1.0"
          requires-python = ">=3.7"

          [tool.pdm.build]
          includes = ["src/foo-stubs"]

          [build-system]
          requires = ["pdm-backend==2.1.4"]
          build-backend = "pdm.backend"
          TOML

          cat > "$ROOT/setuptools-610-default/pyproject.toml" <<'TOML'
          [project]
          name = "foo-stubs"
          version = "0.1.0"
          requires-python = ">=3.7"

          [build-system]
          requires = ["setuptools==61.0.0"]
          build-backend = "setuptools.build_meta"
          TOML

          cat > "$ROOT/setuptools-610-config/pyproject.toml" <<'TOML'
          [project]
          name = "foo-stubs"
          version = "0.1.0"
          requires-python = ">=3.7"

          [tool.setuptools.package-data]
          "foo-stubs" = ["*.pyi"]

          [build-system]
          requires = ["setuptools==61.0.0"]
          build-backend = "setuptools.build_meta"
          TOML

          # Negative controls: old automatic behavior should not silently prove the config path.
          build_case pdm-214-default false
          build_case setuptools-610-default false

          # Positive cases: explicit config should preserve the real PEP 561 wheel path.
          build_case pdm-214-explicit true
          build_case setuptools-610-config true
