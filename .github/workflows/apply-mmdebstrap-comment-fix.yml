name: Apply mmdebstrap comment fix

on:
  push:
    branches:
      - fix/mmdebstrap-comment-clarity
    paths:
      - .github/workflows/apply-mmdebstrap-comment-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update source and submission patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path("upstream/mmdebstrap/mmdebstrap")
          source = source_path.read_text(encoding="utf-8")
          old_source = (
              "        # since the output is a tarball, we create the rootfs in a temporary\n"
              "        # directory\n"
          )
          new_source = (
              "        # create the rootfs in a temporary directory before creating or\n"
              "        # discarding the requested output\n"
          )
          if source.count(old_source) != 1:
              raise SystemExit("expected source comment exactly once")
          source_path.write_text(source.replace(old_source, new_source), encoding="utf-8")

          patch_path = Path(
              "investigations/mmdebstrap-unwritable-tmpdir/submission/"
              "0001-honor-explicit-tmpdir.patch"
          )
          patch = patch_path.read_text(encoding="utf-8")
          old_patch = (
              "         # since the output is a tarball, we create the rootfs in a temporary\n"
              "         # directory\n"
          )
          new_patch = (
              "-        # since the output is a tarball, we create the rootfs in a temporary\n"
              "-        # directory\n"
              "+        # create the rootfs in a temporary directory before creating or\n"
              "+        # discarding the requested output\n"
          )
          if patch.count(old_patch) != 1:
              raise SystemExit("expected patch comment exactly once")
          patch_path.write_text(patch.replace(old_patch, new_patch), encoding="utf-8")

          Path(".github/workflows/apply-mmdebstrap-comment-fix.yml").unlink()
          PY

      - name: Commit changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Clarify mmdebstrap temporary-root comment"
          git push
