name: Research 479 normalized stub thunderdome

on:
  push:
    branches: [research/479-normalized-stub-thunderdome]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  showdown:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Fieldwork carrier
        uses: actions/checkout@v4

      - name: Check out UV comparison base
        uses: actions/checkout@v4
        with:
          repository: teamleaderleo/uv
          ref: dd0584d560a4693b5713a78be54304123ada3e77
          path: uv-base
          persist-credentials: false

      - name: Install formatter for UV toolchain
        run: rustup component add --toolchain 1.97.1-x86_64-unknown-linux-gnu rustfmt

      - name: Run normalized showdown
        shell: bash
        run: bash investigations/uv-stubs-backend-scope/thunderdome/run_normalized_showdown.sh
