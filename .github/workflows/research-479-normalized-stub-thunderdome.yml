name: Research 479 normalized stub thunderdome

on:
  push:
    branches: [research/479-normalized-stub-thunderdome]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  showdown:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Fieldwork carrier
        uses: actions/checkout@v4

      - name: Check out UV comparison base
        uses: actions/checkout@v4
        with:
          repository: teamleaderleo/uv
          ref: dd0584d560a4693b5713a78be54304123ada3e77
          path: uv-base
          persist-credentials: false

      - name: Create normalized contestants
        shell: bash
        run: |
          set -euo pipefail
          cp -a uv-base uv-support
          cp -a uv-base uv-reject

          python investigations/uv-stubs-backend-scope/thunderdome/normalized_transform.py \
            support uv-support/crates/uv/src/commands/project/init.rs
          python investigations/uv-stubs-backend-scope/thunderdome/normalized_transform.py \
            reject uv-reject/crates/uv/src/commands/project/init.rs

          (cd uv-support && cargo fmt --all)
          (cd uv-reject && cargo fmt --all)

          git -C uv-support diff --check
          git -C uv-reject diff --check

          echo '=== SUPPORT DIFF STAT ==='
          git -C uv-support diff --stat
          echo '=== REJECT DIFF STAT ==='
          git -C uv-reject diff --stat

          echo '=== POLICY-ONLY SOURCE DIFF (reject -> support) ==='
          diff -u \
            uv-reject/crates/uv/src/commands/project/init.rs \
            uv-support/crates/uv/src/commands/project/init.rs || true

      - name: Build both UV candidates
        shell: bash
        run: |
          set -euo pipefail
          rustup show
          export CARGO_TARGET_DIR="$RUNNER_TEMP/uv-thunderdome-target"

          cargo build --manifest-path uv-support/Cargo.toml --package uv --bin uv
          cp "$CARGO_TARGET_DIR/debug/uv" "$RUNNER_TEMP/uv-support"

          cargo build --manifest-path uv-reject/Cargo.toml --package uv --bin uv
          cp "$CARGO_TARGET_DIR/debug/uv" "$RUNNER_TEMP/uv-reject"

          "$RUNNER_TEMP/uv-support" --version
          "$RUNNER_TEMP/uv-reject" --version

      - name: Exercise both policies
        shell: bash
        run: |
          set -euo pipefail

          exercise_policy() {
            policy="$1"
            UV="$2"
            ROOT="$RUNNER_TEMP/normalized-$policy"
            rm -rf "$ROOT"
            mkdir -p "$ROOT"

            init_supported() {
              label="$1"
              backend="$2"
              mkdir -p "$ROOT/$label"
              if [ -n "$backend" ]; then
                (cd "$ROOT/$label" && "$UV" init --package --name foo-stubs --build-backend "$backend" --no-workspace --vcs none)
              else
                (cd "$ROOT/$label" && "$UV" init --package --name foo-stubs --no-workspace --vcs none)
              fi
              (cd "$ROOT/$label" && "$UV" build --wheel --out-dir dist)
            }

            init_supported uv ""
            init_supported hatch hatchling
            init_supported poetry poetry
            init_supported flit flit
            init_supported pdm pdm
            init_supported setuptools setuptools
            if [ "$policy" = support ]; then
              init_supported scikit scikit
            fi

            # Library generation follows the same simple-stub inference.
            mkdir -p "$ROOT/lib-hatch"
            (cd "$ROOT/lib-hatch" && "$UV" init --lib --name foo-stubs --build-backend hatchling --no-workspace --vcs none)
            (cd "$ROOT/lib-hatch" && "$UV" build --wheel --out-dir dist)
            if [ "$policy" = support ]; then
              mkdir -p "$ROOT/lib-scikit"
              (cd "$ROOT/lib-scikit" && "$UV" init --lib --name foo-stubs --build-backend scikit --no-workspace --vcs none)
              (cd "$ROOT/lib-scikit" && "$UV" build --wheel --out-dir dist)
            fi

            # Explicit --app --package has already collapsed to the same source-generating kind.
            mkdir -p "$ROOT/app-hatch"
            (cd "$ROOT/app-hatch" && "$UV" init --app --package --name foo-stubs --build-backend hatchling --no-workspace --vcs none)
            (cd "$ROOT/app-hatch" && "$UV" build --wheel --out-dir dist)

            # PackageName canonicalization makes equivalent separators the same project identity.
            mkdir -p "$ROOT/canonical-alias"
            (cd "$ROOT/canonical-alias" && "$UV" init --package --name foo_stubs --no-workspace --vcs none)
            (cd "$ROOT/canonical-alias" && "$UV" build --wheel --out-dir dist)

            reject_without_side_effects() {
              label="$1"
              mode="$2"
              backend="$3"
              set +e
              (cd "$ROOT" && "$UV" init "$label" "$mode" --name foo-stubs --build-backend "$backend" --no-workspace) >"$ROOT/$label.log" 2>&1
              code=$?
              set -e
              cat "$ROOT/$label.log"
              test "$code" -ne 0
              test ! -e "$ROOT/$label"
            }

            reject_without_side_effects reject-maturin-package --package maturin
            reject_without_side_effects reject-maturin-lib --lib maturin
            if [ "$policy" = reject ]; then
              reject_without_side_effects reject-scikit-package --package scikit
              reject_without_side_effects reject-scikit-lib --lib scikit
            fi

            # Bare mode remains the explicit custom-layout escape hatch for both native backends.
            for backend in scikit maturin; do
              mkdir -p "$ROOT/bare-$backend"
              (cd "$ROOT/bare-$backend" && "$UV" init --bare --name foo-stubs --build-backend "$backend" --no-workspace --vcs none)
              test -f "$ROOT/bare-$backend/pyproject.toml"
              test ! -e "$ROOT/bare-$backend/src"
            done

            # Ordinary projects must retain their existing backend-template families/configuration.
            for backend in hatchling poetry flit pdm setuptools; do
              label="ordinary-${backend//[^a-zA-Z0-9]/-}"
              mkdir -p "$ROOT/$label"
              (cd "$ROOT/$label" && "$UV" init --package --name foo --build-backend "$backend" --no-workspace --vcs none)
            done

            mkdir -p "$ROOT/ordinary-scikit"
            (cd "$ROOT/ordinary-scikit" && "$UV" init --package --name foo --build-backend scikit --no-workspace --vcs none)
            test -f "$ROOT/ordinary-scikit/CMakeLists.txt"
            test -f "$ROOT/ordinary-scikit/src/main.cpp"
            test -f "$ROOT/ordinary-scikit/src/foo/_core.pyi"

            python - "$ROOT" "$policy" <<'PY'
          import configparser
          import io
          import pathlib
          import sys
          import tomllib
          import zipfile

          root = pathlib.Path(sys.argv[1])
          policy = sys.argv[2]
          supported = [
              "uv",
              "hatch",
              "poetry",
              "flit",
              "pdm",
              "setuptools",
              "lib-hatch",
              "app-hatch",
              "canonical-alias",
          ]
          if policy == "support":
              supported += ["scikit", "lib-scikit"]

          for label in supported:
              project = root / label
              pyproject_text = (project / "pyproject.toml").read_text()
              data = tomllib.loads(pyproject_text)
              if data["project"]["name"] != "foo-stubs":
                  raise SystemExit(f"{policy}/{label}: non-canonical project name {data['project']['name']}")
              if "scripts" in data.get("project", {}):
                  raise SystemExit(f"{policy}/{label}: generated a runtime [project.scripts] entry")
              if not (project / "src/foo-stubs/__init__.pyi").is_file():
                  raise SystemExit(f"{policy}/{label}: missing src/foo-stubs/__init__.pyi")
              if (project / "src/foo_stubs/__init__.py").exists():
                  raise SystemExit(f"{policy}/{label}: generated normalized runtime package")

              wheels = list((project / "dist").glob("*.whl"))
              if len(wheels) != 1:
                  raise SystemExit(f"{policy}/{label}: expected one wheel, found {len(wheels)}")
              with zipfile.ZipFile(wheels[0]) as zf:
                  names = sorted(zf.namelist())
                  if "foo-stubs/__init__.pyi" not in names:
                      raise SystemExit(f"{policy}/{label}: wheel omitted foo-stubs/__init__.pyi: {names}")
                  console_scripts = []
                  for name in names:
                      if not name.endswith(".dist-info/entry_points.txt"):
                          continue
                      text = zf.read(name).decode()
                      parser = configparser.ConfigParser()
                      parser.optionxform = str
                      parser.read_file(io.StringIO(text))
                      if parser.has_section("console_scripts"):
                          console_scripts.extend(parser.options("console_scripts"))
                  if console_scripts:
                      raise SystemExit(f"{policy}/{label}: unexpected console scripts {console_scripts}")
              print(f"PASS {policy}/{label}: {wheels[0].name}")

          expected = {
              "hatch": '[tool.hatch.build.targets.wheel]\npackages = ["src/foo-stubs"]',
              "poetry": '[tool.poetry]\npackages = [{ include = "foo-stubs", from = "src" }]',
              "flit": 'requires = ["flit_core>=4,<5"]',
              "pdm": '[tool.pdm.build]\nincludes = ["src/foo-stubs"]',
              "setuptools": '[tool.setuptools.package-data]\n"*" = ["*.pyi"]',
          }
          if policy == "support":
              expected["scikit"] = '[tool.scikit-build]\nminimum-version = "build-system.requires"\nwheel.cmake = false\nwheel.packages = ["src/foo-stubs"]'
          for label, snippet in expected.items():
              text = (root / label / "pyproject.toml").read_text()
              if snippet not in text:
                  raise SystemExit(f"{policy}/{label}: missing backend adapter: {snippet}")

          ordinary_checks = {
              "ordinary-hatchling": ["[tool.hatch.build.targets.wheel]"],
              "ordinary-poetry": ["[tool.poetry]"],
              "ordinary-pdm": ["[tool.pdm.build]"],
              "ordinary-setuptools": ["[tool.setuptools.package-data]"],
          }
          for label, forbidden in ordinary_checks.items():
              text = (root / label / "pyproject.toml").read_text()
              for snippet in forbidden:
                  if snippet in text:
                      raise SystemExit(f"{policy}/{label}: leaked stub config {snippet}")

          ordinary_flit = (root / "ordinary-flit" / "pyproject.toml").read_text()
          if 'requires = ["flit_core>=3.2,<4"]' not in ordinary_flit:
              raise SystemExit(f"{policy}: ordinary Flit requirement changed")

          ordinary_scikit = (root / "ordinary-scikit" / "pyproject.toml").read_text()
          for snippet in ["build-dir = \"build/{wheel_tag}\"", "pybind11>=3", "CMakeLists.txt"]:
              if snippet not in ordinary_scikit:
                  raise SystemExit(f"{policy}: ordinary Scikit template changed: {snippet}")
          PY
          }

          exercise_policy support "$RUNNER_TEMP/uv-support"
          exercise_policy reject "$RUNNER_TEMP/uv-reject"
