name: kmod recursive config identity

on:
  push:
    paths:
      - ".github/workflows/kmod-modprobe-config-path.yml"
      - "investigations/kmod-modprobe-options-config-path/**"
      - "tests/test_kmod_modprobe_config_workflow.py"
  pull_request:
    paths:
      - ".github/workflows/kmod-modprobe-config-path.yml"
      - "investigations/kmod-modprobe-options-config-path/**"
      - "tests/test_kmod_modprobe_config_workflow.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kmod-modprobe-config-path-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-master:
    name: exact master (${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]

    steps:
      - name: Check out Linux Fieldwork
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate workflow contract
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest -v tests.test_kmod_modprobe_config_workflow

      - name: Check out exact kmod master snapshot
        uses: actions/checkout@v4
        with:
          repository: kmod-project/kmod
          ref: 5086df53090b2fe9fa1c31351c05a78a12a4ba71
          path: kmod
          persist-credentials: false

      - name: Install build dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang \
            gcc \
            libclang-rt-dev \
            liblzma-dev \
            libssl-dev \
            libzstd-dev \
            meson \
            ninja-build \
            pkg-config \
            python3 \
            zlib1g-dev

      - name: Verify exact source and toolchain identity
        env:
          CC: ${{ matrix.compiler }}
        run: |
          set -euxo pipefail
          out="kmod-receipt-${{ matrix.compiler }}"
          mkdir -p "$out"
          test "$(git -C kmod rev-parse HEAD)" = "5086df53090b2fe9fa1c31351c05a78a12a4ba71"
          git -C kmod status --short --untracked-files=no | tee "$out/source-status.txt"
          test ! -s "$out/source-status.txt"
          git -C kmod rev-parse HEAD > "$out/source-head.txt"
          git -C kmod rev-parse HEAD:tools/modprobe.c > "$out/source-modprobe-blob.txt"
          {
            "$CC" --version | head -n1
            meson --version
            ninja --version
            pkg-config --modversion openssl
          } > "$out/toolchain.txt"

          if [[ "$CC" == clang* ]]; then
            runtime_lib="$("$CC" --print-file-name=libclang_rt.asan-x86_64.so)"
            test "$runtime_lib" != "libclang_rt.asan-x86_64.so"
            test -f "$runtime_lib"
            runtime_dir="$(dirname "$runtime_lib")"
            {
              printf 'asan_runtime=%s\n' "$runtime_lib"
              sha256sum "$runtime_lib"
            } > "$out/sanitizer-runtime.txt"
            printf 'LD_LIBRARY_PATH=%s%s\n' \
              "$runtime_dir" "${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" \
              >> "$GITHUB_ENV"
          else
            printf 'asan_runtime=compiler-default\n' > "$out/sanitizer-runtime.txt"
          fi

      - name: Configure and build with sanitizers
        env:
          CC: ${{ matrix.compiler }}
        run: |
          set -euxo pipefail
          build="build-${{ matrix.compiler }}"
          out="kmod-receipt-${{ matrix.compiler }}"
          meson setup "kmod/$build" kmod \
            --buildtype=debug \
            -Db_sanitize=address,undefined \
            -Dbuild-tests=false \
            -Ddocs=false \
            -Dmanpages=false \
            -Dmbedtls=disabled \
            -Dopenssl=enabled \
            > "$out/meson-setup.log" 2>&1
          meson compile -C "kmod/$build" \
            > "$out/build.log" 2>&1
          test -x "kmod/$build/modprobe"
          ldd "kmod/$build/modprobe" | tee "$out/modprobe-ldd.txt"
          ! grep -F 'not found' "$out/modprobe-ldd.txt"
          "kmod/$build/modprobe" --version | tee "$out/modprobe-version.txt"

      - name: Run exact discriminator twice
        env:
          ASAN_OPTIONS: abort_on_error=1:detect_leaks=1:strict_string_checks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          set -euxo pipefail
          build="$PWD/kmod/build-${{ matrix.compiler }}"
          out="$PWD/kmod-receipt-${{ matrix.compiler }}"
          export PATH="$build:$PATH"
          test "$(command -v modprobe)" = "$build/modprobe"

          python3 investigations/kmod-modprobe-options-config-path/test_modprobe_options_config_path.py \
            > "$out/first.json"
          python3 investigations/kmod-modprobe-options-config-path/test_modprobe_options_config_path.py \
            > "$out/rerun.json"
          cmp "$out/first.json" "$out/rerun.json"

          python3 - "$out/first.json" "$build/modprobe" <<'PY'
          import json
          import pathlib
          import sys

          result_path = pathlib.Path(sys.argv[1])
          expected_modprobe = str(pathlib.Path(sys.argv[2]).resolve())
          data = json.loads(result_path.read_text(encoding="utf-8"))

          observed_modprobe = str(pathlib.Path(data["environment"]["modprobe"]).resolve())
          if observed_modprobe != expected_modprobe:
              raise SystemExit(
                  f"wrong executable: expected {expected_modprobe}, observed {observed_modprobe}"
              )

          no_space, spaced = data["cases"]
          checks = (
              ("no-space direct marker count", no_space["direct"]["marker_count"], 1),
              ("no-space nested marker count", no_space["nested"]["marker_count"], 1),
              ("spaced direct marker count", spaced["direct"]["marker_count"], 1),
              ("spaced nested marker count", spaced["nested"]["marker_count"], 0),
              ("spaced outer status", spaced["outer"]["status"], 0),
              ("spaced nested status", spaced["nested"]["nested_status"], 0),
              ("quoted environment control marker count", data["quoted_env_control"]["marker_count"], 1),
          )
          for label, observed, expected in checks:
              if observed != expected:
                  raise SystemExit(
                      f"{label}: expected {expected!r}, observed {observed!r}"
                  )
          PY

          sha256sum \
            "$build/modprobe" \
            "$out/first.json" \
            "$out/rerun.json" \
            > "$out/sha256.txt"
          uname -srmo > "$out/uname.txt"

      - name: Verify cleanup and source tree
        if: always()
        run: |
          set -euxo pipefail
          out="kmod-receipt-${{ matrix.compiler }}"
          mkdir -p "$out"
          test -z "$(find /tmp -maxdepth 1 -type d -name 'lf-kmod-modprobe-options-*' -print -quit)"
          git -C kmod status --short --untracked-files=no | tee "$out/final-source-status.txt"
          test ! -s "$out/final-source-status.txt"

      - name: Upload exact receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kmod-modprobe-config-${{ matrix.compiler }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: kmod-receipt-${{ matrix.compiler }}/
          if-no-files-found: error
          retention-days: 30
