name: Correct chrootless TMPDIR helper prototype

on:
  pull_request:
    paths:
      - '.github/workflows/fix-chrootless-tmpdir-prototype.yml'

permissions:
  contents: write

jobs:
  correct:
    if: github.head_ref == 'fix/chrootless-target-tmpdir' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/chrootless-target-tmpdir
          fetch-depth: 0

      - name: Accept the selected root argument
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('upstream/mmdebstrap/mmdebstrap')
          text = path.read_text()
          old = 'sub chrootless_dpkg_environment() {'
          new = 'sub chrootless_dpkg_environment($) {'
          if text.count(old) != 1:
              raise SystemExit(f'expected one helper prototype, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Validate source and focused contract
        shell: bash
        run: |
          set -euo pipefail
          {
            perl -c upstream/mmdebstrap/mmdebstrap
            bash -n investigations/mmdebstrap-chrootless-env/run.sh
            python3 -m unittest tests.test_mmdebstrap_chrootless_tmpdir -v
          } |& tee investigations/mmdebstrap-chrootless-target-tmpdir/focused-test.log
          printf '0\n' > investigations/mmdebstrap-chrootless-target-tmpdir/focused-test.status

      - name: Commit corrected candidate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git diff origin/main -- \
            upstream/mmdebstrap/mmdebstrap \
            investigations/mmdebstrap-chrootless-env/run.sh \
            > investigations/mmdebstrap-chrootless-target-tmpdir/0001-target-contained-tmpdir.patch
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            upstream/mmdebstrap/mmdebstrap \
            investigations/mmdebstrap-chrootless-target-tmpdir/0001-target-contained-tmpdir.patch \
            investigations/mmdebstrap-chrootless-target-tmpdir/focused-test.log \
            investigations/mmdebstrap-chrootless-target-tmpdir/focused-test.status
          git rm .github/workflows/fix-chrootless-tmpdir-prototype.yml
          git commit -m 'Accept the chrootless target in TMPDIR helper'
          git push origin HEAD:fix/chrootless-target-tmpdir
