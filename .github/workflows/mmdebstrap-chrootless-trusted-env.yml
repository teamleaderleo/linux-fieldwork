name: Verify mmdebstrap trusted chrootless env wrapper

on:
  pull_request:
    paths:
      - 'upstream/mmdebstrap/mmdebstrap'
      - 'investigations/mmdebstrap-chrootless-env/trusted_env_wrapper_probe.sh'
      - '.github/workflows/mmdebstrap-chrootless-trusted-env.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trusted-env:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            apt-utils \
            dpkg-dev \
            libdistro-info-perl \
            libdpkg-perl \
            uidmap

      - name: Check probe syntax
        run: bash -n investigations/mmdebstrap-chrootless-env/trusted_env_wrapper_probe.sh

      - name: Run trusted wrapper probe
        run: bash investigations/mmdebstrap-chrootless-env/trusted_env_wrapper_probe.sh

      - name: Upload retained evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mmdebstrap-trusted-env-${{ github.run_id }}-${{ github.run_attempt }}
          path: investigations/mmdebstrap-chrootless-env/wrapper-results/
          if-no-files-found: warn
          retention-days: 14
