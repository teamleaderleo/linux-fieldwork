name: research-504-uv-find-links

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/research-504-uv-find-links.yml'

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Check out pinned uv current main
        uses: actions/checkout@v4
        with:
          repository: astral-sh/uv
          ref: 1881d30773386da77017f2ad5ceaf160535d65da
          path: uv-main
          persist-credentials: false

      - name: Prepare released uv binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/uv-releases"
          for version in 0.11.26 0.12.0 0.12.1 0.12.2 0.12.3; do
            dest="$RUNNER_TEMP/uv-releases/$version"
            mkdir -p "$dest"
            curl -LsSf "https://github.com/astral-sh/uv/releases/download/$version/uv-x86_64-unknown-linux-gnu.tar.gz" \
              | tar -xz -C "$dest" --strip-components=1
            "$dest/uv" --version
          done

      - name: Build pinned current-main uv
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$RUNNER_TEMP/uv-current-target"
          cargo build --manifest-path uv-main/Cargo.toml --package uv --bin uv
          cp "$CARGO_TARGET_DIR/debug/uv" "$RUNNER_TEMP/uv-current"
          git -C uv-main rev-parse HEAD
          "$RUNNER_TEMP/uv-current" --version

      - name: Execute path-identity matrix
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/find-links-504"
          CALLER="$ROOT/caller"
          NESTED="$CALLER/reqs"
          rm -rf "$ROOT"
          mkdir -p "$CALLER/private_wheels" "$NESTED/private_wheels"

          python - "$CALLER/private_wheels" "$NESTED/private_wheels" <<'PY'
          import base64
          import csv
          import hashlib
          import pathlib
          import sys
          import zipfile

          targets = [pathlib.Path(arg) for arg in sys.argv[1:]]
          files = {
              "demo_pkg/__init__.py": b"__version__ = '1.0.0'\n",
              "demo_pkg-1.0.0.dist-info/METADATA": b"Metadata-Version: 2.1\nName: demo-pkg\nVersion: 1.0.0\n",
              "demo_pkg-1.0.0.dist-info/WHEEL": b"Wheel-Version: 1.0\nGenerator: fieldwork-504\nRoot-Is-Purelib: true\nTag: py3-none-any\n",
          }
          record_rows = []
          for name, data in files.items():
              digest = base64.urlsafe_b64encode(hashlib.sha256(data).digest()).rstrip(b"=").decode()
              record_rows.append([name, f"sha256={digest}", str(len(data))])
          record_rows.append(["demo_pkg-1.0.0.dist-info/RECORD", "", ""])
          out = []
          sio = __import__("io").StringIO()
          csv.writer(sio, lineterminator="\n").writerows(record_rows)
          files["demo_pkg-1.0.0.dist-info/RECORD"] = sio.getvalue().encode()
          for target in targets:
              wheel = target / "demo_pkg-1.0.0-py3-none-any.whl"
              with zipfile.ZipFile(wheel, "w", zipfile.ZIP_DEFLATED) as zf:
                  for name, data in files.items():
                      zf.writestr(name, data)
              print(f"WHEEL={wheel.resolve()} exists={wheel.exists()}")
          PY

          python -m venv "$ROOT/venv"
          PYTHON="$ROOT/venv/bin/python"
          RESULTS="$ROOT/results.tsv"
          printf 'version\tlocation\tvariant\tcommand\texit\n' > "$RESULTS"

          make_requirements() {
            dir="$1"
            variant="$2"
            case "$variant" in
              equals-dot) find_line='--find-links=./private_wheels/' ;;
              space-dot) find_line='--find-links ./private_wheels/' ;;
              equals-plain) find_line='--find-links=private_wheels/' ;;
              absolute) find_line="--find-links=$(python -c 'import pathlib,sys; print(pathlib.Path(sys.argv[1]).resolve())' "$dir/private_wheels")" ;;
              *) echo "unknown variant $variant" >&2; exit 2 ;;
            esac
            cat > "$dir/requirements-$variant.in" <<EOF
          --no-index
          $find_line
          demo-pkg==1.0.0
          EOF
          }

          for dir in "$CALLER" "$NESTED"; do
            for variant in equals-dot space-dot equals-plain absolute; do
              make_requirements "$dir" "$variant"
            done
          done

          run_one() {
            label="$1"
            uv_bin="$2"
            location="$3"
            variant="$4"
            command="$5"
            if [ "$location" = root ]; then
              req="requirements-$variant.in"
            else
              req="reqs/requirements-$variant.in"
            fi
            log="$ROOT/${label}-${location}-${variant}-${command}.log"
            echo "=== $label $location $variant $command ==="
            echo "CALLER=$(python -c 'import pathlib; print(pathlib.Path.cwd().resolve())')"
            python - "$CALLER" "$req" <<'PY'
          import pathlib, sys
          caller = pathlib.Path(sys.argv[1])
          req = caller / sys.argv[2]
          print(f"REQ_ARG={sys.argv[2]}")
          print(f"REQ_RESOLVED={req.resolve()} EXISTS={req.exists()}")
          print(f"REQ_PARENT={req.resolve().parent}")
          print(f"REL_LINKS_RESOLVED={(req.resolve().parent / 'private_wheels').resolve()} EXISTS={(req.resolve().parent / 'private_wheels').exists()}")
          PY
            set +e
            if [ "$command" = compile ]; then
              "$uv_bin" pip compile "$req" -o "$ROOT/out-${label}-${location}-${variant}.txt" >"$log" 2>&1
            else
              "$uv_bin" pip install --dry-run --python "$PYTHON" -r "$req" >"$log" 2>&1
            fi
            code=$?
            set -e
            cat "$log"
            printf '%s\t%s\t%s\t%s\t%s\n' "$label" "$location" "$variant" "$command" "$code" >> "$RESULTS"
          }

          cd "$CALLER"
          for version in 0.11.26 0.12.0 0.12.1 0.12.2 0.12.3; do
            uv_bin="$RUNNER_TEMP/uv-releases/$version/uv"
            for location in root nested; do
              for variant in equals-dot space-dot equals-plain absolute; do
                run_one "$version" "$uv_bin" "$location" "$variant" compile
                run_one "$version" "$uv_bin" "$location" "$variant" install
              done
            done
          done

          for location in root nested; do
            for variant in equals-dot space-dot equals-plain absolute; do
              run_one current "$RUNNER_TEMP/uv-current" "$location" "$variant" compile
              run_one current "$RUNNER_TEMP/uv-current" "$location" "$variant" install
            done
          done

          echo '=== RESULTS ==='
          column -t -s $'\t' "$RESULTS" || cat "$RESULTS"

          python - "$RESULTS" <<'PY'
          import csv, sys
          rows = list(csv.DictReader(open(sys.argv[1]), delimiter='\t'))
          bad_absolute = [r for r in rows if r['variant'] == 'absolute' and r['exit'] != '0']
          assert not bad_absolute, f"absolute-path control failed: {bad_absolute}"
          print("ABSOLUTE_CONTROLS=PASS")
          for version in ['0.11.26','0.12.0','0.12.1','0.12.2','0.12.3','current']:
              subset = [r for r in rows if r['version'] == version]
              passed = sum(r['exit'] == '0' for r in subset)
              print(f"SUMMARY {version}: {passed}/{len(subset)} command rows passed")
          PY

          cp "$RESULTS" "$GITHUB_WORKSPACE/results-504.tsv"
          cp "$ROOT"/*.log "$GITHUB_WORKSPACE/" || true

      - name: Upload research receipt
        uses: actions/upload-artifact@v4
        with:
          name: uv-find-links-504
          path: |
            results-504.tsv
            *.log
          if-no-files-found: error
