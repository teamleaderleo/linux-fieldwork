name: Format chrootless TMPDIR correction

on:
  pull_request:
    paths:
      - '.github/workflows/format-chrootless-tmpdir.yml'

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'fix/chrootless-target-tmpdir' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/chrootless-target-tmpdir
          fetch-depth: 0

      - name: Apply current Debian sid perltidy
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --volume "$PWD:/work" \
            --workdir /work/upstream/mmdebstrap \
            debian:sid-slim \
            sh -euxc '
              apt-get update
              apt-get install --yes --no-install-recommends perltidy
              perltidy < mmdebstrap > /tmp/mmdebstrap.tdy
              cat /tmp/mmdebstrap.tdy > mmdebstrap
            '

      - name: Validate formatted candidate
        shell: bash
        run: |
          set -euo pipefail
          perl -c upstream/mmdebstrap/mmdebstrap
          bash -n investigations/mmdebstrap-chrootless-env/run.sh
          python3 -m unittest tests.test_mmdebstrap_chrootless_tmpdir -v

      - name: Commit formatted candidate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git diff origin/main -- \
            upstream/mmdebstrap/mmdebstrap \
            investigations/mmdebstrap-chrootless-env/run.sh \
            > investigations/mmdebstrap-chrootless-target-tmpdir/0001-target-contained-tmpdir.patch
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            upstream/mmdebstrap/mmdebstrap \
            investigations/mmdebstrap-chrootless-target-tmpdir/0001-target-contained-tmpdir.patch
          git rm .github/workflows/format-chrootless-tmpdir.yml
          git commit -m 'Format chrootless TMPDIR correction'
          git push origin HEAD:fix/chrootless-target-tmpdir
