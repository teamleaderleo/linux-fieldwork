name: Cloud Hypervisor dirty-log streaming repair

on:
  push:
    branches:
      - execute/cloud-hypervisor-dirty-log-streaming
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out Linux Fieldwork carrier
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check out exact signed Cloud Hypervisor candidate
        uses: actions/checkout@v4
        with:
          repository: teamleaderleo/cloud-hypervisor
          ref: 2038c3cb262ac27604f647729557893a61510f99
          path: cloud-hypervisor
          fetch-depth: 1
          persist-credentials: false

      - name: Apply retained streaming repair
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C cloud-hypervisor rev-parse HEAD)" = 2038c3cb262ac27604f647729557893a61510f99
          patch="$GITHUB_WORKSPACE/investigations/cloud-hypervisor-kvm-dirty-log-granule/STREAMING_REPAIR.patch"
          git -C cloud-hypervisor apply --check "$patch"
          git -C cloud-hypervisor apply "$patch"
          git -C cloud-hypervisor diff --check
          test "$(git -C cloud-hypervisor diff --name-only)" = "vmm/src/memory_manager.rs"
          git -C cloud-hypervisor diff -- vmm/src/memory_manager.rs > dirty-log-streaming.diff

      - name: Install validation tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gcc-x86-64-linux-gnu
          rustup toolchain install nightly --profile minimal --component rustfmt
          rustup component add clippy
          rustup target add x86_64-unknown-linux-gnu

      - name: Focused dirty-log tests
        working-directory: cloud-hypervisor
        shell: bash
        run: |
          set -euo pipefail
          cargo +nightly fmt --all -- --check
          cargo test -p vmm --features kvm dirty_log -- --nocapture | tee ../focused-tests.txt
          cargo test -p vm-migration test_memory_range_table_from_dirty_ranges_iter -- --nocapture | tee ../range-control.txt

      - name: KVM and MSHV build fences
        working-directory: cloud-hypervisor
        shell: bash
        run: |
          set -euo pipefail
          cargo check -p vmm --features kvm |& tee ../kvm-check.txt
          cargo check -p vmm --features mshv --target x86_64-unknown-linux-gnu |& tee ../mshv-check.txt

      - name: KVM and MSHV Clippy
        working-directory: cloud-hypervisor
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy -p vmm --features kvm --all-targets --tests -- -D warnings |& tee ../kvm-clippy.txt
          cargo clippy -p vmm --features mshv --target x86_64-unknown-linux-gnu --all-targets --tests -- -D warnings |& tee ../mshv-clippy.txt

      - name: Prove streaming-only delta
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C cloud-hypervisor diff --name-only)" = "vmm/src/memory_manager.rs"
          grep -Fq '.map(|(vm, vmm)| vm | vmm);' cloud-hypervisor/vmm/src/memory_manager.rs
          if grep -A6 -F 'let dirty_bitmap = vm_dirty_log' cloud-hypervisor/vmm/src/memory_manager.rs | grep -Fq 'collect::<Vec<_>>()'; then
            echo 'streaming repair regressed to a collected merged bitmap' >&2
            exit 1
          fi
          git -C cloud-hypervisor diff --check
          git -C cloud-hypervisor diff --stat | tee diff-stat.txt

      - name: Retain exact repair evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-hypervisor-dirty-log-streaming-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dirty-log-streaming.diff
            focused-tests.txt
            range-control.txt
            kvm-check.txt
            mshv-check.txt
            kvm-clippy.txt
            mshv-clippy.txt
            diff-stat.txt
          if-no-files-found: warn
          retention-days: 14
