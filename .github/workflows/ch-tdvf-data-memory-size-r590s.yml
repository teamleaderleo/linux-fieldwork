name: Cloud Hypervisor TDVF raw versus memory size R590S

on:
  push:
    branches: [research/ch-tdvf-data-memory-size-r590s]
    paths:
      - .github/workflows/ch-tdvf-data-memory-size-r590s.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tdvf-data-memory-size:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CH_SHA: 1af93ac7035cda77cd87b0c18b1134ebb0928052
      FEATURES: arch/tdx,arch/kvm,hypervisor/tdx,hypervisor/kvm
      WITNESS: x86_64::tdx::data_memory_size_probe_tests::tdvf_raw_data_larger_than_memory_is_accepted_baseline
      INVARIANT: x86_64::tdx::data_memory_size_probe_tests::tdvf_raw_data_must_fit_declared_memory
      CONTROL: x86_64::tdx::data_memory_size_probe_tests::tdvf_raw_data_smaller_than_memory_is_valid
      CANDIDATE_BAD: x86_64::tdx::data_memory_size_candidate_tests::tdvf_raw_data_larger_than_memory_is_typed_error
      CANDIDATE_CONTROL: x86_64::tdx::data_memory_size_candidate_tests::tdvf_raw_data_smaller_than_memory_remains_valid

    steps:
      - name: Check out Fieldwork carrier
        uses: actions/checkout@v4
        with:
          path: fieldwork
          persist-credentials: false

      - name: Check out exact Cloud Hypervisor source
        uses: actions/checkout@v4
        with:
          repository: cloud-hypervisor/cloud-hypervisor
          ref: ${{ env.CH_SHA }}
          path: cloud-hypervisor
          persist-credentials: false

      - name: Pin source and toolchains
        id: source
        working-directory: cloud-hypervisor
        shell: bash
        run: |
          set -euxo pipefail
          rustup toolchain install 1.89.0 --profile minimal
          rustup component add --toolchain 1.89.0 clippy
          rustup toolchain install nightly --profile minimal --component rustfmt
          rustup override set 1.89.0
          rustc --version | tee ../tdvf-data-memory-rust-version.txt
          rustc +nightly --version | tee ../tdvf-data-memory-nightly-version.txt
          git rev-parse HEAD | tee ../tdvf-data-memory-source-sha.txt
          test "$(git rev-parse HEAD)" = "$CH_SHA"
          test -z "$(git status --short)"

      - name: Apply and format baseline probe
        id: probe
        working-directory: cloud-hypervisor
        shell: bash
        run: |
          set -euxo pipefail
          python3 ../fieldwork/investigations/cloud-hypervisor-tdvf-data-memory-size/apply_probe.py
          cargo +nightly fmt --all
          cargo +nightly fmt --all -- --check
          git diff --check
          git diff -- arch/src/x86_64/tdx/mod.rs > ../tdvf-data-memory-probe.diff

      - name: Build and discover baseline probes
        id: discover
        working-directory: cloud-hypervisor
        shell: bash
        run: |
          set -euxo pipefail
          cargo test --locked -p arch -p hypervisor --features "$FEATURES" --lib --no-run
          cargo test --locked -p arch -p hypervisor --features "$FEATURES" --lib -- --list | tee ../tdvf-data-memory-test-list.txt
          grep -F "$WITNESS: test" ../tdvf-data-memory-test-list.txt
          grep -F "$INVARIANT: test" ../tdvf-data-memory-test-list.txt
          grep -F "$CONTROL: test" ../tdvf-data-memory-test-list.txt

      - name: Baseline valid containment control
        id: baseline_control
        working-directory: cloud-hypervisor
        shell: bash
        run: |
          set -euxo pipefail
          cargo test --locked -p arch -p hypervisor --features "$FEATURES" --lib "$CONTROL" -- --exact --nocapture \
            2>&1 | tee ../tdvf-data-memory-baseline-control.log
          grep -F "TDVF_DATA_MEMORY_CONTROL data_size=0x2000 memory_size=0x3000" ../tdvf-data-memory-baseline-control.log

      - name: Prove baseline accepts oversized raw data and writes past declared extent
        id: baseline_witness
        working-directory: cloud-hypervisor
        shell: bash
        run: |
          set -euxo pipefail
          cargo test --locked -p arch -p hypervisor --features "$FEATURES" --lib "$WITNESS" -- --ignored --exact --nocapture \
            2>&1 | tee ../tdvf-data-memory-baseline-witness.log
          grep -F "TDVF_DATA_MEMORY_BASELINE data_size=0x2000 memory_size=0x1000" ../tdvf-data-memory-baseline-witness.log
          grep -F "TDVF_DATA_MEMORY_BASELINE copied=0x2000 byte_at_declared_end=0x5a" ../tdvf-data-memory-baseline-witness.log

      - name: Prove containment invariant loses on baseline
        id: baseline_invariant
        working-directory: cloud-hypervisor
        shell: bash
        run: |
          set +e
          cargo test --locked -p arch -p hypervisor --features "$FEATURES" --lib "$INVARIANT" -- --exact --nocapture \
            > ../tdvf-data-memory-baseline-invariant.log 2>&1
          rc=$?
          set -e
          echo "TDVF_DATA_MEMORY_BASELINE_INVARIANT_RC=$rc" | tee ../tdvf-data-memory-baseline-invariant-status.txt
          cat ../tdvf-data-memory-baseline-invariant.log
          test "$rc" -ne 0
          grep -F "TDVF RawDataSize larger than MemoryDataSize must be rejected" ../tdvf-data-memory-baseline-invariant.log

      - name: Restore exact source after baseline probe
        id: restore
        working-directory: cloud-hypervisor
        shell: bash
        run: |
          set -euxo pipefail
          git checkout -- arch/src/x86_64/tdx/mod.rs
          test -z "$(git status --short)"
          test "$(git rev-parse HEAD)" = "$CH_SHA"

      - name: Apply raw-versus-memory size candidate
        id: candidate_apply
        working-directory: cloud-hypervisor
        shell: bash
        run: |
          set -euxo pipefail
          python3 ../fieldwork/investigations/cloud-hypervisor-tdvf-data-memory-size/apply_candidate.py
          cargo +nightly fmt --all
          cargo +nightly fmt --all -- --check
          git diff --check
          git diff -- arch/src/x86_64/tdx/mod.rs > ../tdvf-data-memory-candidate-only.diff
          sha256sum ../tdvf-data-memory-candidate-only.diff | tee ../tdvf-data-memory-candidate-diff-sha256.txt
          grep -F "InvalidSectionMemorySize" arch/src/x86_64/tdx/mod.rs

      - name: Candidate focused typed matrix
        id: candidate_focused
        working-directory: cloud-hypervisor
        shell: bash
        run: |
          set -euxo pipefail
          cargo test --locked -p arch -p hypervisor --features "$FEATURES" --lib "$CANDIDATE_BAD" -- --exact --nocapture \
            2>&1 | tee ../tdvf-data-memory-candidate-bad.log
          cargo test --locked -p arch -p hypervisor --features "$FEATURES" --lib "$CANDIDATE_CONTROL" -- --exact --nocapture \
            2>&1 | tee ../tdvf-data-memory-candidate-control.log
          grep -F "TDVF_DATA_MEMORY_CANDIDATE malformed_result=Err(InvalidSectionMemorySize { data_size: 8192, memory_size: 4096 })" ../tdvf-data-memory-candidate-bad.log
          grep -F "TDVF_DATA_MEMORY_CANDIDATE control data_size=0x2000 memory_size=0x3000" ../tdvf-data-memory-candidate-control.log

      - name: Full arch and hypervisor TDX KVM tests
        id: broad
        working-directory: cloud-hypervisor
        shell: bash
        run: |
          set -euxo pipefail
          if [ -e /dev/kvm ]; then sudo chmod a+rw /dev/kvm; fi
          cargo test --locked -p arch -p hypervisor --features "$FEATURES" --lib \
            2>&1 | tee ../tdvf-data-memory-broad-tests.log

      - name: Clippy and hygiene
        id: quality
        working-directory: cloud-hypervisor
        shell: bash
        run: |
          set -euxo pipefail
          cargo clippy --locked -p arch -p hypervisor --features "$FEATURES" --all-targets -- \
            -D warnings -A unreachable-code -A unused-mut -A unused-variables \
            2>&1 | tee ../tdvf-data-memory-clippy.log
          cargo +nightly fmt --all -- --check
          git diff --check
          git status --short | tee ../tdvf-data-memory-final-status.txt
          git diff --stat | tee ../tdvf-data-memory-final-diff-stat.txt
          git diff -- arch/src/x86_64/tdx/mod.rs | tee ../tdvf-data-memory-final-diff.txt

      - name: Write receipt
        if: always()
        shell: bash
        run: |
          {
            echo "fieldwork_head=${GITHUB_SHA}"
            echo "source=$CH_SHA"
            echo "features=$FEATURES"
            echo "source_gate=${{ steps.source.outcome }}"
            echo "probe_gate=${{ steps.probe.outcome }}"
            echo "discover_gate=${{ steps.discover.outcome }}"
            echo "baseline_control=${{ steps.baseline_control.outcome }}"
            echo "baseline_witness=${{ steps.baseline_witness.outcome }}"
            echo "baseline_invariant_expected_red=${{ steps.baseline_invariant.outcome }}"
            echo "restore_exact_source=${{ steps.restore.outcome }}"
            echo "candidate_apply=${{ steps.candidate_apply.outcome }}"
            echo "candidate_focused=${{ steps.candidate_focused.outcome }}"
            echo "broad=${{ steps.broad.outcome }}"
            echo "quality=${{ steps.quality.outcome }}"
            if [ -f tdvf-data-memory-baseline-invariant-status.txt ]; then cat tdvf-data-memory-baseline-invariant-status.txt; fi
            if [ -f tdvf-data-memory-candidate-diff-sha256.txt ]; then cat tdvf-data-memory-candidate-diff-sha256.txt; fi
          } | tee tdvf-data-memory-execution-receipt.txt

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ch-tdvf-data-memory-size-r590s
          if-no-files-found: warn
          path: |
            tdvf-data-memory-*.txt
            tdvf-data-memory-*.log
            tdvf-data-memory-*.diff
