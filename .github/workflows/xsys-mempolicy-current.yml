name: x/sys mempolicy current-source matrix

on:
  push:
    branches:
      - execute/xsys-mempolicy-current
  workflow_dispatch:

permissions:
  contents: read

jobs:
  current-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends git strace

      - name: Fetch exact x/sys source and apply separate variants
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/golang/sys.git /tmp/xsys-baseline
          git -C /tmp/xsys-baseline checkout 8042137c7a09b02e01893cc556f27ee768a2f0ec
          test "$(git -C /tmp/xsys-baseline rev-parse HEAD)" = 8042137c7a09b02e01893cc556f27ee768a2f0ec
          cp -a /tmp/xsys-baseline /tmp/xsys-dynamic
          cp -a /tmp/xsys-baseline /tmp/xsys-fixed
          cp -a /tmp/xsys-baseline /tmp/xsys-both
          dynamic_patch="$GITHUB_WORKSPACE/executions/xsys-mempolicy-current/dynamic-final-bit.patch"
          fixed_patch="$GITHUB_WORKSPACE/executions/xsys-mempolicy-current/fixed-final-bit.patch"
          git -C /tmp/xsys-dynamic apply --check "$dynamic_patch"
          git -C /tmp/xsys-dynamic apply "$dynamic_patch"
          git -C /tmp/xsys-fixed apply --check "$fixed_patch"
          git -C /tmp/xsys-fixed apply "$fixed_patch"
          git -C /tmp/xsys-both apply "$dynamic_patch"
          git -C /tmp/xsys-both apply "$fixed_patch"
          for tree in baseline dynamic fixed both; do
            git -C "/tmp/xsys-$tree" diff --check
          done

      - name: Execute variants under strace
        shell: bash
        run: |
          set -euo pipefail
          : > xsys-mempolicy-matrix.txt
          probe="$GITHUB_WORKSPACE/executions/xsys-mempolicy-current"
          for tree in baseline dynamic fixed both; do
            rm -rf /tmp/probe-work
            mkdir /tmp/probe-work
            cp "$probe/probe.go" "$probe/go.mod" /tmp/probe-work/
            cd /tmp/probe-work
            go mod edit -replace=golang.org/x/sys="/tmp/xsys-$tree"
            go mod tidy
            strace -f -e trace=set_mempolicy -o "$GITHUB_WORKSPACE/$tree.strace" go run . > "$GITHUB_WORKSPACE/$tree.out"
            printf '%s\t' "$tree" >> "$GITHUB_WORKSPACE/xsys-mempolicy-matrix.txt"
            cat "$GITHUB_WORKSPACE/$tree.out" >> "$GITHUB_WORKSPACE/xsys-mempolicy-matrix.txt"
          done
          cd "$GITHUB_WORKSPACE"
          cat xsys-mempolicy-matrix.txt

      - name: Assert syscall argument domains
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, re

          expected = {
              'baseline': (8, 1024),
              'dynamic': (65, 1024),
              'fixed': (8, 1025),
              'both': (65, 1025),
          }
          for name, want in expected.items():
              text = pathlib.Path(f'{name}.strace').read_text()
              values = []
              for line in text.splitlines():
                  if 'set_mempolicy(MPOL_BIND|MPOL_F_RELATIVE_NODES' not in line:
                      continue
                  match = re.search(r',\s*([0-9]+)\)\s*=', line)
                  if match:
                      values.append(int(match.group(1)))
              if len(values) < 2:
                  raise SystemExit(f'{name}: missing wrapper syscalls: {values}')
              got = tuple(values[:2])
              print(f'{name}: dynamic={got[0]} fixed={got[1]}')
              if got != want:
                  raise SystemExit(f'{name}: got {got}, want {want}')
          PY

      - name: Preserve dynamic affinity byte-size behavior
        shell: bash
        run: |
          set -euo pipefail
          for tree in baseline dynamic fixed both; do
            (cd "/tmp/xsys-$tree" && go test ./unix -run '^TestSchedSetaffinityDynamic$' -count=1) | tee "$GITHUB_WORKSPACE/$tree-affinity.txt"
          done

      - name: Retain matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xsys-mempolicy-current-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            xsys-mempolicy-matrix.txt
            *.strace
            *.out
            *-affinity.txt
          if-no-files-found: warn
          retention-days: 14
