name: Research 478 backend-first stub prototype

on:
  push:
    branches: [research/478-backend-first-stub-prototype]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  prototype:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Fieldwork carrier
        uses: actions/checkout@v4

      - name: Check out UV comparison base
        uses: actions/checkout@v4
        with:
          repository: teamleaderleo/uv
          ref: dd0584d560a4693b5713a78be54304123ada3e77
          path: uv-src
          persist-credentials: false

      - name: Apply contestant B transform
        run: |
          python investigations/uv-stubs-backend-scope/thunderdome/backend_first_transform.py \
            uv-src/crates/uv/src/commands/project/init.rs
          git -C uv-src diff --check
          git -C uv-src diff --stat
          git -C uv-src diff -- crates/uv/src/commands/project/init.rs

      - name: Build candidate UV
        run: |
          rustup show
          cargo build --manifest-path uv-src/Cargo.toml --package uv --bin uv

      - name: Exercise generated stub projects
        shell: bash
        run: |
          set -euo pipefail
          UV="$GITHUB_WORKSPACE/uv-src/target/debug/uv"
          ROOT="$RUNNER_TEMP/uv-stub-contestant-b"
          rm -rf "$ROOT"
          mkdir -p "$ROOT"

          init_supported() {
            label="$1"
            backend="$2"
            mkdir -p "$ROOT/$label"
            if [ -n "$backend" ]; then
              (cd "$ROOT/$label" && "$UV" init --package --name foo-stubs --build-backend "$backend" --no-workspace --vcs none)
            else
              (cd "$ROOT/$label" && "$UV" init --package --name foo-stubs --no-workspace --vcs none)
            fi
            (cd "$ROOT/$label" && "$UV" build --wheel --out-dir dist)
          }

          init_supported uv ""
          init_supported hatch hatchling
          init_supported poetry poetry
          init_supported flit flit
          init_supported pdm pdm
          init_supported setuptools setuptools
          init_supported scikit scikit

          mkdir -p "$ROOT/lib-scikit"
          (cd "$ROOT/lib-scikit" && "$UV" init --lib --name foo-stubs --build-backend scikit --no-workspace --vcs none)
          (cd "$ROOT/lib-scikit" && "$UV" build --wheel --out-dir dist)

          mkdir -p "$ROOT/reject-maturin"
          set +e
          (cd "$ROOT/reject-maturin" && "$UV" init --package --name foo-stubs --build-backend maturin --no-workspace --vcs none) >"$ROOT/reject-maturin/init.log" 2>&1
          code=$?
          set -e
          cat "$ROOT/reject-maturin/init.log"
          test "$code" -ne 0
          test ! -e "$ROOT/reject-maturin/Cargo.toml"
          test ! -e "$ROOT/reject-maturin/pyproject.toml"

          for backend in scikit maturin; do
            mkdir -p "$ROOT/bare-$backend"
            (cd "$ROOT/bare-$backend" && "$UV" init --bare --name foo-stubs --build-backend "$backend" --no-workspace --vcs none)
            test -f "$ROOT/bare-$backend/pyproject.toml"
            test ! -e "$ROOT/bare-$backend/src"
          done

          mkdir -p "$ROOT/ordinary-scikit"
          (cd "$ROOT/ordinary-scikit" && "$UV" init --package --name foo --build-backend scikit --no-workspace --vcs none)
          test -f "$ROOT/ordinary-scikit/CMakeLists.txt"
          test -f "$ROOT/ordinary-scikit/src/main.cpp"
          test -f "$ROOT/ordinary-scikit/src/foo/_core.pyi"

          python - "$ROOT" <<'PY'
          import configparser
          import io
          import pathlib
          import sys
          import tomllib
          import zipfile

          root = pathlib.Path(sys.argv[1])
          supported = ["uv", "hatch", "poetry", "flit", "pdm", "setuptools", "scikit", "lib-scikit"]
          for label in supported:
              project = root / label
              pyproject_text = (project / "pyproject.toml").read_text()
              data = tomllib.loads(pyproject_text)
              if "scripts" in data.get("project", {}):
                  raise SystemExit(f"{label}: generated a runtime [project.scripts] entry")
              if not (project / "src/foo-stubs/__init__.pyi").is_file():
                  raise SystemExit(f"{label}: missing src/foo-stubs/__init__.pyi")
              if (project / "src/foo_stubs/__init__.py").exists():
                  raise SystemExit(f"{label}: generated normalized runtime package")

              wheels = list((project / "dist").glob("*.whl"))
              if len(wheels) != 1:
                  raise SystemExit(f"{label}: expected one wheel, found {len(wheels)}")
              with zipfile.ZipFile(wheels[0]) as zf:
                  names = sorted(zf.namelist())
                  if "foo-stubs/__init__.pyi" not in names:
                      raise SystemExit(f"{label}: wheel omitted foo-stubs/__init__.pyi: {names}")
                  console_scripts = []
                  for name in names:
                      if not name.endswith(".dist-info/entry_points.txt"):
                          continue
                      text = zf.read(name).decode()
                      parser = configparser.ConfigParser()
                      parser.optionxform = str
                      parser.read_file(io.StringIO(text))
                      if parser.has_section("console_scripts"):
                          console_scripts.extend(parser.options("console_scripts"))
                  if console_scripts:
                      raise SystemExit(f"{label}: unexpected console scripts {console_scripts}")
              print(f"PASS {label}: {wheels[0].name}")

          checks = {
              "hatch": '[tool.hatch.build.targets.wheel]\npackages = ["src/foo-stubs"]',
              "poetry": '[tool.poetry]\npackages = [{ include = "foo-stubs", from = "src" }]',
              "flit": 'requires = ["flit_core>=4,<5"]',
              "pdm": '[tool.pdm.build]\nincludes = ["src/foo-stubs"]',
              "setuptools": '[tool.setuptools.package-data]\n"*" = ["*.pyi"]',
              "scikit": '[tool.scikit-build]\nminimum-version = "build-system.requires"\nwheel.cmake = false\nwheel.packages = ["src/foo-stubs"]',
          }
          for label, snippet in checks.items():
              text = (root / label / "pyproject.toml").read_text()
              if snippet not in text:
                  raise SystemExit(f"{label}: missing expected backend adapter: {snippet}")
          PY
