name: LF-07 maintainer-script interruption probe

on:
  pull_request:
    paths:
      - "programmes/debian-packages/lanes/LF-07-maintainer-script-interruption-idempotency/**"
      - "tests/test_lf07_probe_safety.py"
      - ".github/workflows/lf-07-maintainer-script.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  interruption-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out proposed repository state
        uses: actions/checkout@v4

      - name: Run the asserted dpkg interruption matrix
        shell: bash
        run: |
          set -euo pipefail
          runner="programmes/debian-packages/lanes/LF-07-maintainer-script-interruption-idempotency/scouts/LF-SCOUT-DEB-01/artifacts/run-probe.sh"
          docker run --privileged --rm \
            --volume "$PWD:/work" \
            --workdir /work \
            debian:sid-slim \
            bash -lc '
              set -euo pipefail
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends \
                busybox coreutils diffutils dpkg-dev findutils gawk libc-bin
              apt-get clean
              sh "'"$runner"'" /tmp/lf07-ci-run
            '

      - name: Upload retained LF-07 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lf-07-interruption-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: programmes/debian-packages/lanes/LF-07-maintainer-script-interruption-idempotency/scouts/LF-SCOUT-DEB-01/artifacts/results/
          if-no-files-found: warn
          retention-days: 14
