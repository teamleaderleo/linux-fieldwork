name: PR 48 path rewrite diagnostic

on:
  pull_request:
    paths:
      - 'tests/test_tarfilter_path_rewrite_metadata.py'
      - 'investigations/tarfilter-path-rewrite-metadata/**'
      - '.github/workflows/pr-48-path-rewrite-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  focused-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Run focused regression verbosely
        id: focused
        continue-on-error: true
        run: |
          set -o pipefail
          python3 -m unittest -v tests.test_tarfilter_path_rewrite_metadata 2>&1 | tee pr-48-test.log
      - name: Probe hard-link normalization boundaries
        id: boundary
        continue-on-error: true
        run: |
          set -o pipefail
          python3 investigations/tarfilter-path-rewrite-metadata/review_boundary_probe.py 2>&1 | tee pr-48-boundary.log
      - name: Record environment
        if: always()
        run: |
          {
            python3 --version
            tar --version | head -n 1
          } | tee pr-48-environment.log
      - name: Post focused result to this diagnostic PR
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo 'Focused PR #48 diagnostic result:'
            echo
            echo '```text'
            cat pr-48-test.log
            echo '--- boundary probe ---'
            cat pr-48-boundary.log
            echo '--- environment ---'
            cat pr-48-environment.log
            echo '```'
          } > diagnostic-comment.md
          gh pr comment "$PR_NUMBER" --body-file diagnostic-comment.md
      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-48-path-rewrite-diagnostic
          path: |
            pr-48-test.log
            pr-48-boundary.log
            pr-48-environment.log
      - name: Preserve focused test status
        if: steps.focused.outcome != 'success' || steps.boundary.outcome != 'success'
        run: exit 1
