name: Deep review mmdebstrap TMPDIR handling

on:
  push:
    branches:
      - review/mmdebstrap-impact-and-suite
    paths:
      - "upstream/mmdebstrap/**"
      - "investigations/mmdebstrap-unwritable-tmpdir/**"
      - ".github/workflows/mmdebstrap-deep-review.yml"
  pull_request:
    paths:
      - "upstream/mmdebstrap/**"
      - "investigations/mmdebstrap-unwritable-tmpdir/**"
      - ".github/workflows/mmdebstrap-deep-review.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out Linux Fieldwork
        uses: actions/checkout@v4

      - name: Install runtime and review dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libdistro-info-perl \
            libdpkg-perl \
            libperl-critic-perl \
            perltidy \
            shellcheck \
            shfmt \
            uidmap

      - name: Run expanded behavior and style review
        run: bash investigations/mmdebstrap-unwritable-tmpdir/deep_review.sh

      - name: Upload retained review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mmdebstrap-deep-review
          path: investigations/mmdebstrap-unwritable-tmpdir/results/
          if-no-files-found: error
