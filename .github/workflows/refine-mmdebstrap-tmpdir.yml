name: Refine mmdebstrap TMPDIR implementation

on:
  pull_request:
    paths:
      - "upstream/mmdebstrap/mmdebstrap"
      - ".github/workflows/refine-mmdebstrap-tmpdir.yml"

permissions:
  contents: write

jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out review branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Replace preflight probe with direct File::Temp contract
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path("upstream/mmdebstrap/mmdebstrap")
          source = source_path.read_text(encoding="utf-8")

          old_helper = '''sub check_tmpdir {
              return
                if !exists $ENV{TMPDIR}
                || !defined $ENV{TMPDIR}
                || $ENV{TMPDIR} eq '';

              my $tmpdir = $ENV{TMPDIR};
              if (!-d $tmpdir) {
                  error "TMPDIR \\"$tmpdir\\" is not a directory";
              }

              my ($fh, $filename);
              my $success = eval {
                  ($fh, $filename) = tempfile(
                      "mmdebstrap.tmpdir-check.XXXXXXXXXXXX",
                      DIR    => $tmpdir,
                      UNLINK => 0
                  );
                  1;
              };
              if (!$success) {
                  chomp(my $msg = $@ || "$!");
                  error "cannot use TMPDIR \\"$tmpdir\\": $msg";
              }

              close $fh
                or error "cannot close temporary file in TMPDIR \\"$tmpdir\\": $!";
              unlink $filename
                or error "cannot remove temporary file in TMPDIR \\"$tmpdir\\": $!";
              return;
          }

          '''
          if source.count(old_helper) != 1:
              raise SystemExit("expected exactly one check_tmpdir helper")
          source = source.replace(old_helper, "", 1)

          old_call = '''    check_tmpdir();

          '''
          if source.count(old_call) != 1:
              raise SystemExit("expected exactly one check_tmpdir call")
          source = source.replace(old_call, "", 1)

          old_tempdir = '''        $options->{root} = tempdir('mmdebstrap.XXXXXXXXXX', TMPDIR => 1);
          '''
          new_tempdir = '''        my @tempdir_options = (TMPDIR => 1);
          if (defined $ENV{TMPDIR} && $ENV{TMPDIR} ne '') {
              @tempdir_options = (DIR => $ENV{TMPDIR});
          }
          $options->{root}
            = tempdir('mmdebstrap.XXXXXXXXXX', @tempdir_options);
          '''
          if source.count(old_tempdir) != 1:
              raise SystemExit("expected exactly one rootfs tempdir call")
          source = source.replace(old_tempdir, new_tempdir, 1)

          source_path.write_text(source, encoding="utf-8")
          PY

          rm -f patches/mmdebstrap-explicit-tmpdir.patch
          rm -f .github/workflows/apply-mmdebstrap-tmpdir-fix.yml
          rm -f .github/workflows/refine-mmdebstrap-tmpdir.yml

          perl -c upstream/mmdebstrap/mmdebstrap

      - name: Commit reviewed implementation
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Use explicit TMPDIR at the real tempdir call"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
