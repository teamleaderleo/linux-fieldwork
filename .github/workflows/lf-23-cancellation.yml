name: LF-23 cancellation probe

on:
  pull_request:
    paths:
      - "programmes/services-resources/lanes/LF-23-cancellation-subprocess-fd-cleanup/**"
      - "upstream/mmdebstrap/mmdebstrap"
      - ".github/workflows/lf-23-cancellation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cancellation-probe:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'scout/lf-scout-proc-01/') || github.head_ref == 'fix/run-progress-signal-main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out proposed repository state
        uses: actions/checkout@v4

      - name: Run the deterministic cancellation and repair matrices
        shell: bash
        run: |
          set -euo pipefail
          probe="programmes/services-resources/lanes/LF-23-cancellation-subprocess-fd-cleanup/scouts/LF-SCOUT-PROC-01/artifacts/cancellation_harness.py"
          repair_probe="programmes/services-resources/lanes/LF-23-cancellation-subprocess-fd-cleanup/scouts/LF-SCOUT-PROC-01/artifacts/run_progress_repair_probe.py"
          docker run --privileged --rm \
            --volume "$PWD:/work" \
            --workdir /work \
            debian:sid-slim \
            bash -lc '
              set -euo pipefail
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends \
                iproute2 patch perl procps python3 tar util-linux
              apt-get clean
              python3 "'"$probe"'"
              python3 "'"$repair_probe"'"
            '

      - name: Upload cancellation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lf-23-cancellation-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            programmes/services-resources/lanes/LF-23-cancellation-subprocess-fd-cleanup/scouts/LF-SCOUT-PROC-01/artifacts/ci-run/
            programmes/services-resources/lanes/LF-23-cancellation-subprocess-fd-cleanup/scouts/LF-SCOUT-PROC-01/artifacts/ci-run-repair/
          if-no-files-found: warn
          retention-days: 14
