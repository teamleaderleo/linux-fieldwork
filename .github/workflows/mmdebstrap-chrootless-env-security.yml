name: Verify mmdebstrap chrootless environment security

on:
  pull_request:
    paths:
      - 'upstream/mmdebstrap/mmdebstrap'
      - 'investigations/mmdebstrap-chrootless-env/**'
      - '.github/workflows/mmdebstrap-chrootless-env-security.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out proposed repository state
        uses: actions/checkout@v4

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            apt-utils \
            fakeroot \
            libdistro-info-perl \
            libdpkg-perl \
            uidmap

      - name: Check syntax
        run: |
          perl -c upstream/mmdebstrap/mmdebstrap
          pod2man upstream/mmdebstrap/mmdebstrap >/dev/null
          python3 -m py_compile \
            investigations/mmdebstrap-chrootless-env/prepare_authority_candidates.py
          bash -n investigations/mmdebstrap-chrootless-env/run.sh
          bash -n \
            investigations/mmdebstrap-chrootless-env/direct_authority_transaction.sh

      - name: Check current Debian sid formatting
        run: |
          docker run --rm \
            --volume "$PWD:/work" \
            --workdir /work/upstream/mmdebstrap \
            debian:sid-slim \
            sh -euxc '
              apt-get update
              apt-get install --yes --no-install-recommends perltidy
              perltidy < mmdebstrap > /tmp/mmdebstrap.tdy
              cmp mmdebstrap /tmp/mmdebstrap.tdy
            '

      - name: Run security regression
        run: bash investigations/mmdebstrap-chrootless-env/run.sh

      - name: Run direct authority transaction
        run: |
          bash \
            investigations/mmdebstrap-chrootless-env/direct_authority_transaction.sh

      - name: Upload retained evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mmdebstrap-chrootless-env-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            investigations/mmdebstrap-chrootless-env/results/
            investigations/mmdebstrap-chrootless-env/direct-authority-results/
          if-no-files-found: warn
          retention-days: 14
