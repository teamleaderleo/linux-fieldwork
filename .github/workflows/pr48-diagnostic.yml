name: PR48 diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  focused-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fetch branch quietly
        shell: bash
        run: |
          git clone -q --depth 1 \
            --branch fix/tarfilter-path-rewrite-metadata \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" repo
      - name: Run focused regression
        working-directory: repo
        run: python3 tests/test_tarfilter_path_rewrite_metadata.py -v
