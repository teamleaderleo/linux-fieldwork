name: Research carrier static gates

on:
  push:
    branches:
      - research/foundational-systems-deep-dive-2026-08-03
    paths:
      - .github/workflows/research-carrier-static.yml
      - investigations/systemd-vmspawn-unmapped-bind-userns/**
      - investigations/buildkit-unused-context-lazy-load/**
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/research-carrier-static.yml
      - investigations/systemd-vmspawn-unmapped-bind-userns/**
      - investigations/buildkit-unused-context-lazy-load/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  systemd-vmspawn-test-static:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out exact systemd test carrier
        uses: actions/checkout@v4
        with:
          repository: teamleaderleo/systemd
          ref: 741db5faed175180d427526b3878d5527d838b2d
          fetch-depth: 0
          persist-credentials: false
          path: systemd

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck

      - name: Validate exact diff and shell test
        working-directory: systemd
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = 741db5faed175180d427526b3878d5527d838b2d
          git merge-base --is-ancestor 1652be7df88d358c1e215c7de5431505348e5ab3 HEAD
          git diff --check 1652be7df88d358c1e215c7de5431505348e5ab3 HEAD
          bash -n test/units/TEST-87-AUX-UTILS-VM.vmspawn-user-bind.sh
          shellcheck \
            -x \
            -P test/units \
            test/units/TEST-87-AUX-UTILS-VM.vmspawn-user-bind.sh
          test -z "$(git status --porcelain)"

  buildkit-context-test-compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out Linux Fieldwork candidate
        uses: actions/checkout@v4
        with:
          path: fieldwork

      - name: Check out exact BuildKit test carrier
        uses: actions/checkout@v4
        with:
          repository: teamleaderleo/buildkit
          ref: 4024335d0e905d1206786644d8f363336d4678ec
          fetch-depth: 0
          persist-credentials: false
          path: buildkit

      - name: Set up repository Go version
        uses: actions/setup-go@v5
        with:
          go-version-file: buildkit/go.mod
          cache: false

      - name: Validate exact test carrier and candidate source patch
        working-directory: buildkit
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = 4024335d0e905d1206786644d8f363336d4678ec
          git merge-base --is-ancestor 275d6864ff0ce91a06225af5f5b012887bd257cf HEAD
          git diff --check 275d6864ff0ce91a06225af5f5b012887bd257cf HEAD

          test_file=frontend/dockerfile/dockerfile_context_access_test.go
          candidate_patch=../fieldwork/investigations/buildkit-unused-context-lazy-load/candidate-lazy-main-context.patch

          gofmt -d "$test_file" | tee /tmp/test-gofmt.diff
          test ! -s /tmp/test-gofmt.diff
          go test -mod=vendor ./frontend/dockerfile -run '^$'

          git apply --check "$candidate_patch"
          git apply "$candidate_patch"
          git diff --check

          gofmt -d frontend/dockerfile/dockerfile2llb/convert.go | tee /tmp/candidate-gofmt.diff
          test ! -s /tmp/candidate-gofmt.diff
          go test -mod=vendor ./frontend/dockerfile -run '^$'

          git reset --hard HEAD
          test -z "$(git status --porcelain)"
