name: glibc cache numeric alias

on:
  pull_request:
    paths:
      - "investigations/glibc-ld-cache-numeric-alias/**"
      - ".github/workflows/glibc-cache-numeric-alias.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  noble-x86-64:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out proposed repository state
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Execute isolated cache lookup fixture
        shell: bash
        run: |
          set -euo pipefail
          output="investigations/glibc-ld-cache-numeric-alias/runs/$RUN_ID"
          bash investigations/glibc-ld-cache-numeric-alias/probe.sh "$output"

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: glibc-cache-numeric-alias-${{ env.RUN_ID }}
          path: investigations/glibc-ld-cache-numeric-alias/runs/${{ env.RUN_ID }}/
          if-no-files-found: error
          retention-days: 14

  current-glibc-x86-64:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out proposed repository state
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Build exact current glibc and execute isolated fixture
        shell: bash
        run: |
          set -euo pipefail
          output="investigations/glibc-ld-cache-numeric-alias/runs/$RUN_ID-current"
          bash investigations/glibc-ld-cache-numeric-alias/probe-current.sh "$output"
          grep -Fqx $'classification\talias_identity_reproduced' "$output/summary-current.tsv"

      - name: Upload current-glibc result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: glibc-cache-numeric-alias-current-${{ env.RUN_ID }}
          path: investigations/glibc-ld-cache-numeric-alias/runs/${{ env.RUN_ID }}-current/
          if-no-files-found: error
          retention-days: 14

  current-glibc-exact-key-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out proposed repository state
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Build exact-key candidate and execute isolated fixture
        shell: bash
        run: |
          set -euo pipefail
          output="investigations/glibc-ld-cache-numeric-alias/runs/$RUN_ID-candidate"
          bash investigations/glibc-ld-cache-numeric-alias/probe-current.sh \
            "$output" \
            investigations/glibc-ld-cache-numeric-alias/exact-key-candidate.patch
          grep -Fqx $'classification\texact_identity_preserved' "$output/summary-current.tsv"

      - name: Upload exact-key candidate result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: glibc-cache-numeric-alias-candidate-${{ env.RUN_ID }}
          path: investigations/glibc-ld-cache-numeric-alias/runs/${{ env.RUN_ID }}-candidate/
          if-no-files-found: error
          retention-days: 14

  current-glibc-candidate-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out proposed repository state
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Build candidate and run existing cache tests
        shell: bash
        run: |
          set -euo pipefail
          output="investigations/glibc-ld-cache-numeric-alias/runs/$RUN_ID-regressions"
          bash investigations/glibc-ld-cache-numeric-alias/probe-candidate-regressions.sh \
            "$output" \
            investigations/glibc-ld-cache-numeric-alias/exact-key-candidate.patch
          grep -Fqx $'classification\tcandidate_regressions_passed' "$output/summary.tsv"

      - name: Upload candidate regression result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: glibc-cache-numeric-alias-regressions-${{ env.RUN_ID }}
          path: investigations/glibc-ld-cache-numeric-alias/runs/${{ env.RUN_ID }}-regressions/
          if-no-files-found: error
          retention-days: 14

  current-glibc-native-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out proposed repository state
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Prove glibc-native regression fails before and passes after candidate
        shell: bash
        run: |
          set -euo pipefail
          output="investigations/glibc-ld-cache-numeric-alias/runs/$RUN_ID-native"
          bash investigations/glibc-ld-cache-numeric-alias/probe-native-regression.sh \
            "$output" \
            investigations/glibc-ld-cache-numeric-alias/glibc-native-regression.patch \
            investigations/glibc-ld-cache-numeric-alias/exact-key-candidate.patch
          grep -Fqx $'classification\tnative_regression_distinguishes_candidate' \
            "$output/summary.tsv"

      - name: Upload native regression result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: glibc-cache-numeric-alias-native-${{ env.RUN_ID }}
          path: investigations/glibc-ld-cache-numeric-alias/runs/${{ env.RUN_ID }}-native/
          if-no-files-found: error
          retention-days: 14
