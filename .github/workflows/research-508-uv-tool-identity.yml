name: research-508-uv-tool-identity

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/research-508-uv-tool-identity.yml'

permissions:
  contents: read

jobs:
  identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Check out pinned uv current main
        uses: actions/checkout@v4
        with:
          repository: astral-sh/uv
          ref: 1881d30773386da77017f2ad5ceaf160535d65da
          path: uv-main
          persist-credentials: false

      - name: Prepare released and current uv
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/uv-release"
          curl -LsSf https://github.com/astral-sh/uv/releases/download/0.12.3/uv-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C "$RUNNER_TEMP/uv-release" --strip-components=1
          "$RUNNER_TEMP/uv-release/uv" --version
          export CARGO_TARGET_DIR="$RUNNER_TEMP/uv-current-target"
          cargo build --manifest-path uv-main/Cargo.toml --package uv --bin uv
          cp "$CARGO_TARGET_DIR/debug/uv" "$RUNNER_TEMP/uv-current"
          git -C uv-main rev-parse HEAD
          "$RUNNER_TEMP/uv-current" --version

      - name: Execute deterministic installed-tool identity matrix
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/tool-identity-508"
          rm -rf "$ROOT"
          mkdir -p "$ROOT/wheels"

          python - "$ROOT/wheels" <<'PY'
          import base64, csv, hashlib, io, pathlib, sys, zipfile
          target = pathlib.Path(sys.argv[1])
          files = {
              "probe_tool/__init__.py": b"",
              "probe_tool/__main__.py": b"",
              "probe_tool/tool.py": b"import sys\ndef main():\n    print('VERSION=1.0.0')\n    print('PREFIX=' + sys.prefix)\n",
              "probe_tool-1.0.0.dist-info/METADATA": b"Metadata-Version: 2.1\nName: probe-tool\nVersion: 1.0.0\n",
              "probe_tool-1.0.0.dist-info/WHEEL": b"Wheel-Version: 1.0\nGenerator: fieldwork-508\nRoot-Is-Purelib: true\nTag: py3-none-any\n",
              "probe_tool-1.0.0.dist-info/entry_points.txt": b"[console_scripts]\nprobe-tool = probe_tool.tool:main\n",
          }
          rows=[]
          for name,data in files.items():
              digest=base64.urlsafe_b64encode(hashlib.sha256(data).digest()).rstrip(b"=").decode()
              rows.append([name,f"sha256={digest}",str(len(data))])
          rows.append(["probe_tool-1.0.0.dist-info/RECORD","",""])
          sio=io.StringIO(); csv.writer(sio,lineterminator="\n").writerows(rows)
          files["probe_tool-1.0.0.dist-info/RECORD"]=sio.getvalue().encode()
          wheel=target/"probe_tool-1.0.0-py3-none-any.whl"
          with zipfile.ZipFile(wheel,"w",zipfile.ZIP_DEFLATED) as zf:
              for name,data in files.items(): zf.writestr(name,data)
          print(wheel.resolve())
          PY

          run_matrix() {
            label="$1"
            UV="$2"
            CASE="$ROOT/$label"
            mkdir -p "$CASE/bin" "$CASE/tools" "$CASE/cache"
            export UV_TOOL_BIN_DIR="$CASE/bin"
            export UV_TOOL_DIR="$CASE/tools"
            export UV_CACHE_DIR="$CASE/cache"
            FIND="$ROOT/wheels"
            DATE='2099-01-01T00:00:00Z'

            echo "=== INSTALL $label ==="
            "$UV" tool install --no-index --find-links "$FIND" --exclude-newer "$DATE" probe-tool
            test -x "$CASE/bin/probe-tool"
            direct=$($CASE/bin/probe-tool)
            echo "$direct"
            installed_prefix=$(printf '%s\n' "$direct" | sed -n 's/^PREFIX=//p')
            test -n "$installed_prefix"

            invoke() {
              name="$1"; shift
              echo "=== $label $name ==="
              set +e
              output=$("$@" 2>&1)
              code=$?
              set -e
              echo "$output"
              printf '%s\t%s\t%s\t%s\n' "$label" "$name" "$code" "$(printf '%s\n' "$output" | sed -n 's/^PREFIX=//p' | tail -1)" >> "$ROOT/results.tsv"
            }

            invoke tool-run-matching "$UV" tool run --no-index --find-links "$FIND" --exclude-newer "$DATE" probe-tool
            invoke tool-run-missing-exclude "$UV" tool run --no-index --find-links "$FIND" probe-tool
            invoke tool-run-isolated "$UV" tool run --isolated --no-index --find-links "$FIND" --exclude-newer "$DATE" probe-tool
            invoke tool-run-version "$UV" tool run --no-index --find-links "$FIND" --exclude-newer "$DATE" probe-tool@1.0.0

            if [ -x "$(dirname "$UV")/uvx" ]; then
              invoke uvx-alias-matching "$(dirname "$UV")/uvx" --no-index --find-links "$FIND" --exclude-newer "$DATE" probe-tool
              invoke uvx-alias-missing-exclude "$(dirname "$UV")/uvx" --no-index --find-links "$FIND" probe-tool
            fi

            printf '%s\tinstalled\t0\t%s\n' "$label" "$installed_prefix" >> "$ROOT/results.tsv"
          }

          printf 'version\tcase\texit\tprefix\n' > "$ROOT/results.tsv"
          run_matrix release-0.12.3 "$RUNNER_TEMP/uv-release/uv"
          run_matrix current "$RUNNER_TEMP/uv-current"

          echo '=== RESULTS ==='
          cat "$ROOT/results.tsv"

          python - "$ROOT/results.tsv" <<'PY'
          import csv,sys
          rows=list(csv.DictReader(open(sys.argv[1]),delimiter='\t'))
          for version in ['release-0.12.3','current']:
              by={r['case']:r for r in rows if r['version']==version}
              installed=by['installed']['prefix']
              assert by['tool-run-matching']['exit']=='0', by
              assert by['tool-run-matching']['prefix']==installed, (version,'matching did not reuse installed env',by)
              assert by['tool-run-missing-exclude']['exit']=='0', by
              assert by['tool-run-missing-exclude']['prefix']!=installed, (version,'option mismatch unexpectedly reused installed env',by)
              assert by['tool-run-isolated']['exit']=='0', by
              assert by['tool-run-isolated']['prefix']!=installed, (version,'isolated unexpectedly reused installed env',by)
              assert by['tool-run-version']['exit']=='0', by
              if 'uvx-alias-matching' in by:
                  assert by['uvx-alias-matching']['prefix']==installed, (version,'uvx matching did not reuse installed env',by)
                  assert by['uvx-alias-missing-exclude']['prefix']!=installed, (version,'uvx mismatch unexpectedly reused installed env',by)
              print(f"PASS {version}: receipt-option equality controls installed-environment reuse; explicit-version result recorded")
          PY

          cp "$ROOT/results.tsv" "$GITHUB_WORKSPACE/results-508.tsv"

      - name: Upload tool identity receipt
        uses: actions/upload-artifact@v4
        with:
          name: uv-tool-identity-508
          path: results-508.tsv
          if-no-files-found: error
