name: Probe LF-02 privileged host integrations

on:
  pull_request:
    paths:
      - "investigations/lf-02-privileged-host-integrations/**"
      - "programmes/rootless-execution/lanes/LF-02-chrootless-dpkg-root-containment/**"
      - "upstream/mmdebstrap/**"
      - "tests/test_lf02_privileged_summary.py"
      - ".github/workflows/lf-02-privileged-host-integrations.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  privileged-host-integrations:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out investigation branch
        uses: actions/checkout@v4

      - name: Install probe dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libdistro-info-perl \
            libdpkg-perl \
            strace

      - name: Check probe syntax and summary classifier
        run: |
          perl -c upstream/mmdebstrap/mmdebstrap
          bash -n investigations/lf-02-privileged-host-integrations/run.sh
          bash -n investigations/lf-02-privileged-host-integrations/run-env-canary.sh
          python3 -m py_compile investigations/lf-02-privileged-host-integrations/summarize_results.py
          python3 -m unittest tests/test_lf02_privileged_summary.py
          for script in \
            programmes/rootless-execution/lanes/LF-02-chrootless-dpkg-root-containment/scouts/LF-SCOUT-ROOT-01/artifacts/fixture/DEBIAN/preinst \
            programmes/rootless-execution/lanes/LF-02-chrootless-dpkg-root-containment/scouts/LF-SCOUT-ROOT-01/artifacts/fixture/DEBIAN/postinst \
            programmes/rootless-execution/lanes/LF-02-chrootless-dpkg-root-containment/scouts/LF-SCOUT-ROOT-01/artifacts/fixture/DEBIAN/prerm \
            programmes/rootless-execution/lanes/LF-02-chrootless-dpkg-root-containment/scouts/LF-SCOUT-ROOT-01/artifacts/fixture/DEBIAN/postrm; do
            sh -n "$script"
          done

      - name: Run privileged host integration matrix
        run: sudo -E bash investigations/lf-02-privileged-host-integrations/run.sh

      - name: Run environment and agent-socket canary
        run: bash investigations/lf-02-privileged-host-integrations/run-env-canary.sh

      - name: Upload traces and summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lf-02-privileged-host-integrations-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            investigations/lf-02-privileged-host-integrations/results/
            investigations/lf-02-privileged-host-integrations/env-results/
          if-no-files-found: warn
          retention-days: 14

  compact-classifier-evidence:
    needs: privileged-host-integrations
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download retained matrix and assert corrected contracts
        shell: bash
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "lf-02-privileged-host-integrations-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --dir evidence >/dev/null
          summary=$(find evidence -path '*/results/summary.json' -print -quit)
          test -n "$summary"
          python3 - "$summary" <<'PY'
          import json
          import pathlib
          import sys

          summary_path = pathlib.Path(sys.argv[1])
          summary = json.loads(summary_path.read_text())
          expected = {
              "default-root": "inhibitor-fd-received",
              "no-inhibit-root": "not-observed",
              "isolated-root": "not-observed",
          }
          print(f"schema_version={summary['schema_version']}")
          for label, result in expected.items():
              case = summary["cases"][label]
              print(
                  f"{label}: logind_result={case['logind_result']} "
                  f"access_denied={str(case['logind_access_denied']).lower()} "
                  f"inhibitor_fd_received={str(case['inhibitor_fd_received']).lower()}"
              )
              assert case["logind_result"] == result
              assert case["logind_access_denied"] is False
          assert summary["findings"]["default_inhibitor_fd_received"] is True
          assert summary["findings"]["inhibit_controls_have_no_logind_call"] is True

          comparison = summary["target_state_comparison"]
          print(
              "target_state: "
              f"script_equal={str(comparison['maintainer_script_log_equal']).lower()} "
              f"alternatives_equal={str(comparison['alternatives_database_equal']).lower()} "
              f"tree_equal={str(comparison['full_tree_manifest_equal']).lower()}"
          )
          assert summary["target_script_state_equal"] is comparison["maintainer_script_log_equal"]
          assert summary["target_alternatives_state_equal"] is comparison["alternatives_database_equal"]
          assert summary["target_tree_state_equal"] is comparison["full_tree_manifest_equal"]
          for name, pair in comparison["tree_pairwise"].items():
              print(
                  f"{name}: equal={str(pair['equal']).lower()} "
                  f"difference_lines={pair['difference_lines']} "
                  f"diff_artifact={pair['diff_artifact']}"
              )
              assert (pair["difference_lines"] == 0) is pair["equal"]
              assert (summary_path.parent / pair["diff_artifact"]).is_file()
          PY

  tree-diff-evidence:
    needs: privileged-host-integrations
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Print retained target tree differences
        shell: bash
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "lf-02-privileged-host-integrations-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --dir evidence >/dev/null
          find evidence -name '*-tree.diff' -type f -print -exec cat {} \;
