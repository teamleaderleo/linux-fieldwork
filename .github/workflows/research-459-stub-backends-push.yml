name: Research 459 stub backend matrix push

on:
  push:
    branches: [research/459-stub-backend-runtime]

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install exact UV release
        run: |
          python -m pip install 'uv==0.12.3'
          uv --version
      - name: Execute wheel-content matrix
        shell: bash
        run: |
          set -uox pipefail
          ROOT="$RUNNER_TEMP/stub-matrix"
          rm -rf "$ROOT"
          mkdir -p "$ROOT"

          version() {
            req="$1"; dist="$2"
            uv run --no-project --with "$req" python - "$dist" <<'PY'
          import importlib.metadata, sys
          print(f"RESOLVED {sys.argv[1]}={importlib.metadata.version(sys.argv[1])}")
          PY
          }

          make_base() {
            label="$1"
            mkdir -p "$ROOT/$label/src/foo-stubs"
            printf '%s\n' 'def answer() -> int: ...' > "$ROOT/$label/src/foo-stubs/__init__.pyi"
          }

          inspect_if_wheel() {
            label="$1"
            wheel=$(find "$ROOT/$label/dist" -maxdepth 1 -name '*.whl' -print -quit 2>/dev/null || true)
            if [ -z "$wheel" ]; then
              echo "WHEEL $label NONE"
              echo "HAS_STUB $label false"
              return
            fi
            python - "$label" "$wheel" <<'PY'
          import sys, zipfile
          label, wheel = sys.argv[1:]
          with zipfile.ZipFile(wheel) as zf:
              names = sorted(zf.namelist())
          print(f"WHEEL {label} {wheel}")
          for name in names:
              print(f"  {name}")
          print(f"HAS_STUB {label} {'foo-stubs/__init__.pyi' in names}")
          PY
          }

          build_and_inspect() {
            label="$1"
            (cd "$ROOT/$label" && uv build --wheel --out-dir dist -v) >"$ROOT/$label/build.log" 2>&1
            code=$?
            echo "BUILD_EXIT $label $code"
            cat "$ROOT/$label/build.log"
            inspect_if_wheel "$label"
          }

          version 'pdm-backend' 'pdm-backend'
          version 'setuptools>=61' 'setuptools'
          version 'scikit-build-core>=0.12' 'scikit-build-core'
          version 'maturin>=1.0,<2.0' 'maturin'

          make_base pdm
          cat > "$ROOT/pdm/pyproject.toml" <<'TOML'
          [project]
          name = "foo-stubs"
          version = "0.1.0"
          requires-python = ">=3.9"
          [build-system]
          requires = ["pdm-backend"]
          build-backend = "pdm.backend"
          TOML
          build_and_inspect pdm

          make_base setuptools-current
          cat > "$ROOT/setuptools-current/pyproject.toml" <<'TOML'
          [project]
          name = "foo-stubs"
          version = "0.1.0"
          requires-python = ">=3.9"
          [build-system]
          requires = ["setuptools>=61"]
          build-backend = "setuptools.build_meta"
          TOML
          build_and_inspect setuptools-current

          make_base setuptools-68
          cat > "$ROOT/setuptools-68/pyproject.toml" <<'TOML'
          [project]
          name = "foo-stubs"
          version = "0.1.0"
          requires-python = ">=3.9"
          [build-system]
          requires = ["setuptools==68.2.2"]
          build-backend = "setuptools.build_meta"
          TOML
          build_and_inspect setuptools-68

          make_base setuptools-68-config
          cat > "$ROOT/setuptools-68-config/pyproject.toml" <<'TOML'
          [project]
          name = "foo-stubs"
          version = "0.1.0"
          requires-python = ">=3.9"
          [tool.setuptools.package-data]
          "*" = ["*.pyi"]
          [build-system]
          requires = ["setuptools==68.2.2"]
          build-backend = "setuptools.build_meta"
          TOML
          build_and_inspect setuptools-68-config

          make_base setuptools-69
          cat > "$ROOT/setuptools-69/pyproject.toml" <<'TOML'
          [project]
          name = "foo-stubs"
          version = "0.1.0"
          requires-python = ">=3.9"
          [build-system]
          requires = ["setuptools==69.0.0"]
          build-backend = "setuptools.build_meta"
          TOML
          build_and_inspect setuptools-69

          make_base scikit-explicit
          cat > "$ROOT/scikit-explicit/pyproject.toml" <<'TOML'
          [project]
          name = "foo-stubs"
          version = "0.1.0"
          requires-python = ">=3.9"
          [tool.scikit-build]
          minimum-version = "build-system.requires"
          wheel.cmake = false
          wheel.packages = ["src/foo-stubs"]
          [build-system]
          requires = ["scikit-build-core>=0.12", "pybind11>=3"]
          build-backend = "scikit_build_core.build"
          TOML
          build_and_inspect scikit-explicit

          make_base scikit-auto
          cat > "$ROOT/scikit-auto/pyproject.toml" <<'TOML'
          [project]
          name = "foo-stubs"
          version = "0.1.0"
          requires-python = ">=3.9"
          [tool.scikit-build]
          minimum-version = "build-system.requires"
          wheel.cmake = false
          [build-system]
          requires = ["scikit-build-core>=0.12", "pybind11>=3"]
          build-backend = "scikit_build_core.build"
          TOML
          build_and_inspect scikit-auto

          make_base scikit-uv-contract
          cat > "$ROOT/scikit-uv-contract/pyproject.toml" <<'TOML'
          [project]
          name = "foo-stubs"
          version = "0.1.0"
          requires-python = ">=3.9"
          [tool.scikit-build]
          minimum-version = "build-system.requires"
          [tool.uv]
          cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.{h,c,hpp,cpp}" }, { file = "CMakeLists.txt" }]
          [build-system]
          requires = ["scikit-build-core>=0.12", "pybind11>=3"]
          build-backend = "scikit_build_core.build"
          TOML
          build_and_inspect scikit-uv-contract

          make_base maturin-uv-contract
          cat > "$ROOT/maturin-uv-contract/pyproject.toml" <<'TOML'
          [project]
          name = "foo-stubs"
          version = "0.1.0"
          requires-python = ">=3.9"
          [build-system]
          requires = ["maturin>=1.0,<2.0"]
          build-backend = "maturin"
          TOML
          build_and_inspect maturin-uv-contract

          echo '=== SUMMARY ==='
          grep -hE '^(RESOLVED|BUILD_EXIT|HAS_STUB|WHEEL )' "$ROOT"/*/build.log 2>/dev/null || true
