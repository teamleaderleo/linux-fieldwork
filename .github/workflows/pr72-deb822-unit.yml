name: PR72 retained failure diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/pr72-deb822-unit.yml'

permissions:
  actions: read
  contents: read

jobs:
  artifact-failure:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download exact failed reproduction artifact
        shell: bash
        run: |
          set -euo pipefail
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/8762098688/zip" > /tmp/a.zip

      - name: Print first terminal case and exact failure context
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          import zipfile

          with zipfile.ZipFile('/tmp/a.zip') as archive:
              names = set(archive.namelist())
              for name in ('exit-status', 'result.md', 'autopkgtest-output/summary'):
                  if name in names:
                      print(f'===== {name} =====')
                      print(archive.read(name).decode('utf-8', 'replace'))

              stderr = archive.read('autopkgtest-output/testsuite-stderr').decode('utf-8', 'replace').splitlines()
              stdout = archive.read('autopkgtest-output/testsuite-stdout').decode('utf-8', 'replace').splitlines()
              case_re = re.compile(r'\(\d+/\d+\) ')
              cases = [index for index, line in enumerate(stderr) if case_re.search(line)]
              print('===== terminal stderr case =====')
              if cases:
                  pos = cases[-1]
                  for index in range(max(0, pos - 10), min(len(stderr), pos + 80)):
                      print(f'{index + 1}: {stderr[index]}')
              print('===== final stdout =====')
              for index, line in enumerate(stdout[-80:], start=max(1, len(stdout) - 79)):
                  print(f'{index}: {line}')
          PY
