name: PR72 Deb822 unit diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/pr72-deb822-unit.yml'

permissions:
  actions: read
  contents: read

jobs:
  focused-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Fetch exact PR72 source without checkout noise
        shell: bash
        run: |
          set -euo pipefail
          mkdir /tmp/source
          gh api "/repos/${GITHUB_REPOSITORY}/tarball/5aed66e8193c67b91af75dd8e6e3ea676a104b59" > /tmp/source.tar.gz
          tar -xzf /tmp/source.tar.gz --strip-components=1 -C /tmp/source

      - name: Run focused PR72 tests
        shell: bash
        working-directory: /tmp/source
        run: |
          set +e
          python3 -m unittest \
            tests.test_mmdebstrap_sourcesfilter_deb822 \
            tests.test_reproduction_harness -v
          status=$?
          set -e
          printf 'focused_status=%s\n' "$status"

      - name: Inspect failed reproduction preflight artifact
        shell: bash
        run: |
          set -euo pipefail
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/8760389758/zip" > /tmp/a.zip
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('/tmp/a.zip') as archive:
              for name in archive.namelist():
                  print(f'===== {name} =====')
                  print(archive.read(name).decode('utf-8', 'replace'))
          PY
