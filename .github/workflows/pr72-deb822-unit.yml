name: PR72 retained failure diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/pr72-deb822-unit.yml'

permissions:
  actions: read
  contents: read

jobs:
  artifact-failure:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Print exact terminal failure only
        shell: bash
        run: |
          set -euo pipefail
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/8762098688/zip" > /tmp/a.zip
          python3 - <<'PY'
          import re, zipfile
          with zipfile.ZipFile('/tmp/a.zip') as archive:
              stderr = archive.read('autopkgtest-output/testsuite-stderr').decode('utf-8', 'replace').splitlines()
              stdout = archive.read('autopkgtest-output/testsuite-stdout').decode('utf-8', 'replace').splitlines()
          cases = [i for i, line in enumerate(stderr) if re.search(r'\(\d+/\d+\) ', line)]
          print('===== terminal case =====')
          pos = cases[-1]
          print('\n'.join(stderr[max(0, pos - 8):pos + 8]))
          print('===== terminal stdout =====')
          print('\n'.join(stdout[-40:]))
          print('===== failure signatures =====')
          for source, lines in (('stderr', stderr[-250:]), ('stdout', stdout[-250:])):
              for line in lines:
                  if re.search(r'(E: |error|failed|mount|permission|not permitted|cap_sys_admin)', line, re.I):
                      print(f'{source}: {line}')
          PY
