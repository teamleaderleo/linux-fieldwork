name: PR72 Deb822 unit diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/pr72-deb822-unit.yml'

permissions:
  actions: read
  contents: read

jobs:
  focused-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run focused PR72 tests
        shell: bash
        run: |
          set +e
          python3 -m unittest \
            tests.test_mmdebstrap_sourcesfilter_deb822 \
            tests.test_reproduction_harness -v \
            > /tmp/focused.log 2>&1
          status=$?
          set -e
          cat /tmp/focused.log
          printf 'focused_status=%s\n' "$status"

      - name: Inspect failed reproduction preflight artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/8760389758/zip" > /tmp/a.zip
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('/tmp/a.zip') as archive:
              for name in archive.namelist():
                  print(f'===== {name} =====')
                  print(archive.read(name).decode('utf-8', 'replace'))
          PY
