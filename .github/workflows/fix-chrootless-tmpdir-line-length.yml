name: Wrap chrootless TMPDIR diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/fix-chrootless-tmpdir-line-length.yml'

permissions:
  contents: write

jobs:
  wrap:
    if: github.head_ref == 'fix/chrootless-target-tmpdir' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/chrootless-target-tmpdir
          fetch-depth: 0

      - name: Wrap the long diagnostic
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('upstream/mmdebstrap/mmdebstrap')
          text = path.read_text()
          old = '        error "chrootless target temporary path is not a directory: $tmpdir";\n'
          new = (
              '        error "chrootless target temporary path is not a directory:"\n'
              '          . " $tmpdir";\n'
          )
          if text.count(old) != 1:
              raise SystemExit(f'expected one long diagnostic, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Validate source contract
        shell: bash
        run: |
          set -euo pipefail
          perl -c upstream/mmdebstrap/mmdebstrap
          max_line_length="$(sed -e '/^__END__$/,$d' upstream/mmdebstrap/mmdebstrap | wc --max-line-length)"
          test "$max_line_length" -le 79
          python3 -m unittest tests.test_mmdebstrap_chrootless_tmpdir -v

      - name: Commit wrapped candidate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git diff origin/main -- \
            upstream/mmdebstrap/mmdebstrap \
            investigations/mmdebstrap-chrootless-env/run.sh \
            > investigations/mmdebstrap-chrootless-target-tmpdir/0001-target-contained-tmpdir.patch
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            upstream/mmdebstrap/mmdebstrap \
            investigations/mmdebstrap-chrootless-target-tmpdir/0001-target-contained-tmpdir.patch
          git rm .github/workflows/fix-chrootless-tmpdir-line-length.yml
          git commit -m 'Wrap chrootless TMPDIR diagnostic'
          git push origin HEAD:fix/chrootless-target-tmpdir
