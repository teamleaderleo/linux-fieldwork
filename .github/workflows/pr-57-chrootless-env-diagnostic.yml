name: PR 57 chrootless environment diagnostic

on:
  pull_request:
    paths:
      - 'upstream/mmdebstrap/mmdebstrap'
      - 'investigations/mmdebstrap-chrootless-env/**'
      - '.github/workflows/pr-57-chrootless-env-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  focused-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libdistro-info-perl \
            libdpkg-perl \
            uidmap
      - name: Syntax
        run: |
          perl -c upstream/mmdebstrap/mmdebstrap
          bash -n investigations/mmdebstrap-chrootless-env/run.sh
          bash -n investigations/mmdebstrap-chrootless-env/review-tmpdir-probe.sh
      - name: Run candidate regression
        id: candidate
        continue-on-error: true
        run: bash investigations/mmdebstrap-chrootless-env/run.sh
      - name: Probe target temporary-directory containment
        id: tmpdir
        continue-on-error: true
        run: bash investigations/mmdebstrap-chrootless-env/review-tmpdir-probe.sh
      - name: Post diagnostic summaries
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CANDIDATE_OUTCOME: ${{ steps.candidate.outcome }}
          TMPDIR_OUTCOME: ${{ steps.tmpdir.outcome }}
        run: |
          {
            printf 'Candidate regression outcome: `%s`\n\n' "$CANDIDATE_OUTCOME"
            printf 'Target temporary-directory probe outcome: `%s`\n\n' "$TMPDIR_OUTCOME"
            echo '```text'
            if [[ -f investigations/mmdebstrap-chrootless-env/results/summary.txt ]]; then
              cat investigations/mmdebstrap-chrootless-env/results/summary.txt
            fi
            echo '--- tmpdir review ---'
            if [[ -f investigations/mmdebstrap-chrootless-env/tmpdir-review-results/summary.txt ]]; then
              cat investigations/mmdebstrap-chrootless-env/tmpdir-review-results/summary.txt
            fi
            echo '```'
          } > diagnostic-comment.md
          gh pr comment "$PR_NUMBER" --body-file diagnostic-comment.md
      - name: Upload compact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-57-chrootless-env-diagnostic
          path: |
            investigations/mmdebstrap-chrootless-env/results/
            investigations/mmdebstrap-chrootless-env/tmpdir-review-results/
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve diagnostic status
        if: steps.candidate.outcome != 'success' || steps.tmpdir.outcome != 'success'
        run: exit 1
