name: Diagnose chrootless deep review

on:
  pull_request:
    paths:
      - '.github/workflows/diagnose-chrootless-deep-review.yml'

permissions:
  contents: write

jobs:
  diagnose:
    if: github.head_ref == 'fix/chrootless-target-tmpdir' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/chrootless-target-tmpdir
          fetch-depth: 0

      - name: Install review dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libdistro-info-perl \
            libdpkg-perl \
            libperl-critic-perl \
            perltidy \
            shellcheck \
            shfmt \
            uidmap

      - name: Capture traced review
        shell: bash
        run: |
          set +e
          bash -x investigations/mmdebstrap-unwritable-tmpdir/deep_review.sh \
            > investigations/mmdebstrap-chrootless-target-tmpdir/deep-review-trace.log 2>&1
          status=$?
          set -e
          printf '%s\n' "$status" \
            > investigations/mmdebstrap-chrootless-target-tmpdir/deep-review-trace.status
          tail -n 120 investigations/mmdebstrap-chrootless-target-tmpdir/deep-review-trace.log

      - name: Commit trace
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            investigations/mmdebstrap-chrootless-target-tmpdir/deep-review-trace.log \
            investigations/mmdebstrap-chrootless-target-tmpdir/deep-review-trace.status
          git rm .github/workflows/diagnose-chrootless-deep-review.yml
          git commit -m 'Capture chrootless deep-review failure'
          git push origin HEAD:fix/chrootless-target-tmpdir
