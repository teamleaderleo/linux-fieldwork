name: Verify coreutils install 12926

on:
  push:
    branches:
      - investigate/coreutils-install-just-created-12926
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out exact controlled coreutils candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: teamleaderleo/coreutils
          ref: b6f6e76138b27fd7a221a551aa6261752d513f19
          path: coreutils
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable
          components: clippy,rustfmt

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: coreutils

      - name: Verify exact source-only fence
        working-directory: coreutils
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = b6f6e76138b27fd7a221a551aa6261752d513f19
          test "$(git diff --name-only b13ee7a8319f439cb9a1ba550e98de665f9c4bb1..HEAD | sort)" = $'src/uu/install/locales/en-US.ftl\nsrc/uu/install/locales/fr-FR.ftl\nsrc/uu/install/src/install.rs\ntests/by-util/test_install.rs'
          test ! -e .fieldwork/refine-install-12926.patch
          test ! -e .github/workflows/fieldwork-refine-install-12926.yml
          git diff --check b13ee7a8319f439cb9a1ba550e98de665f9c4bb1..HEAD
          test -z "$(git status --porcelain)"
          git rev-parse HEAD:src/uu/install/src/install.rs
          git rev-parse HEAD:src/uu/install/locales/en-US.ftl
          git rev-parse HEAD:src/uu/install/locales/fr-FR.ftl
          git rev-parse HEAD:tests/by-util/test_install.rs

      - name: Check formatting
        working-directory: coreutils
        run: cargo fmt --all -- --check

      - name: Run ownership boundary tests
        working-directory: coreutils
        run: |
          set -euo pipefail
          for test_name in \
            test_install_refuses_to_overwrite_just_created_destination \
            test_install_refusal_preserves_original_simple_backup \
            test_install_numbered_backups_allow_repeated_destination \
            test_install_compare_noop_does_not_reserve_destination \
            test_install_missing_source_does_not_reserve_destination \
            test_install_copy_error_does_not_reserve_destination \
            test_install_post_copy_chown_failure_reserves_destination \
            test_install_strip_failure_releases_destination
          do
            cargo test --features install --no-default-features "$test_name"
          done

      - name: Run install test module
        working-directory: coreutils
        run: cargo test --features install --no-default-features --test tests test_install

      - name: Run focused clippy
        working-directory: coreutils
        run: cargo clippy --features install --no-default-features --all-targets -- -D warnings

      - name: Verify final identity and clean tree
        working-directory: coreutils
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = b6f6e76138b27fd7a221a551aa6261752d513f19
          git diff --check
          test -z "$(git status --porcelain)"
