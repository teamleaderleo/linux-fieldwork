name: Verify mmdebstrap explicit TMPDIR handling

on:
  push:
    branches:
      - investigate/mmdebstrap-unwritable-tmpdir
    paths:
      - "upstream/mmdebstrap/**"
      - "investigations/mmdebstrap-unwritable-tmpdir/**"
      - "patches/mmdebstrap-explicit-tmpdir.patch"
      - ".github/workflows/mmdebstrap-unwritable-tmpdir.yml"
  pull_request:
    paths:
      - "upstream/mmdebstrap/**"
      - "investigations/mmdebstrap-unwritable-tmpdir/**"
      - "patches/mmdebstrap-explicit-tmpdir.patch"
      - ".github/workflows/mmdebstrap-unwritable-tmpdir.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out Linux Fieldwork
        uses: actions/checkout@v4

      - name: Install mmdebstrap runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libdistro-info-perl \
            libdpkg-perl \
            uidmap

      - name: Check candidate syntax
        run: |
          perl -c upstream/mmdebstrap/mmdebstrap
          sh -n upstream/mmdebstrap/tests/fail-with-unwritable-tmpdir
          bash -n investigations/mmdebstrap-unwritable-tmpdir/run.sh

      - name: Verify explicit TMPDIR contract
        run: bash investigations/mmdebstrap-unwritable-tmpdir/run.sh

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mmdebstrap-unwritable-tmpdir
          path: investigations/mmdebstrap-unwritable-tmpdir/results/
          if-no-files-found: warn
