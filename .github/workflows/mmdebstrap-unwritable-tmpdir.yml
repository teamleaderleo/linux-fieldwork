name: Reproduce mmdebstrap unwritable TMPDIR

on:
  push:
    branches:
      - investigate/mmdebstrap-unwritable-tmpdir
    paths:
      - "upstream/mmdebstrap/**"
      - "investigations/mmdebstrap-unwritable-tmpdir/**"
      - "patches/mmdebstrap-explicit-tmpdir.patch"
      - ".github/workflows/mmdebstrap-unwritable-tmpdir.yml"
  pull_request:
    paths:
      - "upstream/mmdebstrap/**"
      - "investigations/mmdebstrap-unwritable-tmpdir/**"
      - "patches/mmdebstrap-explicit-tmpdir.patch"
      - ".github/workflows/mmdebstrap-unwritable-tmpdir.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-candidate:
    if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out investigation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply candidate patch
        run: |
          set -euxo pipefail
          git apply --check patches/mmdebstrap-explicit-tmpdir.patch
          git apply patches/mmdebstrap-explicit-tmpdir.patch
          chmod +x upstream/mmdebstrap/tests/fail-with-unwritable-tmpdir

      - name: Commit patched source and regression test
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add upstream/mmdebstrap/mmdebstrap \
            upstream/mmdebstrap/coverage.txt \
            upstream/mmdebstrap/tests/fail-with-unwritable-tmpdir
          git commit -m "Fail when an explicit TMPDIR is unusable"
          git push origin HEAD:${GITHUB_REF_NAME}

  verify:
    if: github.event_name != 'push' || github.actor == 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out Linux Fieldwork
        uses: actions/checkout@v4

      - name: Install mmdebstrap runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libdistro-info-perl \
            libdpkg-perl \
            uidmap

      - name: Run focused reproduction
        run: bash investigations/mmdebstrap-unwritable-tmpdir/run.sh

      - name: Upload reproduction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mmdebstrap-unwritable-tmpdir
          path: investigations/mmdebstrap-unwritable-tmpdir/results/
          if-no-files-found: warn
