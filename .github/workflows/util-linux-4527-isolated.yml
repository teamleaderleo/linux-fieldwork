name: util-linux 4527 isolated runtime arm64

on:
  pull_request:
    branches:
      - automation/util-linux-4527-arm-base-20260808
    paths:
      - .github/util-linux-4527-arm-trigger

permissions:
  contents: read

jobs:
  reproduce-stale-udev-type:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30

    steps:
      - name: Check out current util-linux
        uses: actions/checkout@v4
        with:
          repository: util-linux/util-linux
          ref: d26ad4d8c2f0b25c97cc860ea8b2059e65f54c5e
          fetch-depth: 1
          persist-credentials: false

      - name: Install build and filesystem tools
        shell: bash
        run: |
          set -euxo pipefail
          sudo add-apt-repository -y --no-update --enable-source
          sudo apt-get update
          sudo apt-get build-dep -y util-linux
          sudo apt-get install -y --no-install-recommends meson ninja-build libsystemd-dev e2fsprogs udev

      - name: Build current mount with libmount udev support
        shell: bash
        run: |
          set -euxo pipefail
          meson setup build -Dbuild-libmount-udev-support=enabled
          meson compile -C build mount
          MOUNT_BIN="$(find build -type f -name mount -perm -111 -print -quit)"
          test -n "$MOUNT_BIN"
          echo "MOUNT_BIN=$PWD/$MOUNT_BIN" >>"$GITHUB_ENV"
          "$MOUNT_BIN" --version

      - name: Reproduce and classify
        shell: bash
        run: |
          set -euxo pipefail
          IMG="$RUNNER_TEMP/libmount-stale-type.img"
          MNT="$RUNNER_TEMP/libmount-stale-type.mnt"
          LOG="$RUNNER_TEMP/libmount-stale-type.log"
          truncate -s 256M "$IMG"
          mkdir -p "$MNT"
          LOOP="$(sudo losetup --find --show "$IMG")"
          cleanup() {
            set +e
            mountpoint -q "$MNT" && sudo umount "$MNT"
            sudo losetup -d "$LOOP"
          }
          trap cleanup EXIT

          if ! sudo udevadm control --ping; then
            UDEVD="$(command -v systemd-udevd || true)"
            [[ -n "$UDEVD" ]] || UDEVD=/lib/systemd/systemd-udevd
            sudo "$UDEVD" --daemon
          fi

          trigger_change() {
            sudo udevadm trigger --action=change --sysname-match="$(basename "$LOOP")"
            sudo udevadm settle
          }
          udev_type() {
            sudo udevadm info --query=property --name="$LOOP" | sed -n 's/^ID_FS_TYPE=//p'
          }
          auto_mount() {
            set +e
            sudo env LIBMOUNT_DEBUG=all "$MOUNT_BIN" "$LOOP" "$MNT" >>"$LOG" 2>&1
            local rc=$?
            set -e
            if mountpoint -q "$MNT"; then
              sudo umount "$MNT"
              printf '%s %s\n' "$rc" 1
            else
              printf '%s %s\n' "$rc" 0
            fi
          }

          sudo mkfs.ext3 -F "$LOOP"
          trigger_change
          TYPE_EXT3="$(udev_type)"
          echo "initial_udev_type=$TYPE_EXT3" | tee -a "$LOG"
          test "$TYPE_EXT3" = ext3

          sudo mkfs.ext4 -F "$LOOP"
          BLKID_TYPE="$(sudo blkid -s TYPE -o value "$LOOP")"
          TYPE_IMMEDIATE="$(udev_type)"
          echo "blkid_after_ext4=$BLKID_TYPE" | tee -a "$LOG"
          echo "udev_immediate_after_ext4=$TYPE_IMMEDIATE" | tee -a "$LOG"
          test "$BLKID_TYPE" = ext4

          read -r IMMEDIATE_RC IMMEDIATE_MOUNTED < <(auto_mount)
          echo "auto_immediate_rc=$IMMEDIATE_RC" | tee -a "$LOG"
          echo "auto_immediate_mounted=$IMMEDIATE_MOUNTED" | tee -a "$LOG"

          sudo "$MOUNT_BIN" -t ext4 "$LOOP" "$MNT"
          mountpoint -q "$MNT"
          sudo umount "$MNT"
          echo "explicit_ext4_control=pass" | tee -a "$LOG"

          sudo udevadm settle
          TYPE_AFTER_SETTLE="$(udev_type)"
          echo "udev_after_settle=$TYPE_AFTER_SETTLE" | tee -a "$LOG"
          read -r SETTLE_RC SETTLE_MOUNTED < <(auto_mount)
          echo "auto_after_settle_rc=$SETTLE_RC" | tee -a "$LOG"
          echo "auto_after_settle_mounted=$SETTLE_MOUNTED" | tee -a "$LOG"

          trigger_change
          TYPE_AFTER_TRIGGER="$(udev_type)"
          echo "udev_after_explicit_change=$TYPE_AFTER_TRIGGER" | tee -a "$LOG"
          test "$TYPE_AFTER_TRIGGER" = ext4
          read -r TRIGGER_RC TRIGGER_MOUNTED < <(auto_mount)
          echo "auto_after_explicit_change_rc=$TRIGGER_RC" | tee -a "$LOG"
          echo "auto_after_explicit_change_mounted=$TRIGGER_MOUNTED" | tee -a "$LOG"
          test "$TRIGGER_RC" -eq 0
          test "$TRIGGER_MOUNTED" -eq 1

          if [[ "$TYPE_IMMEDIATE" = ext3 && "$IMMEDIATE_RC" -ne 0 && "$IMMEDIATE_MOUNTED" -eq 0 &&
                "$TYPE_AFTER_SETTLE" = ext4 && "$SETTLE_RC" -eq 0 && "$SETTLE_MOUNTED" -eq 1 ]]; then
            echo "classification=CONFIRMED_RACE_SETTLE_REFRESHES" | tee -a "$LOG"
          elif [[ "$TYPE_IMMEDIATE" = ext3 && "$IMMEDIATE_RC" -ne 0 && "$IMMEDIATE_MOUNTED" -eq 0 &&
                  "$TYPE_AFTER_SETTLE" = ext3 && "$SETTLE_RC" -ne 0 && "$SETTLE_MOUNTED" -eq 0 ]]; then
            echo "classification=STALE_PERSISTS_UNTIL_EXPLICIT_CHANGE" | tee -a "$LOG"
          elif [[ "$TYPE_IMMEDIATE" = ext4 && "$IMMEDIATE_RC" -eq 0 && "$IMMEDIATE_MOUNTED" -eq 1 ]]; then
            echo "classification=UDEV_REFRESHED_BEFORE_IMMEDIATE_MOUNT" | tee -a "$LOG"
          else
            echo "classification=UNEXPECTED_INTERMEDIATE_STATE" | tee -a "$LOG"
            cat "$LOG"
            exit 1
          fi

          cp "$LOG" "$GITHUB_WORKSPACE/util-linux-4527-receipt.txt"
          cat "$GITHUB_WORKSPACE/util-linux-4527-receipt.txt"

      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: util-linux-4527-arm64-${{ github.run_id }}-${{ github.run_attempt }}
          path: util-linux-4527-receipt.txt
          if-no-files-found: warn
          retention-days: 7
