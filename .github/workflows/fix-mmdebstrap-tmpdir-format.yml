name: Fix mmdebstrap TMPDIR formatting

on:
  pull_request:
    paths:
      - "upstream/mmdebstrap/mmdebstrap"
      - ".github/workflows/fix-mmdebstrap-tmpdir-format.yml"

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Correct Perl nesting indentation
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("upstream/mmdebstrap/mmdebstrap")
          source = path.read_text(encoding="utf-8")
          old = """        my @tempdir_options = (TMPDIR => 1);
          if (defined $ENV{TMPDIR} && $ENV{TMPDIR} ne '') {
              @tempdir_options = (DIR => $ENV{TMPDIR});
          }
          $options->{root}
            = tempdir('mmdebstrap.XXXXXXXXXX', @tempdir_options);
          """
          # YAML removes the common shell indentation. Build the replacement
          # explicitly so the Perl indentation is unambiguous.
          new = (
              "        my @tempdir_options = (TMPDIR => 1);\n"
              "        if (defined $ENV{TMPDIR} && $ENV{TMPDIR} ne '') {\n"
              "            @tempdir_options = (DIR => $ENV{TMPDIR});\n"
              "        }\n"
              "        $options->{root}\n"
              "          = tempdir('mmdebstrap.XXXXXXXXXX', @tempdir_options);\n"
          )
          if source.count(old) != 1:
              raise SystemExit("expected exactly one unformatted TMPDIR block")
          path.write_text(source.replace(old, new, 1), encoding="utf-8")
          PY
          rm .github/workflows/fix-mmdebstrap-tmpdir-format.yml
          perl -c upstream/mmdebstrap/mmdebstrap

      - name: Commit formatting correction
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Match mmdebstrap Perl indentation"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
