name: Cloud Hypervisor QCOW refblock ownership ENOSPC audit

on:
  push:
    branches:
      - research/ch-qcow-refblock-self-refcount-enospc-r609f
    paths:
      - .github/workflows/ch-qcow-refblock-self-refcount-enospc-r609f.yml
      - investigations/cloud-hypervisor-qcow-refblock-self-refcount-enospc/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refblock-ownership:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CH_SHA: 1af93ac7035cda77cd87b0c18b1134ebb0928052
      TEST_NAME: formats::qcow::metadata::unit_tests::refblock_recursive_ownership_enospc_reopen_reuses_live_block
      REALISM_TEST: formats::qcow::metadata::unit_tests::refblock_recursive_enospc_from_parser_free_list
    steps:
      - name: Check out Fieldwork carrier
        uses: actions/checkout@v4
        with:
          path: fieldwork
          persist-credentials: false

      - name: Check out exact Cloud Hypervisor source
        uses: actions/checkout@v4
        with:
          repository: cloud-hypervisor/cloud-hypervisor
          ref: ${{ env.CH_SHA }}
          path: cloud-hypervisor
          persist-credentials: false

      - name: Pin exact source and Rust
        id: source
        working-directory: cloud-hypervisor
        shell: bash
        run: |
          set -euxo pipefail
          rustup toolchain install 1.89.0 --profile minimal
          rustup component add --toolchain 1.89.0 rustfmt
          rustup override set 1.89.0
          rustc --version | tee ../refblock-rust-version.txt
          cargo --version | tee ../refblock-cargo-version.txt
          git rev-parse HEAD | tee ../refblock-source-sha.txt
          test "$(git rev-parse HEAD)" = "$CH_SHA"
          git status --short | tee ../refblock-source-status-before.txt
          test ! -s ../refblock-source-status-before.txt

      - name: Apply exact-current discriminators only
        id: probe
        working-directory: cloud-hypervisor
        shell: bash
        run: |
          set -euxo pipefail
          python3 ../fieldwork/investigations/cloud-hypervisor-qcow-refblock-self-refcount-enospc/apply_probe.py
          python3 ../fieldwork/investigations/cloud-hypervisor-qcow-refblock-self-refcount-enospc/apply_realism_probe.py
          cargo fmt --all
          cargo fmt --all -- --check
          git diff --check
          git diff -- block/src/formats/qcow/metadata.rs > ../refblock-probe.diff
          test "$(git diff --name-only | tr '\n' ' ')" = "block/src/formats/qcow/metadata.rs "

      - name: Build and discover focused tests
        id: discover
        working-directory: cloud-hypervisor
        shell: bash
        run: |
          set -euxo pipefail
          cargo test --locked -p block --lib --no-run
          cargo test --locked -p block --lib -- --list | tee ../refblock-test-list.txt
          grep -F "$TEST_NAME: test" ../refblock-test-list.txt
          grep -F "$REALISM_TEST: test" ../refblock-test-list.txt

      - name: Execute recursive-refblock ENOSPC witness
        id: focused
        working-directory: cloud-hypervisor
        shell: bash
        run: |
          set -euxo pipefail
          cargo test --locked -p block --lib "$TEST_NAME" -- --exact --nocapture \
            2>&1 | tee ../refblock-focused.log
          grep -F "REFBLOCK_OWNERSHIP_FAIL pre_close" ../refblock-focused.log
          grep -F "REFBLOCK_OWNERSHIP_FAIL reopened" ../refblock-focused.log
          grep -F "REFBLOCK_OWNERSHIP_FAIL allocator_reuse" ../refblock-focused.log
          grep -F "REFBLOCK_OWNERSHIP_FAIL second_reopen" ../refblock-focused.log

      - name: Execute parser-free-list realism control
        id: realism
        working-directory: cloud-hypervisor
        shell: bash
        run: |
          set -euxo pipefail
          cargo test --locked -p block --lib "$REALISM_TEST" -- --exact --nocapture \
            2>&1 | tee ../refblock-realism.log
          grep -F "REFBLOCK_REALISM parser_free" ../refblock-realism.log
          grep -F "REFBLOCK_REALISM pre_close" ../refblock-realism.log
          grep -F "REFBLOCK_REALISM reopened" ../refblock-realism.log
          grep -F "REFBLOCK_REALISM allocator_reuse" ../refblock-realism.log

      - name: Final hygiene
        id: hygiene
        working-directory: cloud-hypervisor
        shell: bash
        run: |
          set -euxo pipefail
          cargo fmt --all -- --check
          git diff --check
          git status --short | tee ../refblock-final-status.txt

      - name: Write receipt
        if: always()
        shell: bash
        run: |
          {
            echo "fieldwork_head=${GITHUB_SHA}"
            echo "source=$CH_SHA"
            echo "source_gate=${{ steps.source.outcome }}"
            echo "probe_gate=${{ steps.probe.outcome }}"
            echo "discover_gate=${{ steps.discover.outcome }}"
            echo "focused_gate=${{ steps.focused.outcome }}"
            echo "realism_gate=${{ steps.realism.outcome }}"
            echo "hygiene_gate=${{ steps.hygiene.outcome }}"
            test -f refblock-source-sha.txt && cat refblock-source-sha.txt
            test -f refblock-rust-version.txt && cat refblock-rust-version.txt
          } | tee refblock-receipt.txt

      - name: Upload execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ch-qcow-refblock-self-refcount-enospc-r609f
          if-no-files-found: warn
          path: |
            refblock-receipt.txt
            refblock-source-sha.txt
            refblock-rust-version.txt
            refblock-cargo-version.txt
            refblock-source-status-before.txt
            refblock-probe.diff
            refblock-test-list.txt
            refblock-focused.log
            refblock-realism.log
            refblock-final-status.txt
