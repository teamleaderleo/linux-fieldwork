name: Apply mmdebstrap chrootless canonical PATH

on:
  pull_request:
    branches:
      - investigation/mmdebstrap-chrootless-env-precedent

permissions:
  contents: write

jobs:
  apply:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    steps:
      - name: Check out candidate branch
        uses: actions/checkout@v4
        with:
          ref: fix/mmdebstrap-chrootless-canonical-path
          fetch-depth: 0

      - name: Apply source and documentation change
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('upstream/mmdebstrap/mmdebstrap')
          source = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str) -> None:
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(
                      f'unexpected replacement count {count} for marker:\n{old}'
                  )
              source = source.replace(old, new)

          replace_once(
              "sub chrootless_dpkg_environment {\n"
              "    my $root   = shift;\n"
              "    my $tmpdir = \"$root/tmp\";\n",
              "sub chrootless_dpkg_environment {\n"
              "    my $root     = shift;\n"
              "    my $dpkgpath = shift;\n"
              "    my $tmpdir   = \"$root/tmp\";\n\n"
              "    if (!defined $dpkgpath || $dpkgpath eq '') {\n"
              "        error \"cannot determine chrootless maintainer-script PATH\";\n"
              "    }\n",
          )
          replace_once(
              "    my @names = qw(\n"
              "      PATH\n"
              "      DEBIAN_FRONTEND\n",
              "    my @names = qw(\n"
              "      DEBIAN_FRONTEND\n",
          )
          replace_once(
              "    my @result = ('-i', \"TMPDIR=$tmpdir\");\n",
              "    my @result = ('-i', \"PATH=$dpkgpath\", \"TMPDIR=$tmpdir\");\n",
          )
          replace_once(
              "                    chrootless_dpkg_environment($options->{root}),\n",
              "                    chrootless_dpkg_environment(\n"
              "                        $options->{root}, $options->{dpkgpath}),\n",
          )
          replace_once(
              "              = chrootless_dpkg_environment($options->{root});\n",
              "              = chrootless_dpkg_environment(\n"
              "                $options->{root}, $options->{dpkgpath});\n",
          )
          replace_once(
              "    my $defaultpath = `eval \\$(apt-config shell v DPkg::Path); printf %s \\$v`;\n"
              "    if (length $ENV{PATH}) {\n",
              "    my $defaultpath = `eval \\$(apt-config shell v DPkg::Path); printf %s \\$v`;\n"
              "    $options->{dpkgpath} = $defaultpath;\n"
              "    if (length $ENV{PATH}) {\n",
          )
          replace_once(
              "scripts are additionally run with a small environment containing only\n"
              "variables required by dpkg, debconf, locale handling, reproducibility,\n"
              "and foreign-architecture execution. Apt itself retains its environment\n"
              "so that proxy and repository authentication continue to work.\n",
              "scripts are additionally run with a small environment. Their PATH is\n"
              "apt's configured DPkg::Path rather than the caller's executable search path.\n"
              "The environment also contains the target temporary directory, mmdebstrap's\n"
              "fixed noninteractive debconf and C.UTF-8 locale values, reproducibility\n"
              "controls, foreign-architecture state, and fakeroot state when active. Apt\n"
              "itself retains its environment so that proxy and repository authentication\n"
              "continue to work.\n",
          )

          path.write_text(source, encoding='utf-8')
          PY

      - name: Format and validate with Debian sid
        run: |
          docker run --rm \
            --volume "$PWD:/work" \
            --workdir /work/upstream/mmdebstrap \
            debian:sid-slim \
            sh -euxc '
              apt-get update
              apt-get install --yes --no-install-recommends \
                libperl-critic-perl \
                perltidy
              perltidy < mmdebstrap > /tmp/mmdebstrap.tdy
              mv /tmp/mmdebstrap.tdy mmdebstrap
              perl -c mmdebstrap
              perlcritic --severity 4 --verbose 8 mmdebstrap
              pod2man mmdebstrap >/dev/null
              test "$(sed -e "/^__END__$/,\$d" mmdebstrap | wc --max-line-length)" -le 79
            '
          git diff --check

      - name: Verify exact source boundary
        run: |
          grep -F '"PATH=$dpkgpath"' upstream/mmdebstrap/mmdebstrap
          grep -F '$options->{dpkgpath} = $defaultpath;' upstream/mmdebstrap/mmdebstrap
          test "$(grep -F 'chrootless_dpkg_environment(' upstream/mmdebstrap/mmdebstrap | wc -l)" -eq 2
          if sed -n '/sub chrootless_dpkg_environment/,/sub chrootless_unsafe_environment/p' \
            upstream/mmdebstrap/mmdebstrap | grep -F '      PATH'; then
            echo 'caller PATH remains in the chrootless allowlist' >&2
            exit 1
          fi

      - name: Commit candidate source
        run: |
          rm .github/workflows/apply-mmdebstrap-chrootless-canonical-path.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Canonicalize chrootless maintainer-script PATH'
          git push origin HEAD:fix/mmdebstrap-chrootless-canonical-path
