name: Cloud Hypervisor embedded TDVF Payload baseline v2

on:
  push:
    branches: [research/ch-tdvf-embedded-payload]
    paths:
      - .github/workflows/ch-tdvf-embedded-payload-baseline-v2.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  embedded-payload-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CH_SHA: 1af93ac7035cda77cd87b0c18b1134ebb0928052
      TDSHIM_SHA: e3a692b1e58c59b40647d919f6de8ae69b2c8846
      FEATURES: arch/tdx,arch/kvm,hypervisor/tdx,hypervisor/kvm
      PROBE: x86_64::tdx::embedded_payload_probe_tests::tdvf_embedded_payload_metadata_and_bytes_are_accepted

    steps:
      - uses: actions/checkout@v4
        with:
          path: fieldwork
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: cloud-hypervisor/cloud-hypervisor
          ref: ${{ env.CH_SHA }}
          path: cloud-hypervisor
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: confidential-containers/td-shim
          ref: ${{ env.TDSHIM_SHA }}
          path: td-shim
          persist-credentials: false

      - name: Pin sources, contract, and exact-current owner
        id: source
        shell: bash
        run: |
          set -euxo pipefail
          rustup toolchain install 1.89.0 --profile minimal
          rustup toolchain install nightly --profile minimal --component rustfmt
          rustup override set 1.89.0 --path cloud-hypervisor
          test "$(git -C cloud-hypervisor rev-parse HEAD)" = "$CH_SHA"
          test "$(git -C td-shim rev-parse HEAD)" = "$TDSHIM_SHA"
          git -C cloud-hypervisor rev-parse HEAD | tee embedded-payload-v2-ch-sha.txt
          git -C td-shim rev-parse HEAD | tee embedded-payload-v2-tdshim-sha.txt
          grep -F 'The RawDataSize of Payload must be' td-shim/td-shim-interface/src/metadata.rs | tee embedded-payload-v2-tdshim-rule.txt
          grep -F 'TD-Shim with container OS' td-shim/doc/tdshim_spec.md | tee embedded-payload-v2-tdshim-usecase.txt
          python3 - <<'PY' | tee embedded-payload-v2-owner.txt
          from pathlib import Path
          text = Path('cloud-hypervisor/vmm/src/vm.rs').read_text()
          start = text.index('TdvfSectionType::Payload => {')
          end = text.index('TdvfSectionType::PayloadParam => {', start)
          arm = text[start:end]
          assert 'if let Some(payload_file) = self.kernel.as_mut()' in arm
          assert 'firmware_file' not in arm
          assert 'section.data_offset' not in arm
          assert 'section.data_size' not in arm
          print('TDVF_EMBEDDED_PAYLOAD_OWNER external_kernel_gate=true firmware_raw_copy=false')
          PY

      - name: Execute byte-valid embedded Payload fixture
        id: fixture
        working-directory: cloud-hypervisor
        shell: bash
        run: |
          set -euxo pipefail
          python3 ../fieldwork/investigations/cloud-hypervisor-tdvf-embedded-payload/apply_probe.py
          cargo +nightly fmt --all
          cargo +nightly fmt --all -- --check
          git diff --check
          git diff -- arch/src/x86_64/tdx/mod.rs > ../embedded-payload-v2-probe.diff
          cargo test --locked -p arch -p hypervisor --features "$FEATURES" --lib "$PROBE" -- --exact --nocapture \
            2>&1 | tee ../embedded-payload-v2-fixture.log
          grep -F 'TDVF_EMBEDDED_PAYLOAD_PARSE offset=0x1000 raw=0x10 address=0x200000 memory=0x1000 type=Payload' ../embedded-payload-v2-fixture.log
          grep -F 'TDVF_EMBEDDED_PAYLOAD_BYTES len=16 first=0x7c last=0x7c' ../embedded-payload-v2-fixture.log

      - name: Prove production embedded-copy invariant loses
        id: invariant
        shell: bash
        run: |
          set +e
          python3 - <<'PY' > embedded-payload-v2-invariant.log 2>&1
          from pathlib import Path
          text = Path('cloud-hypervisor/vmm/src/vm.rs').read_text()
          start = text.index('TdvfSectionType::Payload => {')
          end = text.index('TdvfSectionType::PayloadParam => {', start)
          arm = text[start:end]
          assert 'firmware_file' in arm and 'section.data_offset' in arm and 'section.data_size' in arm, (
              'spec-valid embedded Payload has no firmware raw-data copy path'
          )
          PY
          rc=$?
          set -e
          echo "TDVF_EMBEDDED_PAYLOAD_INVARIANT_RC=$rc" | tee embedded-payload-v2-invariant-status.txt
          cat embedded-payload-v2-invariant.log
          test "$rc" -ne 0
          grep -F 'spec-valid embedded Payload has no firmware raw-data copy path' embedded-payload-v2-invariant.log

      - name: Write receipt
        if: always()
        shell: bash
        run: |
          {
            echo "fieldwork_head=${GITHUB_SHA}"
            echo "cloud_hypervisor=$CH_SHA"
            echo "td_shim=$TDSHIM_SHA"
            echo "source_contract_gate=${{ steps.source.outcome }}"
            echo "fixture_gate=${{ steps.fixture.outcome }}"
            echo "production_invariant_expected_red=${{ steps.invariant.outcome }}"
            test -f embedded-payload-v2-invariant-status.txt && cat embedded-payload-v2-invariant-status.txt
          } | tee embedded-payload-v2-receipt.txt

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ch-tdvf-embedded-payload-baseline-v2
          if-no-files-found: warn
          path: |
            embedded-payload-v2-*.txt
            embedded-payload-v2-*.log
            embedded-payload-v2-*.diff
