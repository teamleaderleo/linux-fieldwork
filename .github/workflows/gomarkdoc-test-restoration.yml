name: Probe Nixpkgs gomarkdoc test restoration

on:
  pull_request:
    paths:
      - "investigations/gomarkdoc-test-restoration/**"
      - "tests/test_gomarkdoc_test_restoration.py"
      - ".github/workflows/gomarkdoc-test-restoration.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out exact Linux Fieldwork head
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Validate matrix code
        run: |
          python3 -m py_compile \
            investigations/gomarkdoc-test-restoration/run_matrix.py \
            tests/test_gomarkdoc_test_restoration.py
          python3 -m unittest tests.test_gomarkdoc_test_restoration -v
          nix-instantiate --parse \
            investigations/gomarkdoc-test-restoration/matrix.nix >/dev/null

      - name: Run exact package matrix
        run: |
          python3 investigations/gomarkdoc-test-restoration/run_matrix.py \
            --results \
            "$GITHUB_WORKSPACE/evidence/gomarkdoc-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --case-timeout 1200

      - name: Upload complete package evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gomarkdoc-test-restoration-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/gomarkdoc-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          retention-days: 14

  artifact-receipt:
    if: always()
    needs: matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download exact matrix artifact
        uses: actions/download-artifact@v4
        with:
          name: gomarkdoc-test-restoration-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence

      - name: Validate provenance and complete case set
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib

          summaries = list(pathlib.Path("evidence").rglob("summary.json"))
          if len(summaries) != 1:
              raise SystemExit(f"expected one summary, found {summaries!r}")
          summary = json.loads(summaries[0].read_text(encoding="utf-8"))
          actions = summary["github_actions"]
          assert summary["schema_version"] == 1
          assert actions["run_id"] == os.environ["GITHUB_RUN_ID"]
          assert actions["run_attempt"] == os.environ["GITHUB_RUN_ATTEMPT"]
          assert actions["head_sha"] == os.environ["GITHUB_SHA"]
          assert len(summary["cases"]) == 15
          assert set(summary["classifications"]) == {
              "known-good",
              "known-bad",
              "current",
          }
          assert summary["controls"]["known_good_baseline_passed"] is True
          assert summary["controls"]["known_bad_baseline_failed"] is True
          assert summary["controls"]["no_case_timed_out"] is True
          assert summary["valid_reproduction"] is True
          print(f"current_decision={summary['current_decision']}")
          for label, classification in summary["classifications"].items():
              print(f"{label}={classification}")
          PY
