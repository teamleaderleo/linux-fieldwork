name: Probe Nixpkgs gomarkdoc test restoration

on:
  pull_request:
    paths:
      - "investigations/gomarkdoc-test-restoration/**"
      - "tests/test_gomarkdoc_test_restoration.py"
      - ".github/workflows/gomarkdoc-test-restoration.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out exact Linux Fieldwork head
        uses: actions/checkout@v4

      - name: Install pinned Determinate Nix v3.21.9
        uses: DeterminateSystems/determinate-nix-action@61cbfe2efc2d4e7a8a6d56967c3c1058e846c858

      - name: Validate matrix code
        run: |
          python3 -m py_compile \
            investigations/gomarkdoc-test-restoration/run_matrix.py \
            tests/test_gomarkdoc_test_restoration.py
          python3 -m unittest tests.test_gomarkdoc_test_restoration -v
          nix-instantiate --parse \
            investigations/gomarkdoc-test-restoration/matrix.nix >/dev/null

      - name: Run exact package matrix
        run: |
          python3 investigations/gomarkdoc-test-restoration/run_matrix.py \
            --results \
            "$GITHUB_WORKSPACE/evidence/gomarkdoc-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --known-bad acd02b8771d0546f96ee281ac45c3a6f81b9bfba \
            --case-timeout 1200

      - name: Upload complete package evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gomarkdoc-test-restoration-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/gomarkdoc-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          retention-days: 14

  artifact-receipt:
    if: always()
    needs: matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download exact matrix artifact
        uses: actions/download-artifact@v4
        with:
          name: gomarkdoc-test-restoration-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence

      - name: Validate provenance and complete case set
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib

          def require(condition: bool, message: str) -> None:
              if not condition:
                  raise SystemExit(message)

          summaries = list(pathlib.Path("evidence").rglob("summary.json"))
          require(len(summaries) == 1, f"expected one summary, found {summaries!r}")
          summary = json.loads(summaries[0].read_text(encoding="utf-8"))
          actions = summary.get("github_actions", {})
          require(summary.get("schema_version") == 1, "unsupported summary schema")
          require(
              actions.get("run_id") == os.environ["GITHUB_RUN_ID"],
              "summary run_id does not match this workflow run",
          )
          require(
              actions.get("run_attempt") == os.environ["GITHUB_RUN_ATTEMPT"],
              "summary run_attempt does not match this workflow attempt",
          )
          require(
              actions.get("head_sha") == os.environ["GITHUB_SHA"],
              "summary head_sha does not match this workflow head",
          )
          require(len(summary.get("cases", [])) == 15, "matrix does not contain 15 cases")
          require(
              set(summary.get("classifications", {}))
              == {"known-good", "known-bad", "current"},
              "matrix classification set is incomplete",
          )
          controls = summary.get("controls", {})
          require(
              controls.get("known_good_baseline_passed") is True,
              "reported good baseline did not pass",
          )
          require(
              controls.get("known_bad_baseline_failed") is True,
              "reported bad baseline did not fail",
          )
          require(
              controls.get("no_case_timed_out") is True,
              "one or more matrix cases timed out",
          )
          require(
              summary.get("valid_reproduction") is True,
              "summary does not classify the matrix as a valid reproduction",
          )
          print(f"current_decision={summary['current_decision']}")
          for label, classification in summary["classifications"].items():
              print(f"{label}={classification}")
          PY
