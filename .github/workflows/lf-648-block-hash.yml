name: lf-648 block_hash validation

on:
  push:
    branches: [lf-648-block-hash-exec]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      UPSTREAM_HEAD: ab9d0f2c5c44dd72ce253e6e894e2f0edc9205b4
    steps:
      - uses: actions/checkout@v4
      - name: Validate current block_hash and one-line candidate
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential clang zlib1g-dev liblzma-dev liblzo2-dev liblz4-dev libzstd-dev
          rm -rf /tmp/sq /tmp/base-src /tmp/add-src /tmp/evidence
          mkdir -p /tmp/base-src /tmp/add-src /tmp/evidence
          uname -a | tee /tmp/evidence/environment.txt
          clang --version | tee -a /tmp/evidence/environment.txt
          git --version | tee -a /tmp/evidence/environment.txt

          git clone https://github.com/plougher/squashfs-tools.git /tmp/sq
          git -C /tmp/sq checkout --detach "$UPSTREAM_HEAD"
          test "$(git -C /tmp/sq rev-parse HEAD)" = "$UPSTREAM_HEAD"
          git -C /tmp/sq show -s --format='%H %cI %s' HEAD | tee /tmp/evidence/upstream-head.txt

          # The hash table has 2^20 slots.  Check that moving the mask before
          # the shift preserves the intended unsigned 20-bit index for every
          # low-10-bit size/count combination, with and without the on-disk
          # uncompressed-block flag that triggers the signed shift.
          python3 <<'PY' | tee /tmp/evidence/hash-equivalence.txt
          for flag in (0, 0x01000000):
              for low in range(1024):
                  size = flag | low
                  for blocks in range(1024):
                      ref = ((((size & 0xffffffff) << 10) & 0xffffffff) & 0xffc00) | (blocks & 0x3ff)
                      new = ((size & 0x3ff) << 10) | (blocks & 0x3ff)
                      assert ref == new
                      assert 0 <= new < 1048576
          print('ALL 2,097,152 HASH EQUIVALENCE CASES PASSED')
          PY

          printf Z > /tmp/base-src/file
          ln /tmp/base-src/file /tmp/base-src/file-hardlink
          printf Z > /tmp/add-src/duplicate-file

          make -C /tmp/sq/squashfs-tools -j2 mksquashfs
          cp /tmp/sq/squashfs-tools/mksquashfs /tmp/mksquashfs-generator
          /tmp/mksquashfs-generator /tmp/base-src /tmp/base.sqfs -noI -no-fragments -nopad -noappend -no-progress | tee /tmp/evidence/generator.log

          # Unsanitized current-source behavior is the functional control.
          cp /tmp/base.sqfs /tmp/control.sqfs
          /tmp/mksquashfs-generator /tmp/add-src /tmp/control.sqfs -noI -no-progress > /tmp/evidence/control-append.log 2>&1
          grep -q 'Scanning existing filesystem' /tmp/evidence/control-append.log
          grep -q 'Number of duplicate files found 1' /tmp/evidence/control-append.log

          SAN='-O1 -g -fsanitize=address,shift -fno-sanitize-recover=all -fno-omit-frame-pointer'
          make -C /tmp/sq/squashfs-tools clean
          make -C /tmp/sq/squashfs-tools -j2 CC=clang EXTRA_CFLAGS="$SAN" EXTRA_LDFLAGS='-fsanitize=address,shift' mksquashfs
          cp /tmp/sq/squashfs-tools/mksquashfs /tmp/mksquashfs-baseline
          export ASAN_OPTIONS='halt_on_error=1:abort_on_error=1:detect_leaks=0'
          export UBSAN_OPTIONS='halt_on_error=1:print_stacktrace=1'

          cp /tmp/base.sqfs /tmp/baseline.sqfs
          set +e
          /tmp/mksquashfs-baseline /tmp/add-src /tmp/baseline.sqfs -noI -no-progress > /tmp/evidence/baseline.log 2>&1
          st=$?
          set -e
          echo "status=$st" >> /tmp/evidence/baseline.log
          test "$st" -ne 0
          grep -q 'left shift of 16777217 by 10 places cannot be represented in type' /tmp/evidence/baseline.log
          grep -q 'block_hash' /tmp/evidence/baseline.log

          python3 <<'PY'
          from pathlib import Path
          p = Path('/tmp/sq/squashfs-tools/mksquashfs.c')
          s = p.read_text()
          old = '\treturn ((size << 10) & 0xffc00) | (blocks & 0x3ff);\n'
          new = '\treturn ((size & 0x3ff) << 10) | (blocks & 0x3ff);\n'
          if s.count(old) != 1:
              raise SystemExit(f'block_hash anchor count={s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
          git -C /tmp/sq diff --check
          git -C /tmp/sq diff -- squashfs-tools/mksquashfs.c | tee /tmp/evidence/candidate.diff
          test "$(git -C /tmp/sq diff --name-only)" = 'squashfs-tools/mksquashfs.c'

          make -C /tmp/sq/squashfs-tools clean
          make -C /tmp/sq/squashfs-tools -j2
          echo NORMAL_FULL_BUILD_OK | tee /tmp/evidence/normal-build.txt

          make -C /tmp/sq/squashfs-tools clean
          make -C /tmp/sq/squashfs-tools -j2 CC=clang EXTRA_CFLAGS="$SAN" EXTRA_LDFLAGS='-fsanitize=address,shift' mksquashfs
          cp /tmp/sq/squashfs-tools/mksquashfs /tmp/mksquashfs-candidate
          cp /tmp/base.sqfs /tmp/candidate.sqfs
          /tmp/mksquashfs-candidate /tmp/add-src /tmp/candidate.sqfs -noI -no-progress > /tmp/evidence/candidate.log 2>&1
          ! grep -Eq 'runtime error:|AddressSanitizer|UndefinedBehaviorSanitizer' /tmp/evidence/candidate.log
          grep -q 'Scanning existing filesystem' /tmp/evidence/candidate.log
          grep -q 'Number of duplicate files found 1' /tmp/evidence/candidate.log

          sha256sum /tmp/base.sqfs /tmp/control.sqfs /tmp/candidate.sqfs | tee /tmp/evidence/fixture-sha256.txt
          echo 'ALL LF-648 BLOCK_HASH ASSERTIONS PASSED' | tee /tmp/evidence/result.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lf-648-block-hash-evidence
          path: /tmp/evidence
