name: Audit explicit pull request carrier state

on:
  pull_request:
    paths:
      - "tools/audit_pr_carrier_state.py"
      - "tests/test_audit_pr_carrier_state.py"
      - "investigations/live-pr-carrier-state-audit/**"
      - ".github/workflows/live-pr-carrier-state-audit.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  carrier-state-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out proposed repository state
        uses: actions/checkout@v4

      - name: Run focused classifier controls
        run: |
          python3 -m unittest -v tests.test_audit_pr_carrier_state
          python3 -m py_compile \
            tools/audit_pr_carrier_state.py \
            tests/test_audit_pr_carrier_state.py

      - name: Inventory current open pull requests
        id: inventory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 200 \
            --json number,title,body,url,state \
            > evidence/open-pull-requests.json

          set +e
          python3 tools/audit_pr_carrier_state.py --json \
            evidence/open-pull-requests.json \
            > evidence/findings.json
          audit_status=$?
          set -e

          printf '%s\n' "$audit_status" > evidence/audit-status.txt
          cat evidence/findings.json
          exit "$audit_status"

      - name: Upload routing inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-pr-carrier-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14
