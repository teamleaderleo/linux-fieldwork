name: lf-629-repro
on:
  push:
    branches: [lf-629-repro-exec]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zlib1g-dev liblzma-dev liblzo2-dev liblz4-dev libzstd-dev libattr1-dev
      - name: Exact-head v2 ASan/UBSan reproducer and build checks
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/lf629-v2; mkdir -p "$OUT"
          exec > >(tee "$OUT/run.log") 2>&1
          set -x
          CURRENT=5436ec0e5bf50dd8f7fe182d9ffd92b0861cb491
          V2_URL='https://sourceforge.net/projects/squashfs/files/squashfs/squashfs2.2-r2/squashfs2.2-r2.tar.gz/download'
          uname -a; gcc --version | head -1; git --version; curl --version | head -1

          git clone https://github.com/plougher/squashfs-tools.git /tmp/sq
          cd /tmp/sq; git checkout --detach "$CURRENT"
          test "$(git rev-parse HEAD)" = "$CURRENT"
          git show -s --format='CURRENT %H %cI %s'
          make -C squashfs-tools clean
          make -C squashfs-tools EXTRA_CFLAGS='-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer' EXTRA_LDFLAGS='-fsanitize=address,undefined' unsquashfs
          cp squashfs-tools/unsquashfs "$OUT/unsquashfs-current"

          curl -L --fail --retry 3 "$V2_URL" -o "$OUT/squashfs2.2-r2.tar.gz"
          sha256sum "$OUT/squashfs2.2-r2.tar.gz" | tee "$OUT/v2-tarball.sha256"
          tar tzf "$OUT/squashfs2.2-r2.tar.gz" | tee "$OUT/v2-tarball-files.txt"
          mkdir /tmp/v2src
          tar xzf "$OUT/squashfs2.2-r2.tar.gz" -C /tmp/v2src
          V2DIR=$(find /tmp/v2src -type f -name mksquashfs.c -printf '%h\n' | head -1)
          test -n "$V2DIR"; cd "$V2DIR"
          echo "V2DIR=$V2DIR"
          OLD_CFLAGS='-I. -D_FILE_OFFSET_BITS=64 -D_LARGEFILE_SOURCE -D_GNU_SOURCE -O2 -fcommon -include sys/sysmacros.h'
          make clean || true
          make CFLAGS="$OLD_CFLAGS" mksquashfs
          ./mksquashfs -version 2>&1 | tee "$OUT/v2-generator-version.txt" || true

          cat > /tmp/layout-v2.c <<'EOF'
          #include <stddef.h>
          #include <stdio.h>
          #include "squashfs_fs.h"
          int main(void) {
            printf("fragments=%zu fragments_size=%zu inode_table_start=%zu inode_table_start_size=%zu reg_size=%zu reg_fragment=%zu file_type=%d\n",
              offsetof(struct squashfs_super_block, fragments), sizeof(((struct squashfs_super_block *)0)->fragments),
              offsetof(struct squashfs_super_block, inode_table_start), sizeof(((struct squashfs_super_block *)0)->inode_table_start),
              sizeof(struct squashfs_reg_inode_header), offsetof(struct squashfs_reg_inode_header, fragment), SQUASHFS_FILE_TYPE);
            return 0;
          }
          EOF
          gcc $OLD_CFLAGS /tmp/layout-v2.c -o /tmp/layout-v2
          /tmp/layout-v2 | tee "$OUT/layout-v2.txt"

          rm -rf /tmp/src-v2 /tmp/v2-*-out
          mkdir /tmp/src-v2; printf Z > /tmp/src-v2/file
          ./mksquashfs /tmp/src-v2 "$OUT/v2-base.sqfs" -noI -noD -noF -nopad
          "$OUT/unsquashfs-current" -s "$OUT/v2-base.sqfs" | tee "$OUT/v2-super-current.txt"

          python3 - "$OUT" <<'PY'
          import hashlib, pathlib, re, struct, sys
          out=pathlib.Path(sys.argv[1]); data=bytearray((out/'v2-base.sqfs').read_bytes())
          v={k:int(x) for k,x in re.findall(r'(fragments|fragments_size|inode_table_start|inode_table_start_size|reg_size|reg_fragment|file_type)=(\d+)',(out/'layout-v2.txt').read_text())}
          assert struct.unpack_from('<I',data,0)[0]==0x73717368
          def u(off,size):
            assert size in (4,8), size
            return int.from_bytes(data[off:off+size], 'little')
          count=u(v['fragments'],v['fragments_size']); it=u(v['inode_table_start'],v['inode_table_start_size'])
          hdr=struct.unpack_from('<H',data,it)[0]
          assert count==1 and (hdr & 0x8000), (count,hex(hdr),it)
          inode_payload=it+2
          inode_word=struct.unpack_from('<H',data,inode_payload)[0]
          assert (inode_word & 0xf)==v['file_type'], (inode_word,v['file_type'])
          pos=inode_payload+v['reg_fragment']; orig=struct.unpack_from('<I',data,pos)[0]
          assert orig==count-1==0, (orig,count)
          print(f'V2_FIXTURE count={count} inode_table_start={it} metadata_header=0x{hdr:04x} fragment_field_offset={pos} original_fragment={orig}')
          print(f'BASE size={len(data)} sha256={hashlib.sha256(data).hexdigest()}')
          for name,val in [('count_minus_1',count-1),('count',count),('count_plus_1',count+1)]:
            img=bytearray(data); struct.pack_into('<I',img,pos,val); p=out/f'v2-{name}.sqfs'; p.write_bytes(img)
            print(f'WROTE {p.name} fragment={val} sha256={hashlib.sha256(img).hexdigest()}')
          PY

          export ASAN_OPTIONS='halt_on_error=1:abort_on_error=1:detect_leaks=0'
          export UBSAN_OPTIONS='halt_on_error=1:print_stacktrace=1'
          run_case() {
            label=$1 image=$2 bin=$3; dest=/tmp/${label}-out; rm -rf "$dest"
            set +e; "$bin" -processors 1 -no-progress -d "$dest" "$image" >"$OUT/$label.log" 2>&1; status=$?; set -e
            echo "CASE $label status=$status"; cat "$OUT/$label.log"; echo "ENDCASE $label"; echo "$status" > "$OUT/$label.status"
          }
          CUR="$OUT/unsquashfs-current"
          run_case current_v2_count_minus_1 "$OUT/v2-count_minus_1.sqfs" "$CUR"
          test "$(cat "$OUT/current_v2_count_minus_1.status")" -eq 0; cmp /tmp/src-v2/file /tmp/current_v2_count_minus_1-out/file
          run_case current_v2_count "$OUT/v2-count.sqfs" "$CUR"
          test "$(cat "$OUT/current_v2_count.status")" -ne 0
          grep -q 'AddressSanitizer: heap-buffer-overflow' "$OUT/current_v2_count.log"; grep -q 'unsquash-2.c' "$OUT/current_v2_count.log"
          run_case current_v2_count_plus_1 "$OUT/v2-count_plus_1.sqfs" "$CUR"
          test "$(cat "$OUT/current_v2_count_plus_1.status")" -ne 0
          grep -q 'fragment index in inode too large (fragment: 2)' "$OUT/current_v2_count_plus_1.log"
          ! grep -q 'AddressSanitizer:' "$OUT/current_v2_count_plus_1.log"

          cd "$V2DIR"
          ./mksquashfs /tmp/src-v2 "$OUT/v2-zero-fragments.sqfs" -noI -noD -noF -no-fragments -nopad
          run_case current_v2_zero_fragments "$OUT/v2-zero-fragments.sqfs" "$CUR"
          test "$(cat "$OUT/current_v2_zero_fragments.status")" -eq 0; cmp /tmp/src-v2/file /tmp/current_v2_zero_fragments-out/file

          cd /tmp/sq
          sed -i 's/if(fragment > sBlk.s.fragments)/if(fragment >= sBlk.s.fragments)/' squashfs-tools/unsquash-2.c squashfs-tools/unsquash-3.c
          git diff --check
          git diff -- squashfs-tools/unsquash-2.c squashfs-tools/unsquash-3.c | tee "$OUT/candidate.diff"
          make -C squashfs-tools clean
          make -C squashfs-tools EXTRA_CFLAGS='-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer' EXTRA_LDFLAGS='-fsanitize=address,undefined' unsquashfs
          cp squashfs-tools/unsquashfs "$OUT/unsquashfs-candidate"; CAND="$OUT/unsquashfs-candidate"
          run_case candidate_v2_count_minus_1 "$OUT/v2-count_minus_1.sqfs" "$CAND"
          test "$(cat "$OUT/candidate_v2_count_minus_1.status")" -eq 0; cmp /tmp/src-v2/file /tmp/candidate_v2_count_minus_1-out/file
          run_case candidate_v2_count "$OUT/v2-count.sqfs" "$CAND"
          test "$(cat "$OUT/candidate_v2_count.status")" -ne 0
          grep -q 'fragment index in inode too large (fragment: 1)' "$OUT/candidate_v2_count.log"; ! grep -q 'AddressSanitizer:' "$OUT/candidate_v2_count.log"
          run_case candidate_v2_count_plus_1 "$OUT/v2-count_plus_1.sqfs" "$CAND"
          test "$(cat "$OUT/candidate_v2_count_plus_1.status")" -ne 0; grep -q 'fragment index in inode too large (fragment: 2)' "$OUT/candidate_v2_count_plus_1.log"
          run_case candidate_v2_zero_fragments "$OUT/v2-zero-fragments.sqfs" "$CAND"
          test "$(cat "$OUT/candidate_v2_zero_fragments.status")" -eq 0; cmp /tmp/src-v2/file /tmp/candidate_v2_zero_fragments-out/file

          make -C squashfs-tools clean
          make -C squashfs-tools | tee "$OUT/full-build.log"
          set +e
          make -C squashfs-tools -n test >"$OUT/native-test-target.log" 2>&1
          native_status=$?
          set -e
          echo "NATIVE_TEST_DRYRUN_STATUS=$native_status" | tee -a "$OUT/native-test-target.log"
          if [ "$native_status" -eq 0 ]; then make -C squashfs-tools test | tee -a "$OUT/native-test-target.log"; fi
          echo 'ALL V2 ASSERTIONS AND BUILD CHECKS PASSED'
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lf-629-v2-evidence
          path: /tmp/lf629-v2
          if-no-files-found: warn
