name: lf-629-repro

on:
  push:
    branches:
      - lf-629-repro-exec
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build and run exact-head reproducer
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/lf629
          mkdir -p "$OUT"
          exec > >(tee "$OUT/run.log") 2>&1
          set -x

          CURRENT=5436ec0e5bf50dd8f7fe182d9ffd92b0861cb491
          V3=26c9d659049def8288455ad8e4766337b721388b

          uname -a
          gcc --version
          git --version
          python3 --version

          git clone https://github.com/plougher/squashfs-tools.git /tmp/squashfs-tools
          cd /tmp/squashfs-tools
          git checkout --detach "$CURRENT"
          test "$(git rev-parse HEAD)" = "$CURRENT"
          git status --short
          git show -s --format='CURRENT %H %cI %s'

          make -C squashfs-tools clean
          make -C squashfs-tools \
            CONFIG=1 GZIP_SUPPORT=1 XZ_SUPPORT=0 LZO_SUPPORT=0 LZ4_SUPPORT=0 ZSTD_SUPPORT=0 \
            XATTR_SUPPORT=0 XATTR_OS_SUPPORT=0 \
            CFLAGS='-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer' \
            EXTRA_LDFLAGS='-fsanitize=address,undefined' unsquashfs
          cp squashfs-tools/unsquashfs "$OUT/unsquashfs-current"
          "$OUT/unsquashfs-current" -version

          git worktree add --detach /tmp/sq-v3 "$V3"
          cd /tmp/sq-v3/squashfs-tools
          git show -s --format='V3_GENERATOR %H %cI %s'
          make clean || true
          make mksquashfs
          ./mksquashfs -version || true

          cat > /tmp/layout-v3.c <<'EOF'
          #include <stddef.h>
          #include <stdio.h>
          #include "squashfs_fs.h"
          int main(void) {
            printf("super_size=%zu root_inode=%zu fragments=%zu inode_table_start=%zu\n",
              sizeof(struct squashfs_super_block),
              offsetof(struct squashfs_super_block, root_inode),
              offsetof(struct squashfs_super_block, fragments),
              offsetof(struct squashfs_super_block, inode_table_start));
            printf("reg_size=%zu reg_fragment=%zu\n",
              sizeof(struct squashfs_reg_inode_header),
              offsetof(struct squashfs_reg_inode_header, fragment));
            return 0;
          }
          EOF
          gcc -I. /tmp/layout-v3.c -o /tmp/layout-v3
          /tmp/layout-v3 | tee "$OUT/layout-v3.txt"

          rm -rf /tmp/src-v3 /tmp/v3-out-*
          mkdir -p /tmp/src-v3
          printf 'Z' > /tmp/src-v3/file
          ./mksquashfs /tmp/src-v3 "$OUT/v3-base.sqfs" -noI -noD -noF -nopad -noappend -no-progress

          python3 - "$OUT" <<'PY'
          import pathlib, re, struct, sys
          out = pathlib.Path(sys.argv[1])
          layout = (out / 'layout-v3.txt').read_text()
          vals = {k:int(v) for k,v in re.findall(r'(super_size|root_inode|fragments|inode_table_start|reg_size|reg_fragment)=(\d+)', layout)}
          data = bytearray((out / 'v3-base.sqfs').read_bytes())
          magic, = struct.unpack_from('<I', data, 0)
          assert magic == 0x73717368, hex(magic)
          major_minor, = struct.unpack_from('<I', data, 28)
          major = major_minor & 0xffff
          minor = major_minor >> 16
          assert major == 3, (major, minor)
          root_inode, = struct.unpack_from('<Q', data, vals['root_inode'])
          fragments, = struct.unpack_from('<I', data, vals['fragments'])
          inode_table_start, = struct.unpack_from('<Q', data, vals['inode_table_start'])
          root_block = root_inode >> 16
          root_off = root_inode & 0xffff
          assert root_block == 0, root_block
          assert fragments == 1, fragments
          assert root_off == vals['reg_size'], (root_off, vals['reg_size'])
          meta = inode_table_start
          hdr, = struct.unpack_from('<H', data, meta)
          assert hdr & 0x8000, hex(hdr)
          payload = hdr & 0x7fff
          assert payload >= root_off, payload
          frag_pos = meta + 2 + vals['reg_fragment']
          original, = struct.unpack_from('<I', data, frag_pos)
          assert original == fragments - 1 == 0, (original, fragments)
          print(f'V3_FIXTURE major={major}.{minor} fragments={fragments} root_inode=0x{root_inode:x} root_off={root_off} inode_table_start={inode_table_start} metadata_header=0x{hdr:04x} payload={payload} fragment_field_file_offset={frag_pos} original_fragment={original}')
          for name, value in [('count_minus_1', fragments - 1), ('count', fragments), ('count_plus_1', fragments + 1)]:
              img = bytearray(data)
              struct.pack_into('<I', img, frag_pos, value)
              path = out / f'v3-{name}.sqfs'
              path.write_bytes(img)
              print(f'WROTE {path.name} fragment={value}')
          PY

          cd /tmp/squashfs-tools
          BASE="$OUT/unsquashfs-current"
          export ASAN_OPTIONS='halt_on_error=1:abort_on_error=1:detect_leaks=0'
          export UBSAN_OPTIONS='halt_on_error=1:print_stacktrace=1'

          run_case() {
            label=$1
            image=$2
            bin=$3
            dest="/tmp/${label}-out"
            rm -rf "$dest"
            set +e
            "$bin" -processors 1 -no-progress -d "$dest" "$image" >"$OUT/${label}.log" 2>&1
            status=$?
            set -e
            echo "CASE $label status=$status"
            cat "$OUT/${label}.log"
            echo "ENDCASE $label"
            printf '%s\n' "$status" > "$OUT/${label}.status"
          }

          run_case current_v3_count_minus_1 "$OUT/v3-count_minus_1.sqfs" "$BASE"
          test "$(cat "$OUT/current_v3_count_minus_1.status")" -eq 0
          cmp /tmp/src-v3/file /tmp/current_v3_count_minus_1-out/file

          run_case current_v3_count "$OUT/v3-count.sqfs" "$BASE"
          grep -q 'AddressSanitizer: heap-buffer-overflow' "$OUT/current_v3_count.log"

          run_case current_v3_count_plus_1 "$OUT/v3-count_plus_1.sqfs" "$BASE"
          test "$(cat "$OUT/current_v3_count_plus_1.status")" -ne 0
          grep -q 'fragment index in inode too large (fragment: 2)' "$OUT/current_v3_count_plus_1.log"
          if grep -q 'AddressSanitizer:' "$OUT/current_v3_count_plus_1.log"; then exit 41; fi

          cd /tmp/sq-v3/squashfs-tools
          ./mksquashfs /tmp/src-v3 "$OUT/v3-zero-fragments.sqfs" -noI -noD -noF -no-fragments -nopad -noappend -no-progress
          run_case current_v3_zero_fragments "$OUT/v3-zero-fragments.sqfs" "$BASE"
          test "$(cat "$OUT/current_v3_zero_fragments.status")" -eq 0
          cmp /tmp/src-v3/file /tmp/current_v3_zero_fragments-out/file

          cd /tmp/squashfs-tools
          sed -i 's/if(fragment > sBlk.s.fragments)/if(fragment >= sBlk.s.fragments)/' squashfs-tools/unsquash-2.c squashfs-tools/unsquash-3.c
          git diff --check
          git diff -- squashfs-tools/unsquash-2.c squashfs-tools/unsquash-3.c | tee "$OUT/candidate.diff"
          test "$(git diff --numstat | awk '{s+=$1+$2} END{print s+0}')" -eq 4
          make -C squashfs-tools clean
          make -C squashfs-tools \
            CONFIG=1 GZIP_SUPPORT=1 XZ_SUPPORT=0 LZO_SUPPORT=0 LZ4_SUPPORT=0 ZSTD_SUPPORT=0 \
            XATTR_SUPPORT=0 XATTR_OS_SUPPORT=0 \
            CFLAGS='-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer' \
            EXTRA_LDFLAGS='-fsanitize=address,undefined' unsquashfs
          cp squashfs-tools/unsquashfs "$OUT/unsquashfs-candidate"
          CAND="$OUT/unsquashfs-candidate"

          run_case candidate_v3_count_minus_1 "$OUT/v3-count_minus_1.sqfs" "$CAND"
          test "$(cat "$OUT/candidate_v3_count_minus_1.status")" -eq 0
          cmp /tmp/src-v3/file /tmp/candidate_v3_count_minus_1-out/file

          run_case candidate_v3_count "$OUT/v3-count.sqfs" "$CAND"
          test "$(cat "$OUT/candidate_v3_count.status")" -ne 0
          grep -q 'fragment index in inode too large (fragment: 1)' "$OUT/candidate_v3_count.log"
          if grep -q 'AddressSanitizer:' "$OUT/candidate_v3_count.log"; then exit 42; fi

          run_case candidate_v3_count_plus_1 "$OUT/v3-count_plus_1.sqfs" "$CAND"
          test "$(cat "$OUT/candidate_v3_count_plus_1.status")" -ne 0
          grep -q 'fragment index in inode too large (fragment: 2)' "$OUT/candidate_v3_count_plus_1.log"
          if grep -q 'AddressSanitizer:' "$OUT/candidate_v3_count_plus_1.log"; then exit 43; fi

          run_case candidate_v3_zero_fragments "$OUT/v3-zero-fragments.sqfs" "$CAND"
          test "$(cat "$OUT/candidate_v3_zero_fragments.status")" -eq 0
          cmp /tmp/src-v3/file /tmp/candidate_v3_zero_fragments-out/file

          echo '--- V2 HISTORY DISCOVERY ---'
          cd /tmp/squashfs-tools
          git log --all --format='%H %cI %s' -- squashfs-tools/squashfs_fs.h | tail -40 | tee "$OUT/v2-history.txt"
          found=''
          while read -r c; do
            if git show "$c:squashfs-tools/squashfs_fs.h" 2>/dev/null | grep -Eq '^#define[[:space:]]+SQUASHFS_MAJOR[[:space:]]+2([[:space:]]|$)'; then
              found=$c
              break
            fi
          done < <(git rev-list --all -- squashfs-tools/squashfs_fs.h)
          echo "V2_MAJOR_COMMIT=${found:-NONE}" | tee "$OUT/v2-discovery.txt"
          find . -maxdepth 3 -type f -iname '*2.2*' -o -iname '*2_2*' | sort | head -100 | tee -a "$OUT/v2-discovery.txt"

          echo 'ALL V3 ASSERTIONS PASSED'

      - name: Upload reproducer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lf-629-repro-evidence
          path: /tmp/lf629
          if-no-files-found: warn
