name: lf-629-repro
on:
  push:
    branches: [lf-629-repro-exec]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zlib1g-dev liblzma-dev liblzo2-dev liblz4-dev libzstd-dev libattr1-dev
      - name: Exact-head v3 ASan/UBSan reproducer
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/lf629-v3; mkdir -p "$OUT"
          exec > >(tee "$OUT/run.log") 2>&1
          set -x
          CURRENT=5436ec0e5bf50dd8f7fe182d9ffd92b0861cb491
          V3=26c9d659049def8288455ad8e4766337b721388b
          uname -a; gcc --version | head -1; git --version
          git clone https://github.com/plougher/squashfs-tools.git /tmp/sq
          cd /tmp/sq; git checkout --detach "$CURRENT"
          test "$(git rev-parse HEAD)" = "$CURRENT"
          git show -s --format='CURRENT %H %cI %s'
          make -C squashfs-tools clean
          make -C squashfs-tools EXTRA_CFLAGS='-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer' EXTRA_LDFLAGS='-fsanitize=address,undefined' unsquashfs
          cp squashfs-tools/unsquashfs "$OUT/unsquashfs-current"

          git worktree add --detach /tmp/sq-v3 "$V3"
          cd /tmp/sq-v3/squashfs-tools
          git show -s --format='V3_GENERATOR %H %cI %s'
          OLD_CFLAGS='-I. -D_FILE_OFFSET_BITS=64 -D_LARGEFILE_SOURCE -D_GNU_SOURCE -O2 -fcommon -include sys/sysmacros.h'
          make CFLAGS="$OLD_CFLAGS" mksquashfs
          ./mksquashfs -version | tee "$OUT/v3-generator-version.txt"
          cat > /tmp/layout-v3.c <<'EOF'
          #include <stddef.h>
          #include <stdio.h>
          #include "squashfs_fs.h"
          int main(void) {
            printf("root_inode=%zu fragments=%zu inode_table_start=%zu reg_size=%zu reg_fragment=%zu file_type=%d\n",
              offsetof(struct squashfs_super_block, root_inode), offsetof(struct squashfs_super_block, fragments),
              offsetof(struct squashfs_super_block, inode_table_start), sizeof(struct squashfs_reg_inode_header),
              offsetof(struct squashfs_reg_inode_header, fragment), SQUASHFS_FILE_TYPE);
            return 0;
          }
          EOF
          gcc $OLD_CFLAGS /tmp/layout-v3.c -o /tmp/layout-v3
          /tmp/layout-v3 | tee "$OUT/layout-v3.txt"
          rm -rf /tmp/src-v3 /tmp/v3-*-out
          mkdir /tmp/src-v3; printf Z > /tmp/src-v3/file
          ./mksquashfs /tmp/src-v3 "$OUT/v3-base.sqfs" -noI -noD -noF -nopad -noappend -no-progress

          python3 - "$OUT" <<'PY'
          import hashlib, pathlib, re, struct, sys
          out=pathlib.Path(sys.argv[1]); data=bytearray((out/'v3-base.sqfs').read_bytes())
          v={k:int(x) for k,x in re.findall(r'(root_inode|fragments|inode_table_start|reg_size|reg_fragment|file_type)=(\d+)',(out/'layout-v3.txt').read_text())}
          assert struct.unpack_from('<I',data,0)[0]==0x73717368
          root=struct.unpack_from('<Q',data,v['root_inode'])[0]; count=struct.unpack_from('<I',data,v['fragments'])[0]
          it=struct.unpack_from('<Q',data,v['inode_table_start'])[0]; hdr=struct.unpack_from('<H',data,it)[0]
          assert count==1 and (hdr & 0x8000), (count,hex(hdr))
          root_block,root_off=root>>16,root&0xffff; assert root_block==0 and root_off>=v['reg_size']
          inode_payload=it+2
          inode_word=struct.unpack_from('<H',data,inode_payload)[0]; assert (inode_word & 0xf)==v['file_type'], (inode_word,v['file_type'])
          pos=inode_payload+v['reg_fragment']; orig=struct.unpack_from('<I',data,pos)[0]
          assert orig==count-1==0, (orig,count)
          print(f'V3_FIXTURE generator=3.3 count={count} root_inode=0x{root:x} root_off={root_off} inode_table_start={it} metadata_header=0x{hdr:04x} fragment_field_offset={pos} original_fragment={orig}')
          print(f'BASE size={len(data)} sha256={hashlib.sha256(data).hexdigest()}')
          for name,val in [('count_minus_1',count-1),('count',count),('count_plus_1',count+1)]:
            img=bytearray(data); struct.pack_into('<I',img,pos,val); p=out/f'v3-{name}.sqfs'; p.write_bytes(img)
            print(f'WROTE {p.name} fragment={val} sha256={hashlib.sha256(img).hexdigest()}')
          PY

          export ASAN_OPTIONS='halt_on_error=1:abort_on_error=1:detect_leaks=0'
          export UBSAN_OPTIONS='halt_on_error=1:print_stacktrace=1'
          run_case() {
            label=$1 image=$2 bin=$3; dest=/tmp/${label}-out; rm -rf "$dest"
            set +e; "$bin" -processors 1 -no-progress -d "$dest" "$image" >"$OUT/$label.log" 2>&1; status=$?; set -e
            echo "CASE $label status=$status"; cat "$OUT/$label.log"; echo "ENDCASE $label"; echo "$status" > "$OUT/$label.status"
          }
          CUR="$OUT/unsquashfs-current"
          run_case current_v3_count_minus_1 "$OUT/v3-count_minus_1.sqfs" "$CUR"
          test "$(cat "$OUT/current_v3_count_minus_1.status")" -eq 0; cmp /tmp/src-v3/file /tmp/current_v3_count_minus_1-out/file
          run_case current_v3_count "$OUT/v3-count.sqfs" "$CUR"
          test "$(cat "$OUT/current_v3_count.status")" -ne 0
          grep -q 'AddressSanitizer: heap-buffer-overflow' "$OUT/current_v3_count.log"; grep -q 'unsquash-3.c' "$OUT/current_v3_count.log"
          run_case current_v3_count_plus_1 "$OUT/v3-count_plus_1.sqfs" "$CUR"
          test "$(cat "$OUT/current_v3_count_plus_1.status")" -ne 0
          grep -q 'fragment index in inode too large (fragment: 2)' "$OUT/current_v3_count_plus_1.log"
          ! grep -q 'AddressSanitizer:' "$OUT/current_v3_count_plus_1.log"
          cd /tmp/sq-v3/squashfs-tools
          ./mksquashfs /tmp/src-v3 "$OUT/v3-zero-fragments.sqfs" -noI -noD -noF -no-fragments -nopad -noappend -no-progress
          run_case current_v3_zero_fragments "$OUT/v3-zero-fragments.sqfs" "$CUR"
          test "$(cat "$OUT/current_v3_zero_fragments.status")" -eq 0; cmp /tmp/src-v3/file /tmp/current_v3_zero_fragments-out/file

          cd /tmp/sq
          sed -i 's/if(fragment > sBlk.s.fragments)/if(fragment >= sBlk.s.fragments)/' squashfs-tools/unsquash-2.c squashfs-tools/unsquash-3.c
          git diff --check
          git diff -- squashfs-tools/unsquash-2.c squashfs-tools/unsquash-3.c | tee "$OUT/candidate.diff"
          make -C squashfs-tools clean
          make -C squashfs-tools EXTRA_CFLAGS='-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer' EXTRA_LDFLAGS='-fsanitize=address,undefined' unsquashfs
          cp squashfs-tools/unsquashfs "$OUT/unsquashfs-candidate"; CAND="$OUT/unsquashfs-candidate"
          run_case candidate_v3_count_minus_1 "$OUT/v3-count_minus_1.sqfs" "$CAND"
          test "$(cat "$OUT/candidate_v3_count_minus_1.status")" -eq 0; cmp /tmp/src-v3/file /tmp/candidate_v3_count_minus_1-out/file
          run_case candidate_v3_count "$OUT/v3-count.sqfs" "$CAND"
          test "$(cat "$OUT/candidate_v3_count.status")" -ne 0
          grep -q 'fragment index in inode too large (fragment: 1)' "$OUT/candidate_v3_count.log"; ! grep -q 'AddressSanitizer:' "$OUT/candidate_v3_count.log"
          run_case candidate_v3_count_plus_1 "$OUT/v3-count_plus_1.sqfs" "$CAND"
          test "$(cat "$OUT/candidate_v3_count_plus_1.status")" -ne 0; grep -q 'fragment index in inode too large (fragment: 2)' "$OUT/candidate_v3_count_plus_1.log"
          run_case candidate_v3_zero_fragments "$OUT/v3-zero-fragments.sqfs" "$CAND"
          test "$(cat "$OUT/candidate_v3_zero_fragments.status")" -eq 0; cmp /tmp/src-v3/file /tmp/candidate_v3_zero_fragments-out/file
          echo 'ALL V3 ASSERTIONS PASSED'
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lf-629-v3-evidence
          path: /tmp/lf629-v3
          if-no-files-found: warn
